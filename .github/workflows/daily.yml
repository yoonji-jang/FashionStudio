name: daily

# 6단계 하루 게시물 만들기. Claude(daily-feed 스킬)가 주제·상품·문구를 정하고 코디컷·캐러셀·캡션까지 만든다.
# 7단계: 코디컷 후보를 여러 장 만들고 Claude(image-reviewer)가 검수해 표지를 고른다.
# - Actions 탭에서 "Run workflow": 버튼 하나로 주제 → 상품 → 코디컷 → 캐러셀 → 캡션
#   (Secret CLAUDE_CODE_OAUTH_TOKEN 필요. 기획 파일(plan)을 주면 Claude 없이 그 기획으로 만들기만 한다)
# - 작업 브랜치에 커밋 메시지에 [daily] 와 [plan:경로] 를 넣어 푸시하면 그 기획으로 만든다
#   (푸시는 샌드박스로 돈다. [live] 를 넣으면 정식 Photoroom 키로 워터마크 없이 만든다)
# 8단계: 다 만들면 텔레그램으로 미리보기를 보낸다 (Secret TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 가 있을 때).
# 게시는 여기서 하지 않고 publish 워크플로가 /ok 답장을 확인해 올린다.
# 결과는 artifact 와 daily-results 브랜치의 <날짜>-run<번호>/ 에 올라간다
# (쇼핑몰 원본 사진은 올리지 않음). 매일 자동 실행은 9단계에서 붙인다.
on:
  workflow_dispatch:
    inputs:
      account:
        description: 계정
        default: women
      date:
        description: 게시 날짜 YYYY-MM-DD (빈칸이면 내일)
        default: ""
      plan:
        description: 이미 쓴 기획 파일 (빈칸이면 Claude 가 기획)
        default: ""
      outfit:
        description: 코디컷 (photoroom 또는 none)
        default: photoroom
      sandbox:
        description: Photoroom 무료 샌드박스 (코디컷에 워터마크)
        type: boolean
        default: true
      collect:
        description: 주제 검색어로 지그재그 새 상품 수집
        type: boolean
        default: false
      review:
        description: 기획 파일로 만들 때도 Claude 로 이미지 검수 (CLAUDE_CODE_OAUTH_TOKEN 필요)
        type: boolean
        default: true
      preview:
        description: 텔레그램으로 미리보기 보내기 (샌드박스 결과는 게시 버튼 없이)
        type: boolean
        default: true
  push:
    branches: ["claude/**"]
    paths: ["samples/**", "tools/plan.py", "tools/review.py", ".claude/**", ".github/workflows/daily.yml"]

permissions:
  contents: write
  id-token: write

jobs:
  daily:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[daily]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 워크플로 단위로 묶으면 같은 푸시에서 건너뛴 다른 워크플로가 대기 중인 실행을 취소해서 job 단위로 둔다
    concurrency:
      group: daily-${{ inputs.account || 'women' }}
      cancel-in-progress: false
    env:
      ACCOUNT: ${{ inputs.account || 'women' }}
      PLAN: ${{ inputs.plan }}
      OUTFIT: ${{ inputs.outfit || 'photoroom' }}
      COLLECT: ${{ inputs.collect && '1' || '' }}
      SANDBOX: ${{ ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[live]')) || inputs.sandbox) && '1' || '' }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      REVIEW: ${{ (github.event_name == 'push' || inputs.review) && '1' || '' }}
      PREVIEW: ${{ (github.event_name == 'push' || inputs.preview) && '1' || '' }}
      HAS_TELEGRAM: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
      RUN: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync ${{ inputs.collect && '--group scout' || '' }}
      - if: inputs.collect
        run: uv run playwright install --with-deps chromium
      - name: 준비 (날짜, 기획 파일, Photoroom 키)
        env:
          INPUT_DATE: ${{ inputs.date }}
          PHOTOROOM_KEY: ${{ secrets.PHOTOROOM_API_KEY }}
          SANDBOX_KEY: ${{ secrets.PHOTOROOM_API_KEY_SANDBOX }}
        run: |
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          re='\[plan:([^]]+)\]'
          [[ "$COMMIT_MSG" =~ $re ]] && PLAN="${BASH_REMATCH[1]}"
          if [ -n "$PLAN" ]; then
            DATE=$(uv run python -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1]))['date'])" "$PLAN")
          elif [ -n "$INPUT_DATE" ]; then
            DATE="$INPUT_DATE"
          else
            DATE=$(uv run python -c "from core.profile import load_profile; from tools.plan import default_date; print(default_date(load_profile('$ACCOUNT')))")
          fi
          mkdir -p "out/$DATE"
          [ -n "$PLAN" ] && cp "$PLAN" "out/$DATE/plan.yaml"
          # 샌드박스면 전용 키를 쓰고, 없으면 기본 키에 sandbox_ 를 붙인다
          KEY="$PHOTOROOM_KEY"
          if [ -n "$SANDBOX" ]; then
            if [ -n "$SANDBOX_KEY" ]; then KEY="$SANDBOX_KEY"; else KEY="sandbox_$PHOTOROOM_KEY"; fi
          fi
          echo "::add-mask::$KEY"
          { echo "DATE=$DATE"; echo "PLAN=$PLAN"; echo "PHOTOROOM_API_KEY=$KEY"; } >> "$GITHUB_ENV"

      - name: Claude 기획 (daily-feed 스킬)
        if: env.PLAN == ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            .claude/skills/daily-feed/SKILL.md 의 순서를 그대로 따라 게시물 하나를 만들어.
            ACCOUNT=${{ env.ACCOUNT }} DATE=${{ env.DATE }} OUTFIT=${{ env.OUTFIT }} COLLECT=${{ env.COLLECT }}
            python 은 이미 가상환경이 잡혀 있으니 `python -m tools.plan ...` 처럼 부르면 돼.
            git 커밋·푸시, 게시, 외부 전송은 하지 마. 끝나면 out/${{ env.DATE }}/report.md 에 요약을 남겨.
          claude_args: >-
            --max-turns 150
            --allowedTools "Bash(python -m tools.plan:*),Bash(python -m tools.collect:*),Bash(python -m tools.review:*),Read,Write,Edit,Glob,Grep,Task,Agent"

      - name: 기획 파일로 만들기
        if: env.PLAN != ''
        run: |
          python -m tools.plan check "out/$DATE/plan.yaml"
          python -m tools.plan photos "out/$DATE/plan.yaml"
          # Photoroom 한도에 막히면(종료 코드 2) 코디컷 없이라도 만든다
          python -m tools.plan build "out/$DATE/plan.yaml" --outfit "$OUTFIT" \
            || { [ $? -eq 2 ] && python -m tools.plan build "out/$DATE/plan.yaml" --outfit none; }
          # 검수표까지 만든다 (점수는 Claude 가 매김. 없으면 needs_human 으로 남음)
          python -m tools.review prep "out/$DATE"

      - name: Claude 이미지 검수 (기획 파일로 만든 경우)
        if: env.PLAN != '' && env.REVIEW == '1' && env.HAS_CLAUDE == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            .claude/skills/daily-feed/SKILL.md 의 10번(이미지 검수)만 out/${{ env.DATE }} 에 대해 해.
            plan.yaml 은 고치지 말고, 종료 코드 4 는 그대로 두고 끝내.
            python 은 이미 가상환경이 잡혀 있으니 `python -m tools.review ...` 처럼 부르면 돼.
            git 커밋·푸시, 게시, 외부 전송은 하지 마.
          claude_args: >-
            --max-turns 60
            --allowedTools "Bash(python -m tools.review:*),Read,Write,Glob,Task,Agent"

      - name: 텔레그램 미리보기
        if: env.PREVIEW == '1' && env.HAS_TELEGRAM == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -f "out/$DATE/manifest.json" ] || { echo "결과가 없어 미리보기를 보내지 않습니다"; exit 0; }
          # 샌드박스 코디컷에는 워터마크가 있어 게시하지 않는다 (미리보기만)
          flag=""; [ -n "$SANDBOX" ] && [ "$OUTFIT" = photoroom ] && flag="--sandbox"
          python -m tools.notify preview "out/$DATE" --run "$DATE-run$RUN" $flag

      - name: 요약 표시
        if: always()
        run: |
          f="out/$DATE/report.md"; [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          f="out/$DATE/caption.txt"; [ -f "$f" ] && { echo; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          true

      - name: 올릴 파일 고르기 (쇼핑몰 원본 사진 제외)
        if: always()
        run: |
          mkdir -p /tmp/upload
          [ -d "out/$DATE" ] || exit 0
          rsync -a --exclude '/photos/' --exclude 'src/' --exclude 'originals/' "out/$DATE/" /tmp/upload/
          # 게시 job 이 샌드박스(워터마크) 결과를 게시하지 않도록 만든 방식을 남긴다
          sandbox=false; [ -n "$SANDBOX" ] && [ "$OUTFIT" = photoroom ] && sandbox=true
          echo "{\"run\": \"$DATE-run$RUN\", \"account\": \"$ACCOUNT\", \"sandbox\": $sandbox}" > /tmp/upload/run.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-${{ env.DATE }}-${{ github.run_number }}
          path: /tmp/upload
          if-no-files-found: ignore

      - name: daily-results 브랜치에 커밋
        if: always()
        run: |
          [ -n "$(ls -A /tmp/upload)" ] || exit 0
          dest="$DATE-run$RUN"
          git config user.name "github-actions[bot]"
          git config user.email "41898279+github-actions[bot]@users.noreply.github.com"
          if git fetch origin daily-results 2>/dev/null; then
            git worktree add /tmp/results origin/daily-results
            git -C /tmp/results checkout -B daily-results
          else
            git worktree add --detach /tmp/results
            git -C /tmp/results checkout --orphan daily-results
            git -C /tmp/results rm -rf --quiet .
          fi
          mkdir -p "/tmp/results/$dest"
          cp -r /tmp/upload/. "/tmp/results/$dest/"
          echo "source: ${{ github.sha }} account: $ACCOUNT plan: ${PLAN:-claude}" > "/tmp/results/$dest/SOURCE.txt"
          git -C /tmp/results add "$dest"
          git -C /tmp/results commit -m "하루 게시물 $dest"
          git -C /tmp/results push origin daily-results
