covers:
  - id: c1
    color: 1
    shape: 1
    complete: 2
    clean: 0
    layout: 2
    notes: >-
      1번 퍼 코트는 원본이 모브 브라운 쪽인데 그림은 회갈색(그레이 톤)이라 색이 조금 다르다.
      원본은 털이 풍성한 코트인데 그림도 털 칼라와 안감은 살아 있다. 퍼 질감은 괜찮다.
      여밈은 참고 사진도 열린 모양이라 그림과 비슷하다 (여밈: 참고 열림, 그림 열림 → 같음).
      오른쪽 어깨가 살짝 흘러내려 있고 입는 모양은 참고 범위 안이다.
      4번 신발은 원본이 무광 천 느낌의 스포티한 메리제인(납작한 플랫폼)인데 그림은 광택 가죽 블록힐 메리제인이라 디자인과 소재가 다르다.
      5번 가방은 원본이 검정 초승달 모양 호보백인데 그림은 사다리꼴에 가까운 각진 형태다.
      버건디 사진이 없어서 색은 사람이 확인해야 한다 (사정대로).
      왼손 손가락에 원본 상품에 없는 은색 반지처럼 보이는 것이 있다. 애매해서 clean 0 으로 본다.
      3번 쇼츠 기장과 허리 단추 디테일, 6번 니삭스, 2번 반폴라는 원본과 같다.
      얼굴은 face.jpg 와 이미지가 비슷하지만 정확히 같은 사람인지는 분명하지 않다 (얼굴 다름 가능, 감점 없음).
      장면 속 인물을 그대로 옮긴 느낌은 없고, 헤어는 요청대로 잔머리 있는 슬릭번이다.
      스튜디오 무드와 전신 비율은 맞고 신발도 화면 안에 있다.
    faults: []
  - id: c2
    color: 2
    shape: 0
    complete: 2
    clean: 2
    layout: 2
    notes: >-
      4번 신발: 원본은 무광 네오프렌 소재에 굵은 밑창, 두 줄 버클 스트랩이 X자로 교차하는 메리제인이다. 그림은 반짝이는 매끈한 가죽에 스트랩이 한 줄이라
      디자인과 소재가 다르다(shape 0, material_differs). 두 짝은 앞코 방향과 높이가 가지런해서 shoes_not_neat 는 아니다.
      5번 가방: 원본은 긴 외줄 손잡이가 달린 초승달형 호보백인데, 그림은 지퍼가 달린 작은 돔형 가방이다. 모양이 다르다. 색은 사람 확인 사항이라 감점하지 않았다.
      3번 쇼츠: 원본에 없는 벨트고리와 주머니 손 연출이 있으나 기장과 핏은 대체로 맞다. 허리선도 정상이고 허리 위에 우글거리는 곳은 없다.
      1번 퍼 코트: 그레이 스웨이드에 털 칼라가 있어 질감과 기장(엉덩이 근처)은 괜찮다. 상세 사진보다 색이 회색 쪽인 점은 기획의 그레이 선택에 따른 것이라 감점하지 않았다.
      2번 반폴라와 6번 니삭스: 이상 없음.
      얼굴: face.jpg 와 같은 계열의 얼굴이고 얼굴 일부 노출은 허용된다. 까치 슬릭번 잔머리 요청은 반영됐다. 장면 사진 속 사람과는 닮지 않았고 장면 옷도 섞이지 않았다.
      장면 무드: 스튜디오 배경이라 맞다. 포즈는 장면을 복사하지 않았다. 전신이 잘리지 않았고 다리 비율은 좋다.
      눈에 띄는 글자나 없는 물건은 없다.
    faults: [material_differs]
    feedback_ok: true
slides: []
summary: 전신 비율과 장면 무드, 퍼·쇼츠·니삭스 재현은 좋다. 그러나 반지로 보이는 없는 물건이 있고, 신발(광택 블록힐)과 가방 모양이 원본과 달라서 보완이 필요하다.
