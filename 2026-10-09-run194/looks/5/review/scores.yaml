    notes: 2번 나시 어깨끈이 얇은 끈이 아니라 넓은 레이스 띠로 그려졌고, 밑단 레이스도 안 보임. 1번 니트는 보트넥이 각진 넓은 목선처럼 바뀌었고 기장이 힙까지 오지 않고 치마 허리쯤에서 끝나 짧아 보임. 4번 가방이 니트 소매와 치마 왼쪽 가장자리에 걸쳐 겹침. 3번 치마, 5번 신발(한 켤레, 레이스업), 6번 양말(한 쌍)은 원본과 맞음.
summary: c2 는 색, 상품 개수, 치마 기장과 소재가 원본과 맞고 글자나 없는 물건도 없다. 다만 나시 끈 모양, 니트 목선과 기장, 가방 겹침에서 작은 차이가 있어 보통 수준이다.
