name: collect

# 4단계 상품 수집. 프로필의 검색어로 지그재그 공개 페이지에서 후보를 모아 data/<계정>/products.json 에 쌓는다.
# - Actions 탭에서 "Run workflow": 계정·카테고리·검색어를 고를 수 있다. commit 을 켜면 결과를 그 브랜치에 커밋
# - 작업 브랜치에 커밋 메시지에 [collect] 를 넣어 푸시 ([collect:3] 이면 카테고리마다 검색어 3개만)
# 보고서(report.md, sheet.jpg)는 artifact 와 scout-results 브랜치의 collect-<실행번호>/ 에 올라간다.
# 9단계: schedule 워크플로가 profile schedule.collect_at 에 commit 을 켜고 부른다.
on:
  workflow_dispatch:
    inputs:
      account:
        description: 계정
        default: women
      category:
        description: 이 카테고리만 (빈칸이면 전부)
        default: ""
      queries:
        description: 검색어 (쉼표로 구분, category 와 함께)
        default: ""
      max_queries:
        description: 카테고리마다 앞에서 N개 검색어만 (빈칸이면 전부)
        default: ""
      commit:
        description: 상품 창고(data/)를 이 브랜치에 커밋
        type: boolean
        default: false
      from_refs:
        description: 참고 코디(refs.json)에서 창고에 없는 칸의 옷을 모으고 참고 사진 묶음을 텔레그램으로 (2026-10-13)
        type: boolean
        default: false
      since:
        description: from_refs 때 이 날짜 이후에 더한 참고 코디만 텔레그램으로 보냄
        default: ""
      then_candidates:
        description: 수집 뒤 이 게시 날짜의 코디 후보를 보냄 (주간 주제가 씀)
        default: ""
  push:
    branches: ["claude/**"]
    paths: ["sources/**", "tools/scout.py", "tools/collect.py", "tools/photo_pick.py", "accounts/**", ".github/workflows/collect.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: zigzag
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[collect')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ACCOUNT: ${{ inputs.account || 'women' }}
      OUT: out/collect/run-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group scout
      - run: uv run playwright install --with-deps chromium

      - name: 수집
        env:
          CATEGORY: ${{ inputs.category }}
          QUERIES: ${{ inputs.queries }}
          MAX_QUERIES: ${{ inputs.max_queries }}
          FROM_REFS: ${{ inputs.from_refs && '1' || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          args=(--account "$ACCOUNT" --report "$OUT")
          re='\[collect:([0-9]+)\]'
          [[ "$COMMIT_MSG" =~ $re ]] && MAX_QUERIES="${BASH_REMATCH[1]}"
          [ -n "$MAX_QUERIES" ] && args+=(--max-queries "$MAX_QUERIES")
          # 참고 코디가 많은 주(쇼핑몰마다 20~30벌)에도 시간 제한 전에 멈추고 모은 것을 커밋한다 (2026-10-19)
          [ -n "$FROM_REFS" ] && args+=(--from-refs --no-recheck --minutes 120)
          if [ -n "$CATEGORY" ]; then
            args+=(--category "$CATEGORY")
            IFS=',' read -ra qs <<< "$QUERIES"
            for q in "${qs[@]}"; do q="$(echo "$q" | xargs)"; [ -n "$q" ] && args+=(--query "$q"); done
          fi
          uv run python -m tools.collect "${args[@]}"

      - name: 요약 표시
        if: always()
        run: '[ -f "$OUT/report.md" ] && cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY" || true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collect-${{ github.run_number }}
          path: ${{ env.OUT }}
          if-no-files-found: ignore

      # 주간 주제(themes)가 같은 브랜치의 refs.json 에 참고 코디를 동시에 더할 수 있어, 원격 최신본 위에
      # 다시 얹어 커밋한다. refs.json 은 이 실행의 칸 맞추기 결과에 원격에만 있는 번호를 더한다
      - name: 상품 창고 커밋
        if: inputs.commit
        env:
          FROM_REFS: ${{ inputs.from_refs && '1' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898279+github-actions[bot]@users.noreply.github.com"
          P="data/$ACCOUNT/products.json"; R="data/$ACCOUNT/refs.json"; D="data/$ACCOUNT/refs_done.json"
          # 참고 코디 옷 수집이 끝났다는 표시: 차례 흐름이 이걸 보고 첫 주제의 코디 후보를 만든다
          [ -n "$FROM_REFS" ] && echo "{\"done_at\": $(date +%s)}" > /tmp/refs_done.json
          cp "$P" /tmp/products.json
          [ -f "$R" ] && cp "$R" /tmp/refs_ours.json
          for i in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"
            git reset -q --hard "origin/${{ github.ref_name }}"
            cp /tmp/products.json "$P"
            if [ -f /tmp/refs_ours.json ]; then
              [ -f "$R" ] && cp "$R" /tmp/refs_remote.json || echo "[]" > /tmp/refs_remote.json
              cp /tmp/refs_ours.json "$R"
              uv run python -m tools.refs merge --account "$ACCOUNT" --new /tmp/refs_remote.json
            fi
            git add "$P" "$R" 2>/dev/null || true
            if [ -f /tmp/refs_done.json ]; then cp /tmp/refs_done.json "$D"; git add "$D"; fi
            git diff --cached --quiet && exit 0
            git commit -q -m "상품 창고 갱신 ($ACCOUNT, run ${{ github.run_number }})"
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: 참고 코디 사진 묶음 텔레그램으로
        if: inputs.from_refs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SINCE: ${{ inputs.since }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "텔레그램 설정 없음"; exit 0; }
          args=(send --account "$ACCOUNT" --out out/refs_album)
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          uv run python -m tools.refs "${args[@]}"

      - name: 코디 후보 보내기 요청
        if: inputs.then_candidates != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run daily.yml --ref "${{ github.ref_name }}" -f account="$ACCOUNT" \
            -f date="${{ inputs.then_candidates }}" -f mode=candidates -f sandbox=false

      - name: scout-results 브랜치에 보고서 커밋
        if: always()
        run: |
          [ -d "$OUT" ] || exit 0
          dest="collect-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898279+github-actions[bot]@users.noreply.github.com"
          if git fetch origin scout-results 2>/dev/null; then
            git worktree add /tmp/results origin/scout-results
            git -C /tmp/results checkout -B scout-results
          else
            git worktree add --detach /tmp/results
            git -C /tmp/results checkout --orphan scout-results
            git -C /tmp/results rm -rf --quiet .
          fi
          mkdir -p "/tmp/results/$dest"
          cp -r "$OUT"/. "/tmp/results/$dest/"
          echo "source: ${{ github.sha }}" > "/tmp/results/$dest/SOURCE.txt"
          git -C /tmp/results add "$dest"
          git -C /tmp/results commit -m "상품 수집 결과 $dest"
          git -C /tmp/results push origin scout-results

      - name: 실패 알림
        if: failure() && github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: "[${{ env.ACCOUNT }}] 상품 수집 실패: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: .github/scripts/alert.sh
