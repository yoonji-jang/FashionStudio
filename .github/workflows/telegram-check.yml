name: telegram-check

# 텔레그램 봇 처음 설정 확인. 봇 토큰(TELEGRAM_BOT_TOKEN)이 맞는지 보고, 봇에게 말을 건 채팅 ID 를 찾아
# 로그에 보여 주고 그 채팅으로 확인 메시지를 보낸다. 먼저 텔레그램에서 봇에게 아무 말이나 보내 두고 돌린다.
# 작업 브랜치에서는 커밋 메시지에 [telegram-check] 를 넣어 이 파일을 푸시하면 돈다.
# 커밋 메시지에 [telegram-preview:<결과 폴더>] 를 넣으면 daily-results 의 그 결과로
# 미리보기도 보내 본다 (시험용이라 게시 버튼 없이, telegram.json 은 저장하지 않음).
# 릴스가 낡았으면 (reel_stale) 다시 만들어 보낸다. 최종 캐러셀·영상을 다시 받아 볼 때도 쓴다.
# [pick-status:<결과 폴더>] 를 넣으면 그 코디 후보에 온 답장을 읽어 어떻게 정할지 보여 준다 (기록·실행 없음).
# [pick-resend:<결과 폴더>] 를 넣으면 그 결과의 코디 후보(지금 p1.yaml) 시트를 텔레그램으로 다시 보낸다
# (pick.json 은 저장하지 않아 번호로 고르면 되고, 시트 답장 /fix 는 벌 번호를 같이 적는다).
# [pin-check:<핀 링크>] 를 넣으면 그 핀의 사진을 참고 사진처럼 받아 텔레그램으로 보내 본다 (저장 안 함).
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/telegram-check.yml", "tools/notify.py", "tools/pick.py",
            "tools/pinterest.py"]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[telegram-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: uv run python -m tools.notify chats
      - name: 미리보기 시험
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          dir=$(grep -oP '\[telegram-preview:\K[\w.-]+(?=\])' <<<"$MSG" || true)
          [ -z "$dir" ] && exit 0
          git fetch --depth 1 origin daily-results
          git worktree add /tmp/results FETCH_HEAD
          # 벌 순서·표지·제목을 바꾼 뒤라 릴스가 낡았으면 게시 때처럼 다시 만들어 보낸다 (커밋하지 않음)
          if uv run python -c "import sys; from pathlib import Path; from tools import cover_look; sys.exit(0 if cover_look.reel_stale(Path(sys.argv[1])) else 1)" "/tmp/results/$dir"; then
            command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
            uv run python -m tools.reels build "/tmp/results/$dir"
          fi
          uv run python -m tools.notify preview "/tmp/results/$dir" --run "$dir" --sandbox
      - name: 코디 고르기 답장 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          dir=$(grep -oP '\[pick-status:\K[\w.-]+(?=\])' <<<"$MSG" || true)
          [ -z "$dir" ] && exit 0
          [ -d /tmp/results ] || { git fetch --depth 1 origin daily-results; git worktree add /tmp/results FETCH_HEAD; }
          uv run python -m tools.pick status "/tmp/results/$dir"
      - name: 코디 후보 다시 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          dir=$(grep -oP '\[pick-resend:\K[\w.-]+(?=\])' <<<"$MSG" || true)
          [ -z "$dir" ] && exit 0
          [ -d /tmp/results ] || { git fetch --depth 1 origin daily-results; git worktree add /tmp/results FETCH_HEAD; }
          cp -r "/tmp/results/$dir" /tmp/resend
          account=$(jq -r .account "/tmp/results/$dir/run.json")
          uv run python -m tools.pick restore-user --account "$account" --prev /tmp/results --out /tmp/resend --run "$dir"
          uv run python -m tools.pick send /tmp/resend --run "$dir"
      - name: 핀터레스트 핀 링크 시험
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          url=$(grep -oP '\[pin-check:\K[^\]\s]+(?=\])' <<<"$MSG" || true)
          [ -z "$url" ] && exit 0
          uv run python -m tools.pinterest check "$url"
