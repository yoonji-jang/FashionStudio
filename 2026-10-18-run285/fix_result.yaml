changes:
  - "전체 순서: 표지를 1번 벌로 바꾸고 2·3·4·5·6번 벌 순서로 이어 붙임 (cover_look 2 → 1)"
  - "1장 표지(1번 벌): 배경을 2번 벌 장면(크림 벽)으로 다시 그림. 셔츠 밑단은 여전히 길게 나옴 (검수 7/10, 통과 못 함, 사람 확인 필요)"
  - "4번 벌: 낮게 묶은 슬릭번 + 가는 동그란 안경, 머리·얼굴을 작게 고쳐 그림 (검수 9/10, 요청 반영)"
  - "6번 벌: 가디건을 아이보리 트위드 자켓(zigzag:150918386)으로 바꾸고 폰 셀카로, 화병 없이 다시 그림 (검수 8/10)"
  - "해석: 4번 벌 'look2처럼 슬릭번'은 2번 벌이 포니테일이라 참고 장면 3번(슬릭번+안경)대로 해석함"
  - "해석: 표지 '배경은 look2'는 새 표지(1번 벌)를 2번 벌 장면 사진(scene_2, 크림 플라스터 벽)으로 그리는 것으로 해석함"
