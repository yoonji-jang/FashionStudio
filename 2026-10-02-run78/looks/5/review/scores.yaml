covers:
  - id: c2
    color: 1
    shape: 0
    complete: 2
    clean: 2
    layout: 2
    notes: "1번 트렌치코트가 원본과 다름. 원본은 스탠드 칼라에 벨트가 없고 단추가 어긋난 더블 여밈, 라글란 소매인데 c2 는 노치드 칼라에 벨트, 견장이 있는 클래식 트렌치로 그려짐 (shape 0). 코트 색도 연한 그레이지 아이보리 대신 진한 탄 베이지라 조금 어두움 (color 1). 2번 니트는 원본이 가는 줄 여러 겹인데 c2 는 굵은 네이비 줄이 듬성듬성함. 4번 가방은 원본이 로고 메달이 달린 블랙 나일론 숄더백(손잡이 2개)인데 c2 는 로고 없는 각진 가죽 가방에 끈이 하나임. 5번 신발은 원본이 가죽 앵클부츠(스티치 목선)인데 c2 는 니트 삭스 부츠에 당김 고리가 달림. 3번 바지는 이번 피드백대로 발목 아래까지 길어져 해결됨(코트보다 확실히 길고 부츠컷 핏도 원본과 같음). 신발은 오른쪽 아래, 가방은 오른쪽이라 제목 자리는 비어 있음."
summary: "바지 기장은 고쳐졌지만 코트가 스탠드 칼라·벨트 없음 원본과 다른 노치드 칼라 벨트 트렌치로 바뀌었고, 가방과 신발 디자인도 원본과 다름. shape 0 이라 통과 기준 미달."
