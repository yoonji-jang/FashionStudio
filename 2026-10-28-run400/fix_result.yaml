  - "2장 2번 벌: 니트 원피스를 H라인으로 통을 줄이고 기장을 짧게, 손을 모아 소매 속에 넣게 고쳐 그림 (검수 10/10, 손가락 끝은 조금 보임)"
  - "3장 3번 벌: 니트를 치마바지 밖으로 빼 입고 한쪽 밑단이 올라간 비대칭으로 고쳐 그림 (검수 8점이나 손가락 반지 때문에 clean 0, 사람 확인)"
  - "4장 4번 벌: 니트 기장을 늘려 치마 허리밴드를 가리게 고쳐 그림 (검수 9/10)"
