covers:
  - id: c2
    color: 2
    shape: 1
    complete: 2
    clean: 1
    layout: 1
    notes: "2번 상의는 원본이 스쿱넥 헨리넥인데 단추 5개짜리 둥근 목 플래킷으로 그려져 넥라인이 조금 다름. 5번 가방은 원본의 가로로 넓은 직사각형 두 손잡이 쇼퍼인데 높은 아치형 손잡이의 사다리꼴 숄더백이 됨. 상의 목 라벨과 코트 안쪽 목 라벨에 작은 글자 같은 표시가 있음. 코트 77cm 대비 바지 107cm 비율(약 1.4배)이 안 맞아 코트가 길어 보임(바지 약 1.05배). 상의 밑단과 코트에 허리밴드가 일부 가려져 허리 디자인이 잘 안 보이고, 가방이 코트 소매 끝에 닿음. 바지에 원본에 없는 주름 한 줄이 있음."
summary: "c2 는 색과 상품 구성이 맞고 신발도 두 짝이 가지런하지만, 가방 형태와 상의 넥라인이 원본과 다르고 기장 비율이 어긋나 감점함. 합계 7점으로 통과 기준 8점에는 못 미침."
