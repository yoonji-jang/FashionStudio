covers:
  - id: c2
    color: 2
    shape: 2
    complete: 2
    clean: 0
    layout: 2
    notes: "(1) 옷과 포즈는 지난 그림과 거의 같다. 셔츠 열림, 안의 레이스 나시, 올리브 스웨이드 H라인 무릎 위 스커트, 가방 위치가 같고, 가방과 부츠 모양도 원본과 맞다. 얼굴은 뭉개지지 않았고 정면이 아닌 숙인 얼굴이다. (2) 어깨끈을 잡은 손가락에 반지가 있다. 목록에 없는 소품이라 clean 0이다. 지난 그림에도 있던 문제인데 고쳐지지 않았다. (3) 부츠 두 짝의 앞코 방향이 다르다. 왼쪽 부츠는 앞코가 왼쪽/정면, 오른쪽 부츠는 앞코가 오른쪽이다. 두 짝 모두 오른쪽 옆모습이어야 하므로 shoes_not_neat이다. (4) 키·다리 요청은 반영되지 않았다. 지난 그림은 머리 위쪽이 화면 높이의 약 6%, 발 아래가 약 97%이고, 후보도 약 5.5%와 97%로 거의 같다. (5) 헤어는 청순한 긴 웨이브로 바뀌었고 볼터치도 있다. 코끝은 들창코는 아니다."
    faults: [shoes_not_neat]
    feedback_ok: false
slides: []
summary: c2는 옷 색과 모양은 원본과 맞고 헤어와 얼굴 요청은 반영했다. 키와 다리 비율은 눈에 띄게 달라지지 않았다. 손가락 반지와 부츠 앞코 방향 불일치가 남아 있다.
