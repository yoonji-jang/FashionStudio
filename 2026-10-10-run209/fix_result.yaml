changes:
  - "2장 벌1: 후드집업을 차콜 사진(1번 색 옵션)으로 바꾸고, 버뮤다를 실제 55cm 무릎 기장으로 다시 그림 (검수 8/10)"
  - "3장 벌2: 청바지를 더 내려 입히고 허리라인을 잡아 다시 그림 (검수 8/10, 후보 2장째)"
  - "4장 벌3: 그림 속 숫자 지움. 다만 귀걸이가 4개로 그려져 검수 6/10, 사람 확인 필요"
  - "5장 벌4: 치마를 주머니 없는 앞면(지퍼·단추)으로 다시 그림 (검수 8/10). 쇼핑몰 사진이 한 장뿐이라 앞면 디자인은 추정"
  - "6장 벌5: 치마를 탄탄한 살짝 A라인으로 다시 그림 (검수 7/10, 사람 확인 필요: 허리밴드 가림, 가방이 소매에 닿음)"
  - "7장 벌6: 숫자 지우고, 허리를 말지 않고 자연스럽게 넣어 입은 모양, 신발 가지런히 다시 그림 (검수 8/10)"
