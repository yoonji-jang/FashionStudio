    color: 2
    shape: 1
    complete: 2
    clean: 1
    layout: 1
    notes: "3번 벌룬 팬츠 밑단이 발목에서 조여져 메리제인이 그대로 드러남. 원본과 설명은 신발을 덮는 기장인데 신발 윗부분이 다 보여서 shape 1. 오른손이 흐리고 손가락 모양이 조금 어색해서 clean 1. 포즈는 걷다가 고개를 숙인 모습이라 배경과 포즈는 자연스러워졌지만 기장 요청이 완전히 반영되지 않아 layout 1. 얼굴은 머리카락과 고개 숙임으로 일부만 보여서 괜찮음 (face_c2_1 은 배경 행인이라 무관). 1번 가디건은 허리 기장에 가깝고 단추 줄과 보라색 로고가 원본과 같음. 목걸이, 벨트, 가방, 신발은 모두 한 개씩 정확히 나옴."
    feedback_ok: false
summary: c2 는 장면(한낮 횡단보도, 낮은 각도, 바람에 날리는 머리)과 상품 색·디테일이 잘 맞고 c1 보다 자연스럽다. 다만 와이드 팬츠가 신발을 덮을 만큼 길지 않아서 요청한 기장 수정은 반영되지 않았다(feedback_ok false). 합계는 7점이고 0점 항목은 없다.
