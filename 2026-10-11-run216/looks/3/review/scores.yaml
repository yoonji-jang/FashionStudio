    notes: "1번 자켓이 원본(88cm, 엉덩이~허벅지 기장의 박시한 셔츠칼라 하프자켓)과 달리 허리 기장의 크롭 봄버로 바뀜. 밑단 고무밴드, 앞 지퍼, 소매 단추 커프스가 원본에 없는 디테일. 크기 비율도 틀림: 자켓 88cm, 바지 104cm인데 그림에서는 바지가 자켓의 약 2배 길이. 5번 가방은 원본보다 작은 숄더백으로 그려졌고 자켓 소매에 살짝 걸침. 4번 앵클부츠는 굽이 낮고 앞코가 각진 모양으로, 원본의 블록힐과 조금 다름. 허리선 위치와 바지 기장, 부츠컷 핏, 시계 방향은 문제 없음."
summary: "c2 는 색, 빠짐, 깨끗함은 문제 없음. 그러나 자켓이 크롭 봄버로 바뀌어 shape 0, 자켓 대비 바지가 너무 길어 layout 0 이라 불합격. 자켓을 원본 기장대로 엉덩이~허벅지까지 오게 해서 다시 그려야 함."
