# 코디컷 배치 기본값 (계정과 무관). 캔버스 비율 기준 좌표 0~1.
# center: 상품 중심, size: 상품이 들어갈 상자(가로, 세로), z: 클수록 위에 놓임, rotate: 도(시계 반대)
# 아우터가 없으면 상의가 아우터 자리를 쓴다 (no_outer).
canvas: [1080, 1350]
slots:
  아우터: {center: [0.40, 0.30], size: [0.58, 0.44], z: 3}
  상의:   {center: [0.62, 0.24], size: [0.42, 0.34], z: 2}
  원피스: {center: [0.48, 0.42], size: [0.56, 0.74], z: 2}
  하의:   {center: [0.56, 0.64], size: [0.40, 0.56], z: 1}
  가방:   {center: [0.19, 0.60], size: [0.30, 0.30], z: 4}
  신발:   {center: [0.24, 0.87], size: [0.30, 0.17], z: 4}
  소품:   {center: [0.85, 0.52], size: [0.20, 0.30], z: 4, rotate: -8}
no_outer:
  상의:   {center: [0.52, 0.27], size: [0.56, 0.42], z: 2}
shadow:  # 코드 그림자 (AI 그림자를 쓰지 않을 때)
  offset: [10, 16]
  blur: 18
  opacity: 0.32
