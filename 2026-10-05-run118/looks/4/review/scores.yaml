    notes: 2번 베스트는 원본의 V넥 넓은 어깨 베스트인데 가는 끈이 달린 캐미솔 모양에 둥근 목선으로 그려져 있어 모양이 다름 (단추는 없어서 10-03 피드백은 반영됨). 6번 니삭스는 무릎 아래까지 오는 기장인데 발목 위로 조금만 보이는 짧은 양말로 그려짐. 3번 스커트는 허리에 주름이 잡혀 보이지만 원본과 크게 다르지는 않음. 3번 스커트 왼쪽 아래가 제목 자리(왼쪽 45%, 아래 35%)에 상당히 걸침. 4번 가방이 1번 셔츠 소매와 3번 스커트 윗부분에 살짝 겹침. 글자나 없는 물건은 없고 7번 스카프는 목에 묶여 있음.
