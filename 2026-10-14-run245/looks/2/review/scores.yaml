    notes: 3번 부츠가 옆모습으로 눕지 않았다. 앞코가 두 짝 모두 왼쪽 아래를 향해 비스듬히 놓였고, 위로 솟은 목이 오른쪽 가장자리에 거의 닿는다. 정해진 방향(앞코 오른쪽)과 달라서 shoes_not_neat 이다. 플럼 니트(소매 모양, 브이넥, 소재), 블랙 울 미니스커트(허리밴드 보임, 살짝 A라인), 숄더백, 실버 목걸이 한 줄은 원본과 같고 숫자나 글자도 없다. 스커트 허리 디자인이 보이고 니트가 허리선에서 자연스럽게 끝나 요청한 수정(치마 위치 내리기)은 반영됐다.
    faults: [shoes_not_neat]
summary: 상품 색·모양·소재는 원본과 같고 허리선도 자연스럽지만, 부츠가 앞코 왼쪽 아래로 비스듬히 놓여 정해진 옆모습 방향(앞코 오른쪽)과 달라 결함이다. 다시 그려야 한다.
