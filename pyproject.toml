[project]
name = "fashionstudio"
version = "0.1.0"
description = "인스타 코디 콘텐츠 자동 생성·게시 파이프라인"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=10.4",
    "pydantic>=2.7",
    "pynacl>=1.6.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]
# 상품 수집(검색 페이지 읽기)에만 필요. Actions: uv sync --group scout && uv run playwright install chromium
scout = [
    "playwright>=1.47",
]

[tool.setuptools]
packages = ["core", "sources", "tools"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
