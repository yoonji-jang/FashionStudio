name: daily

# 6단계 하루 게시물 만들기. Claude(daily-feed 스킬)가 주제·상품·문구를 정하고 코디컷·캐러셀·캡션까지 만든다.
# 7단계: 코디컷 후보를 여러 장 만들고 Claude(image-reviewer)가 검수해 표지를 고른다.
# - Actions 탭에서 "Run workflow": 버튼 하나로 주제 → 상품 → 코디컷 → 캐러셀 → 캡션
#   (Secret CLAUDE_CODE_OAUTH_TOKEN 필요. 기획 파일(plan)을 주면 Claude 없이 그 기획으로 만들기만 한다)
# - 작업 브랜치에 커밋 메시지에 [daily] 와 [plan:경로] 를 넣어 푸시하면 그 기획으로 만든다
#   (푸시는 샌드박스로 돈다. [live] 를 넣으면 정식 Photoroom 키로 워터마크 없이 만든다.
#    샌드박스는 Photoroom 방식에만 해당한다. 생성형 코디컷은 푸시로 돌려도 OpenRouter 요금이 나간다)
# 11단계 (2026-09-30): 코디컷은 profile outfit_image.engine 을 따른다 (outfit: auto). generate 는 생성형 AI
#   (Secret OPENROUTER_API_KEY), photoroom 은 예전 누끼 배치 (Secret PHOTOROOM_API_KEY).
# 8단계: 다 만들면 텔레그램으로 미리보기를 보낸다 (Secret TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 가 있을 때).
# 게시는 여기서 하지 않고 publish 워크플로가 /ok 답장을 확인해 올린다.
# 결과는 artifact 와 daily-results 브랜치의 <날짜>-run<번호>/ 에 올라간다
# (쇼핑몰 원본 사진은 올리지 않음).
# 9단계: schedule 워크플로가 매일 실행을 요청한다 (mode).
# - candidates: Claude(outfit-candidates)가 코디 후보 여러 개를 짜서 텔레그램으로 보낸다 (Photoroom 없음).
#   pick 에 지난 결과 폴더를 주면 "다시"를 누른 것: 그 후보와 겹치지 않게 새로 짠다
# - render: 사람이 고른 후보(pick = <결과 폴더>/<번호>)로 사진 확인 → 문구 → 코디컷 → 검수 → 미리보기
#   (여러 벌 게시물(20단계)은 <결과 폴더>/chosen: 고른 벌만 담은 picks/chosen.yaml)
# - full: 예전처럼 한 번에 한 벌 (profile pick.enabled 가 false 일 때)
# - edit: 후보에 온 "/fix 1 이너를 나시로" 대로 그 벌만 고쳐 그 벌 시트만 다시 보낸다 (이미지 AI 없음).
#   pick 은 {"run": 후보 결과 폴더, "fixes": [{update_id, looks, text}]} JSON (tools.pick check 가 만듦)
# 19단계: 캐러셀을 다 만들면 같은 슬라이드로 릴스 영상(tools.reels, ffmpeg)을 만들어 미리보기에 같이 보낸다.
# 15단계: fix: 미리보기에 온 /fix 피드백대로 고친다 (schedule 이 tools.feedback 으로 요청).
#   pick 은 {"run": 지난 결과 폴더, "round": 몇 번째, "fixes": [...]} JSON. Claude(fix-feed)가 같은 기획을
#   고쳐 다시 만들고 검수해서 새 미리보기를 보낸다. 표지를 고칠 일이 없으면 지난 코디컷을 그대로 쓴다
# 16단계: model: 전날 게시한 벌들을 옷을 입은 얼굴 없는 AI 모델컷으로 (profile schedule.post_days 의 model 날).
#   pick 은 전날 결과 폴더 (예 2026-10-05-run90). tools.model_post 가 기획을 만들고 Claude(model-feed)가
#   제목·캡션을 새로 쓴 뒤 만들기·검수·미리보기는 평소와 같다
on:
  workflow_dispatch:
    inputs:
      account:
        description: 계정
        default: women
      mode:
        description: full(한 벌 바로) / candidates(후보 보내기) / edit(후보 한 벌 고치기) / render(고른 후보 만들기) / fix(피드백대로 고치기) / model(전날 게시물을 모델컷으로)
        default: full
      pick:
        description: render 면 <결과 폴더>/<번호> (예 2026-09-28-run31/3), candidates 면 "다시" 누른 결과 폴더, edit·fix 면 고칠 점 JSON, model 이면 전날 게시한 결과 폴더
        default: ""
      date:
        description: 게시 날짜 YYYY-MM-DD (빈칸이면 내일)
        default: ""
      plan:
        description: 이미 쓴 기획 파일 (빈칸이면 Claude 가 기획)
        default: ""
      outfit:
        description: 코디컷 (auto = 계정 설정 / generate / photoroom / none)
        default: auto
      sandbox:
        description: Photoroom 무료 샌드박스 (photoroom 방식일 때만, 코디컷에 워터마크)
        type: boolean
        default: true
      collect:
        description: 주제 검색어로 지그재그 새 상품 수집
        type: boolean
        default: false
      review:
        description: 기획 파일로 만들 때도 Claude 로 이미지 검수 (CLAUDE_CODE_OAUTH_TOKEN 필요)
        type: boolean
        default: true
      preview:
        description: 텔레그램으로 미리보기 보내기 (샌드박스 결과는 게시 버튼 없이)
        type: boolean
        default: true
  push:
    branches: ["claude/**"]
    paths: ["samples/**", "tools/plan.py", "tools/review.py", "tools/outfit_gen.py", ".claude/**", ".github/workflows/daily.yml"]

permissions:
  contents: write
  id-token: write
  actions: read  # 진행 알림이 지금 단계 이름을 읽는다 (tools.progress)

jobs:
  daily:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[daily]')
    runs-on: ubuntu-latest
    # 90분이면 참고 코디를 많이 고른 날 후보 만들기가 끊겼다 (2026-10-22 run337, 11벌)
    timeout-minutes: 150
    # 워크플로 단위로 묶으면 같은 푸시에서 건너뛴 다른 워크플로가 대기 중인 실행을 취소해서 job 단위로 둔다
    concurrency:
      group: daily-${{ inputs.account || 'women' }}
      cancel-in-progress: false
    env:
      ACCOUNT: ${{ inputs.account || 'women' }}
      MODE: ${{ inputs.mode || 'full' }}
      PICK: ${{ inputs.pick }}
      PLAN: ${{ inputs.plan }}
      OUTFIT: ${{ inputs.outfit || 'auto' }}
      COLLECT: ${{ inputs.collect && '1' || '' }}
      SANDBOX: ${{ ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[live]')) || inputs.sandbox) && '1' || '' }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      REVIEW: ${{ (github.event_name == 'push' || inputs.review) && '1' || '' }}
      PREVIEW: ${{ (github.event_name == 'push' || inputs.preview) && '1' || '' }}
      HAS_TELEGRAM: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
      RUN: ${{ github.run_number }}
      # Claude 가 부르는 상품 수집은 한 번에 10분까지, 창고 전체 다시 확인은 collect 워크플로에서만
      COLLECT_MINUTES: "10"
      COLLECT_NO_RECHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync ${{ inputs.collect && '--group scout' || '' }}
      - if: inputs.collect
        run: uv run playwright install --with-deps chromium
      - name: 준비 (날짜, 기획 파일, 코디컷 방식과 키)
        env:
          INPUT_DATE: ${{ inputs.date }}
          PHOTOROOM_KEY: ${{ secrets.PHOTOROOM_API_KEY }}
          SANDBOX_KEY: ${{ secrets.PHOTOROOM_API_KEY_SANDBOX }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          re='\[plan:([^]]+)\]'
          [[ "$COMMIT_MSG" =~ $re ]] && PLAN="${BASH_REMATCH[1]}"
          if [ -n "$PLAN" ]; then
            DATE=$(uv run python -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1]))['date'])" "$PLAN")
          elif [ -n "$INPUT_DATE" ]; then
            DATE="$INPUT_DATE"
          else
            DATE=$(uv run python -c "from core.profile import load_profile; from tools.plan import default_date; print(default_date(load_profile('$ACCOUNT')))")
          fi
          mkdir -p "out/$DATE"
          [ -n "$PLAN" ] && cp "$PLAN" "out/$DATE/plan.yaml"
          ROUND=1
          if [ "$MODE" = fix ]; then
            # 지난 결과(기획, 검수 기록, 고른 코디컷)를 가져오고 피드백을 fix.json 에 둔다
            git fetch origin daily-results
            # /fix 참고 사진(flow/<계정>/<날짜>/fix/)은 schedule 이 커밋한다. 아직이면 잠깐 기다린다 (2026-10-22)
            for i in 1 2 3 4 5 6; do
              missing=0
              for f in $(jq -r '[.fixes[].photos // [] | .[]] | unique | .[]' <<< "$PICK"); do
                git cat-file -e "origin/daily-results:$f" 2>/dev/null || missing=1
              done
              [ "$missing" = 0 ] && break
              sleep 20; git fetch -q origin daily-results
            done
            git worktree add /tmp/prev origin/daily-results
            uv run python -m tools.feedback prepare "$PICK" --prev /tmp/prev --out "out/$DATE"
          elif [ "$MODE" = edit ]; then
            # 후보 한 벌 고치기: 지난 후보(p1.yaml, pick.json)를 가져오고 고칠 점을 picks/edit.json 에 둔다
            git fetch origin daily-results
            git worktree add /tmp/prev origin/daily-results
            uv run python -m tools.pick prepare-edit "$PICK" --prev /tmp/prev --out "out/$DATE"
            # "/fix 2 <지그재그 링크> 이걸로 아우터": 사람이 고른 상품 페이지를 한 번 읽어 창고에 넣는다 (2026-10-27)
            uv run python -m tools.pick links "out/$DATE" || echo "::warning::상품 링크를 읽지 못했습니다"
          elif [ "$MODE" = model ]; then
            # 전날 게시한 결과에서 같은 벌로 모델컷 기획을 만든다 (창고에서 빠진 상품도 다시 넣음)
            git fetch origin daily-results
            git worktree add /tmp/prev origin/daily-results
            uv run python -m tools.model_post prepare "$PICK" --prev /tmp/prev --date "$DATE" --out "out/$DATE"
          elif [ "$MODE" = candidates ] && [ "${PICK:0:1}" = "{" ]; then
            # 차례 흐름(tools.flow): 사용자가 고른 주제를 그날 주제로 넣는다. schedule 이 주제를 커밋하기 전에
            # 이 실행이 꺼낸 커밋이 정해져서, 주제는 pick 으로 넘겨받는다 ({"theme": {...}})
            # 다시 짜기 요청도 같은 JSON 으로 받는다 ({"again": 지난 결과 폴더, "keep": [4], "count": 8, "note": "…"}):
            # 남길 벌·벌 수·요청은 out/<날짜>/picks_request.json 에 두고 outfit-candidates 가 읽는다
            uv run python -m tools.flow use-theme --account "$ACCOUNT" --json "$PICK" --out "out/$DATE"
            again=$(jq -r '.again // empty' <<< "$PICK")
            if [ -n "$again" ]; then
              git fetch origin daily-results
              git worktree add /tmp/prev origin/daily-results
              mkdir -p "out/$DATE/previous"
              cp "/tmp/prev/$again/picks"/p*.yaml "out/$DATE/previous/"
              ROUND=$(( $(jq -r .round "/tmp/prev/$again/picks/pick.json") + 1 ))
            fi
          elif [ -n "$PICK" ]; then
            # 후보가 있는 결과 폴더를 가져온다 (render: 고른 후보, candidates: "다시" 누른 지난 후보)
            git fetch origin daily-results
            git worktree add /tmp/prev origin/daily-results
            src="/tmp/prev/${PICK%%/*}/picks"
            if [ "$MODE" = render ]; then
              # 번호면 p<번호>.yaml, 여러 벌 게시물(20단계)이면 고른 벌만 담은 chosen.yaml
              n="${PICK##*/}"
              if [ -f "$src/$n.yaml" ]; then cp "$src/$n.yaml" "out/$DATE/plan.yaml"
              else cp "$src/p$n.yaml" "out/$DATE/plan.yaml"; fi
            else
              mkdir -p "out/$DATE/previous"
              cp "$src"/p*.yaml "out/$DATE/previous/"
              ROUND=$(( $(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['round'])" "$src/pick.json") + 1 ))
            fi
          fi
          # 사람이 /fix 링크로 보낸 상품과 후보 실행 중 모은 상품은 창고(main)에 커밋되지 않아
          # 결과 브랜치에서 이 실행 기획이 쓰는 것만 다시 넣는다
          if [ -d /tmp/prev ]; then
            uv run python -m tools.pick restore-user --account "$ACCOUNT" --prev /tmp/prev --out "out/$DATE"
          fi
          # 장면 모델컷 (차례 흐름, 2026-10-14): 사용자가 텔레그램으로 보낸 장면 사진을 out/<날짜>/src/scene.jpg 에 둔다.
          # 사진은 schedule 이 실행을 요청한 직후 커밋해서, 아직 없으면 잠깐 기다렸다 다시 가져온다
          if { [ "$MODE" = render ] || [ "$MODE" = fix ]; } && [ "$(uv run python -c "from core.profile import load_profile; print(load_profile('$ACCOUNT').flow.enabled)")" = True ]; then
            scene="flow/$ACCOUNT/$DATE/scene.jpg"
            for i in 1 2 3 4 5 6; do
              git fetch -q origin daily-results && git show "origin/daily-results:$scene" > /tmp/scene.jpg 2>/dev/null && break
              rm -f /tmp/scene.jpg; sleep 20
            done
            if [ -s /tmp/scene.jpg ]; then
              mkdir -p "out/$DATE/src" && mv /tmp/scene.jpg "out/$DATE/src/scene.jpg"
              # 사진에 붙인 말 (모든 벌에 반영할 요청, 예 "슬릭번")
              git show "origin/daily-results:${scene%.jpg}.txt" > "out/$DATE/src/scene.txt" 2>/dev/null \
                || rm -f "out/$DATE/src/scene.txt"
              # 여러 장이면 scene_2.jpg … 도 (공통 무드 + 벌마다 어울리는 사진, 2026-10-15)
              scenes="out/$DATE/src/scene.jpg"
              for f in $(git ls-tree --name-only "origin/daily-results" "flow/$ACCOUNT/$DATE/" | grep -E '/scene_[0-9]+\.jpg$' | sort -V); do
                git show "origin/daily-results:$f" > "out/$DATE/src/$(basename "$f")"
                scenes="$scenes out/$DATE/src/$(basename "$f")"
              done
              echo "SCENE=out/$DATE/src/scene.jpg" >> "$GITHUB_ENV"
              echo "SCENES=$scenes" >> "$GITHUB_ENV"
            else
              echo "::warning::장면 사진($scene)이 없어 장면 없이 만듭니다"
            fi
          fi
          # 코디컷 방식: auto 면 계정 설정(profile outfit_image.engine)
          ENGINE="$OUTFIT"
          if [ "$ENGINE" = auto ]; then
            ENGINE=$(uv run python -c "from core.profile import load_profile; print(load_profile('$ACCOUNT').outfit_image.engine)")
          fi
          { echo "DATE=$DATE"; echo "PLAN=$PLAN"; echo "ROUND=$ROUND"; echo "ENGINE=$ENGINE"; } >> "$GITHUB_ENV"
          if [ "$ENGINE" = photoroom ]; then
            # 샌드박스면 전용 키를 쓰고, 없으면 기본 키에 sandbox_ 를 붙인다
            KEY="$PHOTOROOM_KEY"
            if [ -n "$SANDBOX" ]; then
              if [ -n "$SANDBOX_KEY" ]; then KEY="$SANDBOX_KEY"; else KEY="sandbox_$PHOTOROOM_KEY"; fi
            fi
            echo "::add-mask::$KEY"
            echo "PHOTOROOM_API_KEY=$KEY" >> "$GITHUB_ENV"
          elif [ "$ENGINE" = generate ]; then
            if [ -n "$OPENROUTER_KEY" ]; then
              echo "::add-mask::$OPENROUTER_KEY"
              echo "OPENROUTER_API_KEY=$OPENROUTER_KEY" >> "$GITHUB_ENV"
            else
              echo "::warning::Secret OPENROUTER_API_KEY 가 없어 코디컷을 만들 수 없습니다 (사람 확인으로 남음)"
            fi
          fi

      - name: 진행 알림 (한 시간 넘게 걸리면 한 시간마다 텔레그램, tools.progress)
        if: env.HAS_TELEGRAM == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$MODE" in
            candidates) what="코디 후보 만들기" ;; edit) what="코디 후보 고치기" ;;
            render) what="고른 코디로 게시물 만들기" ;; fix) what="게시물 고쳐 만들기" ;; *) what="게시물 만들기" ;;
          esac
          nohup python -m tools.progress watch --label "[$ACCOUNT] $DATE $what" --limit 150 \
            > /tmp/progress.log 2>&1 &
      - name: 참고 코디 사진 받기 (텔레그램 사진은 Claude 단계에 토큰이 없어 미리 받음)
        # 2026-10-27: 사용자가 텔레그램으로 보낸 참고 코디(tg:)를 Claude 단계에서 받지 못해 코디컷에 빠졌다.
        # 여기서 받아 두면 같은 러너의 캐시(/tmp)와 out/<날짜>/src/refs/ 를 Claude 단계가 쓴다
        if: (env.MODE == 'render' || env.MODE == 'fix') && env.HAS_TELEGRAM == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "out/$DATE/plan.yaml" ]; then
            uv run python -m tools.plan refs "out/$DATE/plan.yaml" \
              || echo "::warning::참고 코디 사진을 받지 못했습니다"
          fi
      - name: Claude 코디 후보 (outfit-candidates 스킬)
        if: env.MODE == 'candidates'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # schedule 이 GITHUB_TOKEN 으로 실행을 요청하면 실행자가 github-actions 봇이 된다
          allowed_bots: "github-actions"
          # 오래 걸리는 명령(사진 받기, 코디컷 만들기)이 2분을 넘으면 Claude Code 가 백그라운드로 돌리고
          # Claude 가 기다리다 턴을 끝내 실행이 결과 없이 끝났다 (10/3 run 104). 백그라운드를 끄고 제한 시간을 늘린다.
          settings: |
            {"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1", "BASH_DEFAULT_TIMEOUT_MS": "2400000", "BASH_MAX_TIMEOUT_MS": "3600000"}}
          prompt: |
            .claude/skills/outfit-candidates/SKILL.md 의 순서를 그대로 따라 코디 후보를 만들어.
            ACCOUNT=${{ env.ACCOUNT }} DATE=${{ env.DATE }} COLLECT=${{ env.COLLECT }}
            out/${{ env.DATE }}/picks_request.json 이 있으면 사용자의 요청이니 그 절을 따라 (refs 가 있으면 "사용자가 고른 참고 코디", again 이 있으면 "다시 짜기 요청").
            python 은 이미 가상환경이 잡혀 있으니 `python -m tools.plan ...` 처럼 부르면 돼.
            코디컷 만들기(tools.plan build), git 커밋·푸시, 게시, 외부 전송은 하지 마.
          claude_args: >-
            --max-turns 150
            --allowedTools "Bash(python -m tools.progress note:*),Bash(python -m tools.plan context:*),Bash(python -m tools.plan candidates:*),Bash(python -m tools.plan photos:*),Bash(python -m tools.plan check:*),Bash(python -m tools.plan themes:*),Bash(python -m tools.collect:*),Bash(python -m tools.scout refphoto:*),Bash(python -m tools.refs list:*),Read,Write,Edit,Glob,Grep"

      - name: 후보 검사·텔레그램으로 보내기
        if: env.MODE == 'candidates'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m tools.pick validate "out/$DATE"
          if [ "$HAS_TELEGRAM" = true ]; then
            python -m tools.pick send "out/$DATE" --run "$DATE-run$RUN" --round "$ROUND"
          else
            echo "::warning::텔레그램 설정이 없어 후보를 보내지 않았습니다"
          fi

      - name: Claude 후보 고치기 (outfit-candidates 스킬 "후보 고치기")
        if: env.MODE == 'edit'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # schedule 이 GITHUB_TOKEN 으로 실행을 요청하면 실행자가 github-actions 봇이 된다
          allowed_bots: "github-actions"
          settings: |
            {"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1", "BASH_DEFAULT_TIMEOUT_MS": "2400000", "BASH_MAX_TIMEOUT_MS": "3600000"}}
          prompt: |
            .claude/skills/outfit-candidates/SKILL.md 의 "후보 고치기" 절을 따라
            out/${{ env.DATE }}/picks/p1.yaml 에서 out/${{ env.DATE }}/picks/edit.json 에 적힌 벌만 고쳐.
            ACCOUNT=${{ env.ACCOUNT }} DATE=${{ env.DATE }}
            python 은 이미 가상환경이 잡혀 있으니 `python -m tools.plan ...` 처럼 부르면 돼.
            코디컷 만들기(tools.plan build), git 커밋·푸시, 게시, 외부 전송은 하지 마.
          claude_args: >-
            --max-turns 80
            --allowedTools "Bash(python -m tools.progress note:*),Bash(python -m tools.plan context:*),Bash(python -m tools.plan candidates:*),Bash(python -m tools.plan photos:*),Bash(python -m tools.plan check:*),Bash(python -m tools.scout refphoto:*),Bash(python -m tools.refs list:*),Read,Write,Edit,Glob,Grep"

      - name: 고친 후보 텔레그램으로 보내기
        if: env.MODE == 'edit'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m tools.plan check "out/$DATE/picks/p1.yaml" --draft
          if [ "$HAS_TELEGRAM" = true ]; then
            python -m tools.pick send-edit "out/$DATE" --run "$DATE-run$RUN"
          else
            echo "::warning::텔레그램 설정이 없어 고친 후보를 보내지 않았습니다"
          fi

      - name: Claude 피드백 반영 (fix-feed 스킬)
        if: env.MODE == 'fix'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # schedule 이 GITHUB_TOKEN 으로 실행을 요청하면 실행자가 github-actions 봇이 된다
          allowed_bots: "github-actions"
          # 오래 걸리는 명령(사진 받기, 코디컷 만들기)이 2분을 넘으면 Claude Code 가 백그라운드로 돌리고
          # Claude 가 기다리다 턴을 끝내 실행이 결과 없이 끝났다 (10/3 run 104). 백그라운드를 끄고 제한 시간을 늘린다.
          settings: |
            {"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1", "BASH_DEFAULT_TIMEOUT_MS": "2400000", "BASH_MAX_TIMEOUT_MS": "3600000"}}
          prompt: |
            .claude/skills/fix-feed/SKILL.md 의 순서를 그대로 따라 out/${{ env.DATE }} 게시물을 피드백대로 고쳐.
            피드백은 out/${{ env.DATE }}/fix.json 에 있어.
            ACCOUNT=${{ env.ACCOUNT }} DATE=${{ env.DATE }} OUTFIT=${{ env.OUTFIT }} SCENE=${{ env.SCENE }} SCENES="${{ env.SCENES }}"
            python 은 이미 가상환경이 잡혀 있으니 `python -m tools.plan ...` 처럼 부르면 돼.
            git 커밋·푸시, 게시, 외부 전송은 하지 마. 끝나면 out/${{ env.DATE }}/fix_result.yaml 과 report.md 를 남겨.
            에이전트(photo-checker, image-reviewer)는 run_in_background: false 로 불러 결과를 기다려.
            Bash 명령도 백그라운드로 돌리지 말고, 파이프·cd·&& 없이 `python -m tools...` 한 줄로 불러 (허용 목록에 걸려 막힌다).
            fix_result.yaml 과 manifest.json 이 생기기 전에는 끝내지 마.
          claude_args: >-
            --max-turns 180
            --allowedTools "Bash(python -m tools.progress note:*),Bash(python -m tools.plan:*),Bash(python -m tools.review:*),Bash(python -m tools.feedback summary:*),Bash(python -m tools.feedback ref-photos:*),Read,Write,Edit,Glob,Grep,Task,Agent"

      - name: Claude 모델컷 게시물 (model-feed 스킬)
        if: env.MODE == 'model'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # schedule 이 GITHUB_TOKEN 으로 실행을 요청하면 실행자가 github-actions 봇이 된다
          allowed_bots: "github-actions"
          # 모델컷 만들기도 2분을 넘으므로 다른 Claude 단계처럼 백그라운드를 끄고 제한 시간을 늘린다 (#47)
          settings: |
            {"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1", "BASH_DEFAULT_TIMEOUT_MS": "2400000", "BASH_MAX_TIMEOUT_MS": "3600000"}}
          prompt: |
            .claude/skills/model-feed/SKILL.md 의 순서를 그대로 따라 out/${{ env.DATE }} 모델컷 게시물을 만들어.
            기획은 out/${{ env.DATE }}/plan.yaml (전날 ${{ env.PICK }} 게시물의 벌 그대로)에 있어.
            ACCOUNT=${{ env.ACCOUNT }} DATE=${{ env.DATE }} OUTFIT=${{ env.OUTFIT }}
            python 은 이미 가상환경이 잡혀 있으니 `python -m tools.plan ...` 처럼 부르면 돼.
            git 커밋·푸시, 게시, 외부 전송은 하지 마. 끝나면 out/${{ env.DATE }}/report.md 에 요약을 남겨.
            에이전트(image-reviewer)는 run_in_background: false 로 불러 결과를 기다려.
            Bash 명령도 백그라운드로 돌리지 말고, 파이프·cd·&& 없이 `python -m tools...` 한 줄로 불러 (허용 목록에 걸려 막힌다).
            out/${{ env.DATE }}/manifest.json 이 생기기 전에는 끝내지 마.
          claude_args: >-
            --max-turns 200
            --allowedTools "Bash(python -m tools.progress note:*),Bash(python -m tools.plan:*),Bash(python -m tools.review:*),Read,Write,Edit,Glob,Grep,Task,Agent"

      - name: Claude 기획 (daily-feed 스킬, 고른 후보가 있으면 사진 확인부터)
        if: env.PLAN == '' && env.MODE != 'candidates' && env.MODE != 'edit' && env.MODE != 'fix' && env.MODE != 'model'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # schedule 이 GITHUB_TOKEN 으로 실행을 요청하면 실행자가 github-actions 봇이 된다
          allowed_bots: "github-actions"
          # 오래 걸리는 명령(사진 받기, 코디컷 만들기)이 2분을 넘으면 Claude Code 가 백그라운드로 돌리고
          # Claude 가 기다리다 턴을 끝내 실행이 결과 없이 끝났다 (10/3 run 104). 백그라운드를 끄고 제한 시간을 늘린다.
          settings: |
            {"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1", "BASH_DEFAULT_TIMEOUT_MS": "2400000", "BASH_MAX_TIMEOUT_MS": "3600000"}}
          prompt: |
            .claude/skills/daily-feed/SKILL.md 의 순서를 그대로 따라 게시물 하나를 만들어.
            out/${{ env.DATE }}/plan.yaml 이 이미 있으면 사람이 고른 후보이니 "고른 후보로 시작" 절을 따라.
            ACCOUNT=${{ env.ACCOUNT }} DATE=${{ env.DATE }} OUTFIT=${{ env.OUTFIT }} COLLECT=${{ env.COLLECT }} SCENE=${{ env.SCENE }} SCENES="${{ env.SCENES }}"
            SCENE 이 있으면 사용자가 보낸 장면 사진이니 "장면 모델컷" 절을 따라.
            python 은 이미 가상환경이 잡혀 있으니 `python -m tools.plan ...` 처럼 부르면 돼.
            git 커밋·푸시, 게시, 외부 전송은 하지 마. 끝나면 out/${{ env.DATE }}/report.md 에 요약을 남겨.
            에이전트(photo-checker, image-reviewer)는 run_in_background: false 로 불러 결과를 기다려.
            백그라운드로 부르면 기다리는 동안 실행이 끝나 버린다.
            Bash 명령도 백그라운드로 돌리지 말고, 파이프·cd·&& 없이 `python -m tools...` 한 줄로 불러 (허용 목록에 걸려 막힌다).
            out/${{ env.DATE }}/manifest.json 이 생기기 전에는 끝내지 마.
          # 여러 벌 게시물(20단계)은 벌마다 검수해서 턴이 많이 든다
          claude_args: >-
            --max-turns 250
            --allowedTools "Bash(python -m tools.progress note:*),Bash(python -m tools.plan:*),Bash(python -m tools.collect:*),Bash(python -m tools.review:*),Read,Write,Edit,Glob,Grep,Task,Agent"

      - name: 기획 파일로 만들기
        if: env.PLAN != ''
        run: |
          python -m tools.plan check "out/$DATE/plan.yaml"
          python -m tools.plan photos "out/$DATE/plan.yaml"
          # 코디컷 이미지 서비스 한도에 막히면(종료 코드 2) 코디컷 없이라도 만든다
          python -m tools.plan build "out/$DATE/plan.yaml" --outfit "$OUTFIT" \
            || { [ $? -eq 2 ] && python -m tools.plan build "out/$DATE/plan.yaml" --outfit none; }
          # 검수표까지 만든다 (점수는 Claude 가 매김. 없으면 needs_human 으로 남음)
          python -m tools.review prep "out/$DATE"

      - name: Claude 이미지 검수 (기획 파일로 만든 경우)
        if: env.PLAN != '' && env.REVIEW == '1' && env.HAS_CLAUDE == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # schedule 이 GITHUB_TOKEN 으로 실행을 요청하면 실행자가 github-actions 봇이 된다
          allowed_bots: "github-actions"
          # 오래 걸리는 명령(사진 받기, 코디컷 만들기)이 2분을 넘으면 Claude Code 가 백그라운드로 돌리고
          # Claude 가 기다리다 턴을 끝내 실행이 결과 없이 끝났다 (10/3 run 104). 백그라운드를 끄고 제한 시간을 늘린다.
          settings: |
            {"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1", "BASH_DEFAULT_TIMEOUT_MS": "2400000", "BASH_MAX_TIMEOUT_MS": "3600000"}}
          prompt: |
            .claude/skills/daily-feed/SKILL.md 의 10번(이미지 검수)만 out/${{ env.DATE }} 에 대해 해.
            plan.yaml 은 고치지 말고, 종료 코드 4 는 그대로 두고 끝내.
            python 은 이미 가상환경이 잡혀 있으니 `python -m tools.review ...` 처럼 부르면 돼.
            git 커밋·푸시, 게시, 외부 전송은 하지 마.
            image-reviewer 에이전트는 run_in_background: false 로 불러 결과를 기다려.
          claude_args: >-
            --max-turns 120
            --allowedTools "Bash(python -m tools.review:*),Read,Write,Glob,Task,Agent"

      - name: 릴스 만들기 (19단계, profile reels)
        if: env.MODE != 'candidates' && env.MODE != 'edit'
        # 실패해도 캐러셀 미리보기·게시는 그대로 (릴스만 빠짐)
        continue-on-error: true
        run: |
          [ -f "out/$DATE/manifest.json" ] || { echo "결과가 없어 릴스를 만들지 않습니다"; exit 0; }
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          python -m tools.reels build "out/$DATE"

      - name: 텔레그램 미리보기
        if: env.PREVIEW == '1' && env.HAS_TELEGRAM == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -f "out/$DATE/manifest.json" ] || { echo "결과가 없어 미리보기를 보내지 않습니다"; exit 0; }
          # 샌드박스 코디컷에는 워터마크가 있어 게시하지 않는다 (미리보기만)
          # 푸시로 돌린 시험 실행도 게시하지 않는다 (생성형은 워터마크가 없어서 따로 막음)
          flag=""; [ -n "$SANDBOX" ] && { [ "$ENGINE" = photoroom ] || [ "$GITHUB_EVENT_NAME" = push ]; } && flag="--sandbox"
          python -m tools.notify preview "out/$DATE" --run "$DATE-run$RUN" $flag

      # 만들기(render·full·fix)인데 결과(manifest)가 없으면 실패로 끝내 알림이 가게 한다.
      # Claude 가 도중에 멈춰도 단계는 성공으로 끝나서, 예전에는 아무 알림 없이 미리보기만 오지 않았다 (12단계)
      - name: 결과 확인
        id: result
        # Claude 단계가 오류로 끝나도(is_error) 원인을 남기도록 항상 돈다
        if: always() && env.MODE != 'candidates' && env.MODE != 'edit'
        run: |
          [ -f "out/$DATE/manifest.json" ] && exit 0
          echo "::error::$MODE 인데 out/$DATE/manifest.json 이 없습니다 (Claude 가 도중에 멈춤)"
          f=/home/runner/work/_temp/claude-execution-output.json
          [ -f "$f" ] || exit 1
          mkdir -p /tmp/claude-log; cp "$f" /tmp/claude-log/
          # 원인을 바로 볼 수 있게 막힌 도구, 실행한 명령, 마지막 말을 로그에 남긴다
          echo "--- 막힌 도구"
          jq -c '.[] | select(.type=="result") | .permission_denials[]? | {tool_name, tool_input}' "$f" | cut -c1-600 || true
          echo "--- 실행한 명령 (마지막 25개)"
          jq -r '.[] | select(.type=="assistant") | .message.content[]? | select(.type=="tool_use")
            | "\(.name) \(.input.command // .input.file_path // .input.description // "" | tostring)"' "$f" | tail -25 | cut -c1-300 || true
          echo "--- Claude 마지막 말"
          jq -r '[.[] | select(.type=="assistant") | .message.content[]? | select(.type=="text") | .text] | .[-3:][]' "$f" | cut -c1-800 || true
          exit 1

      - name: Claude 실행 기록 (결과가 없을 때 원인 확인용, 저장소에는 올리지 않음)
        if: failure() && steps.result.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: claude-log-${{ env.DATE }}-${{ github.run_number }}
          path: /tmp/claude-log
          if-no-files-found: ignore
          retention-days: 14

      - name: 요약 표시
        if: always()
        run: |
          f="out/$DATE/report.md"; [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          f="out/$DATE/caption.txt"; [ -f "$f" ] && { echo; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          true

      - name: 사용량 한도 기록 (한도가 풀리면 schedule 이 같은 입력으로 다시 돌림)
        if: failure()
        env:
          WORKFLOW: daily.yml
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          # 날짜는 이번에 정한 게시 날짜로 고정한다 (빈칸이면 다시 돌릴 때 날짜가 바뀜)
          INPUTS=$(jq -c --arg date "$DATE" '. + {date: $date}' <<< "$INPUTS") \
            KEY="daily:$ACCOUNT:$DATE" RUN_DIR="$DATE-run$RUN" .github/scripts/limit.sh

      - name: 올릴 파일 고르기 (쇼핑몰 원본 사진 제외)
        if: always()
        run: |
          mkdir -p /tmp/upload
          [ -d "out/$DATE" ] || exit 0
          rsync -a --exclude '/photos/' --exclude 'src/' --exclude 'originals/' \
            --exclude '/picks/photos/' --exclude '/picks/sheets/' --exclude '/previous/' \
            --exclude '/before/' --exclude '/earlier/' "out/$DATE/" /tmp/upload/
          # 게시 job 이 샌드박스(워터마크) 결과를 게시하지 않도록 만든 방식을 남긴다
          sandbox=false; [ -n "$SANDBOX" ] && { [ "$ENGINE" = photoroom ] || [ "$GITHUB_EVENT_NAME" = push ]; } && sandbox=true
          # pick 에 피드백 JSON(따옴표)이 들어갈 수 있어 jq 로 쓴다
          jq -n --arg run "$DATE-run$RUN" --arg account "$ACCOUNT" --argjson sandbox "$sandbox" \
            --arg mode "$MODE" --arg pick "$PICK" \
            '{run: $run, account: $account, sandbox: $sandbox, mode: $mode, pick: $pick}' > /tmp/upload/run.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-${{ env.DATE }}-${{ github.run_number }}
          path: /tmp/upload
          if-no-files-found: ignore

      - name: daily-results 브랜치에 커밋
        if: always()
        run: |
          [ -n "$(ls -A /tmp/upload)" ] || exit 0
          [ -n "$DATE" ] || exit 0  # 날짜를 정하기 전에 멈춘 실행 (10-22 run327: "-run327" 폴더로 커밋하려다 실패)
          dest="$DATE-run$RUN"
          git config user.name "github-actions[bot]"
          git config user.email "41898279+github-actions[bot]@users.noreply.github.com"
          if git fetch origin daily-results 2>/dev/null; then
            git worktree add /tmp/results origin/daily-results
            git -C /tmp/results checkout -B daily-results
          else
            git worktree add --detach /tmp/results
            git -C /tmp/results checkout --orphan daily-results
            git -C /tmp/results rm -rf --quiet .
          fi
          mkdir -p "/tmp/results/$dest"
          cp -r /tmp/upload/. "/tmp/results/$dest/"
          echo "source: ${{ github.sha }} account: $ACCOUNT plan: ${PLAN:-claude}" > "/tmp/results/$dest/SOURCE.txt"
          git -C /tmp/results add "$dest"
          git -C /tmp/results commit -m "하루 게시물 $dest"
          git -C /tmp/results push origin daily-results

      - name: 실패 알림
        # 시간 제한으로 끊긴 실행(cancelled)도 알린다 (2026-10-22 run337 은 알림 없이 멈춰 흐름이 기다리기만 함)
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: "[${{ env.ACCOUNT }}] ${{ env.DATE }} 게시물 만들기(${{ env.MODE }}) ${{ job.status == 'cancelled' && '중단 (시간 제한이거나 취소)' || '실패' }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          [ -n "$LIMITED" ] && TEXT="$TEXT
          Claude 사용량 한도로 멈췄어요. 한도가 풀리면 자동으로 다시 시작해요"
          .github/scripts/alert.sh
