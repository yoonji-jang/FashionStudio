name: ci

# main 머지 때는 다시 돌리지 않는다 (PR 에서 이미 검사함, Actions 사용 시간 절약)
on:
  pull_request:
  # 봇이 GITHUB_TOKEN 으로 만든 PR(feedback-rules)은 pull_request 로 돌지 않아 직접 부른다
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run python -m core.profile
      # 느린 이미지 테스트가 있어 두 프로세스로 나눠 돌린다 (pytest-xdist)
      - run: uv run pytest -n auto
