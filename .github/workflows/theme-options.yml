name: theme-options

# 차례 흐름 (2026-10-14 사용자, tools.flow): 한 게시물이 게시되면 다음 게시물 주제를 허락받는다.
# Claude(plan-themes "제안")가 주제 몇 개(profile flow.theme_options)를 짜면 data/<계정>/theme_options.json 에 저장·커밋하고
# 텔레그램으로 보낸다. 사용자가 번호를 고르면 schedule(tools.flow)이 그 주제로 코디 후보를 요청한다.
# hint 가 있으면 사용자가 "/theme …" 로 직접 적은 주제: 1개만 짜고 보내지 않는다 (schedule 이 바로 진행).
# week 면 주간 후보(profile flow.week_options, 보통 10개, 2026-10-19 사용자). feedback 은 사용자가 후보에 답한
# 고칠 점: 앞 후보를 그대로 고쳐 다시 보낸다 (쓸 번호까지 적었으면 chosen 을 채워 보내지 않고 바로 정한다).
on:
  workflow_dispatch:
    inputs:
      account:
        description: 계정
        default: women
      date:
        description: 게시 날짜 YYYY-MM-DD
        required: true
      hint:
        description: 사용자가 적은 주제 (빈칸이면 여러 개 제안)
        default: ""
      week:
        description: 주간 주제 후보 (flow.week_options 개)
        type: boolean
        default: false
      feedback:
        description: 주간 후보에 사용자가 답한 고칠 점 (빈칸이면 새 후보)
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  options:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: theme-options-${{ inputs.account }}
      cancel-in-progress: false
    env:
      ACCOUNT: ${{ inputs.account }}
      DATE: ${{ inputs.date }}
      HINT: ${{ inputs.hint }}
      FEEDBACK: ${{ inputs.feedback }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev

      - name: 준비 (앞 제안)
        run: |
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          mkdir -p out
          # 같은 날짜로 앞서 보낸 제안이 있으면 "다시" 요청이다: Claude 가 겹치지 않게 참고한다
          uv run python - <<'PY'
          import os, yaml
          from tools import flow
          from core.store import Store
          opts = flow.load_options(Store(os.environ["ACCOUNT"]))
          if opts and str(opts.date) == os.environ["DATE"] and not opts.hint:
              with open("out/theme_options_previous.yaml", "w", encoding="utf-8") as f:
                  yaml.safe_dump([t.model_dump(mode="json") for t in opts.options], f, allow_unicode=True)
          if os.environ.get("FEEDBACK"):
              with open("out/theme_feedback.txt", "w", encoding="utf-8") as f:
                  f.write(os.environ["FEEDBACK"] + "\n")
          PY

      - name: Claude 주제 제안 (plan-themes "제안")
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # schedule 이 GITHUB_TOKEN 으로 실행을 요청하면 실행자가 github-actions 봇이 된다
          allowed_bots: "github-actions"
          prompt: |
            .claude/skills/plan-themes/SKILL.md 의 ${{ inputs.week && '"주간 후보"' || '"제안"' }} 방법으로 ${{ env.DATE }} ${{ inputs.week && '부터 한 주 주제 후보를' || '게시물 주제를' }} 정해
            out/theme_options.yaml 에 써.
            ACCOUNT=${{ env.ACCOUNT }} HINT=${{ env.HINT }}
            python 은 이미 가상환경이 잡혀 있으니 `python -m tools.plan context ...` 처럼 부르면 돼.
            저장·텔레그램은 워크플로가 하니 git 커밋·푸시, 게시, 외부 전송은 하지 마.
          claude_args: >-
            --max-turns ${{ inputs.week && '60' || '40' }}
            --allowedTools "Bash(python -m tools.plan context:*),Read,Write,Edit,Glob,Grep"

      - name: 검사·저장·텔레그램으로 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          send=""; [ -n "$TELEGRAM_BOT_TOKEN" ] && send="--send"
          python -m tools.flow options --account "$ACCOUNT" --date "$DATE" \
            --file out/theme_options.yaml --hint "$HINT" ${{ inputs.week && '--week' || '' }} $send

      - name: 제안 주제 커밋
        run: |
          f="data/$ACCOUNT/theme_options.json"
          cp "$f" /tmp/theme_options.json
          for i in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"
            git reset -q --hard "origin/${{ github.ref_name }}"
            cp /tmp/theme_options.json "$f"
            git add "$f"
            git diff --cached --quiet && exit 0
            git -c user.name="github-actions[bot]" \
              -c user.email="41898279+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "주제 제안 $ACCOUNT $DATE"
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: 사용량 한도 기록 (한도가 풀리면 schedule 이 같은 입력으로 다시 돌림)
        if: failure()
        env:
          WORKFLOW: theme-options.yml
          INPUTS: ${{ toJSON(inputs) }}
        run: KEY="theme-options:$ACCOUNT" .github/scripts/limit.sh

      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: "[${{ inputs.account }}] ${{ inputs.date }} 주제 제안 실패: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          [ -n "$LIMITED" ] && TEXT="$TEXT
          Claude 사용량 한도로 멈췄어요. 한도가 풀리면 자동으로 다시 시작해요"
          .github/scripts/alert.sh
