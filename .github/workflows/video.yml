name: video

# 코디 영상 만들기 (2026-11-02 사용자, tools.video, profile video.make). Claude 는 부르지 않는다.
# 차례 흐름(tools.flow)이 단계마다 부른다: plan(그림 계획, 무료) → background(빈 배경) → frames(첫 장면)
# → prompts(지시문) → clips(영상·편집). 그림은 그리기 전과 그린 뒤 모두 사용자 /ok 를 받는다.
# 텔레그램 답(/fix N, /speed, /제목, /order, /music, /frame N)도 같은 워크플로를 다른 입력으로 부른다.
# 결과는 daily-results 의 <결과 폴더>/video/ 에 커밋한다. OpenRouter 요금이 나간다 (영상 한 편 약 $5.7).
# 게시는 하지 않는다 (영상은 사용자가 직접 올린다).
on:
  workflow_dispatch:
    inputs:
      account:
        description: 계정
        default: women
      date:
        description: 게시 날짜 YYYY-MM-DD
        required: true
      run:
        description: 결과 폴더 (daily-results 의 <날짜>-run<번호>)
        required: true
      step:
        description: plan / background / frames / scene_frames(코디컷 없이 상품 사진에서 첫 장면, looks 로 한 벌씩) / prompts / clips / redo(첫 장면부터 그 벌 영상까지) / edit / music / subset(looks 의 벌만 새 결과 폴더로, 후보 실행이면 picks/p<pick>.yaml 에서)
        required: true
      looks:
        description: 다시 만들 벌 번호 (빈칸이면 전부 또는 고칠 점의 벌)
        default: ""
      note:
        description: 고칠 점 ("3:얼굴이 달라" 또는 모든 벌에 "더 빨리 걷게", 배경은 "배경:…")
        default: ""
      base:
        description: 이 번째 빈 배경에서 고칠 점만 고치기 (background, 빈칸이면 새로 그림)
        default: ""
      background:
        description: 빈 배경부터 다시 그리기
        type: boolean
        default: false
      speed:
        description: 편집 속도 (edit, 예 1.3)
        default: ""
      hook:
        description: 첫 화면 문구 (edit)
        default: ""
      order:
        description: 순서 (edit, 예 "3 1 2 4 5 6")
        default: ""
      pick:
        description: 후보 실행의 후보 번호 (subset, picks/p<번호>.yaml. 빈칸이면 코디컷 결과, 없으면 1)
        default: ""
      concept:
        description: 고른 영상 컨셉 번호 (비면 video_concepts.json 의 chosen)
        default: ""
      model:
        description: 영상 모델 비교 시험 (clips, config video.models 키. 결과는 clips_<모델>/)
        default: ""
      fake:
        description: API 없이 흐름만 (가짜 그림·영상)
        type: boolean
        default: false
      telegram:
        description: 텔레그램으로 보내기 (끄면 진행·결과·실패 알림을 하나도 안 보냄. 클로드 스레드에서 진행할 때)
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write  # 첫 장면 검수 (Claude image-reviewer)

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: video-${{ inputs.account }}
      cancel-in-progress: false
    env:
      ACCOUNT: ${{ inputs.account }}
      DATE: ${{ inputs.date }}
      RUN: ${{ inputs.run }}
      STEP: ${{ inputs.step }}
      LOOKS: ${{ inputs.looks }}
      NOTE: ${{ inputs.note }}
      SPEED: ${{ inputs.speed }}
      HOOK: ${{ inputs.hook }}
      ORDER: ${{ inputs.order }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - name: ffmpeg 준비
        run: command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }

      # 첫 장면을 상품 사진에서 바로 그릴 때 (scene_frames) 참고 코디 사진 "sealed:<이름>" 을 러너 안에서만 푼다
      - name: 클로드 스레드 참고 사진 풀기
        if: inputs.step == 'scene_frames'
        env:
          REF_SEAL_SEED: ${{ secrets.OPENROUTER_API_KEY }}
        run: '[ -d "data/$ACCOUNT/user_refs" ] && uv run python -m tools.sealed open "data/$ACCOUNT/user_refs" || true'

      - name: 결과 폴더 가져오기
        run: |
          git fetch -q origin daily-results
          git worktree add /tmp/results origin/daily-results
          git -C /tmp/results checkout -q -B daily-results
          # render 결과(manifest), 후보 실행에서 고른 폴더(plan.yaml), 후보 실행(picks/) 모두 된다
          r="/tmp/results/$RUN"
          [ -f "$r/manifest.json" ] || [ -f "$r/plan.yaml" ] || [ -d "$r/picks" ] || { echo "결과 폴더가 없어요: $RUN"; exit 1; }

      # 영상에 넣을 벌만 골라 <결과 폴더>-l<번호들> 로 (2026-11-05 클로드 스레드, 요금 없음)
      - name: 벌 고르기 (subset)
        if: inputs.step == 'subset'
        run: |
          name=$(uv run python -m tools.video subset --account "$ACCOUNT" --run "/tmp/results/$RUN" --looks $LOOKS \
            ${{ inputs.pick && format('--pick {0}', inputs.pick) || '' }} | tail -1)
          echo "새 결과 폴더: $name" >> "$GITHUB_STEP_SUMMARY"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898279+github-actions[bot]@users.noreply.github.com"
          cp -r "/tmp/results/$name" /tmp/subset_out
          for i in 1 2 3; do
            git -C /tmp/results fetch -q origin daily-results
            git -C /tmp/results reset -q --hard origin/daily-results
            rm -rf "/tmp/results/$name" && cp -r /tmp/subset_out "/tmp/results/$name"
            git -C /tmp/results add "$name"
            git -C /tmp/results diff --cached --quiet && exit 0
            git -C /tmp/results commit -q -m "영상용 벌 고르기 $name"
            git -C /tmp/results push -q origin daily-results && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: 영상 만들기 (${{ inputs.step }})
        if: inputs.step != 'subset'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram) && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          args=(--account "$ACCOUNT" --run "/tmp/results/$RUN" --face "/tmp/results/flow/$ACCOUNT/face.jpg")
          [ -n "$LOOKS" ] && args+=(--looks $LOOKS)
          [ -n "$NOTE" ] && args+=(--note "$NOTE")
          [ "${{ inputs.background }}" = "true" ] && args+=(--background)
          [ -n "${{ inputs.base }}" ] && args+=(--base "${{ inputs.base }}")
          [ -n "$SPEED" ] && args+=(--speed "$SPEED")
          [ -n "$HOOK" ] && args+=(--hook "$HOOK")
          [ -n "$ORDER" ] && args+=(--order $ORDER)
          [ -n "${{ inputs.concept }}" ] && args+=(--concept "${{ inputs.concept }}")
          [ -n "${{ inputs.model }}" ] && args+=(--model "${{ inputs.model }}")  # 여러 개면 띄어 써서
          [ "${{ inputs.fake }}" = "true" ] && args+=(--fake)
          [ -n "$TELEGRAM_BOT_TOKEN" ] || args+=(--no-send)
          uv run python -m tools.video "$STEP" "${args[@]}"

      # 첫 장면 상품 검수 (2026-11-07): 그린 벌마다 tools.review prep → image-reviewer → apply.
      # 결과는 video/scene/<n>/review/ (점수·메모). 떨어져도 다시 그리지 않는다 (사용자가 보고 /fix)
      - name: 첫 장면 검수 준비
        id: scene_review
        if: inputs.step == 'scene_frames' && !inputs.fake
        run: |
          v="/tmp/results/$RUN/video"
          looks=$(cat "$v/scene/drawn.txt" 2>/dev/null || true)
          [ -n "$looks" ] || exit 0
          mkdir -p out/scene_review
          for n in $looks; do
            rm -rf "out/scene_review/$n" && cp -r "$v/scene/$n" "out/scene_review/$n"
            uv run python -m tools.review prep "out/scene_review/$n"
          done
          echo "looks=$looks" >> "$GITHUB_OUTPUT"

      - name: Claude 첫 장면 검수 (image-reviewer)
        if: steps.scene_review.outputs.looks != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions"
          prompt: |
            영상 첫 장면 검수. 벌 번호: ${{ steps.scene_review.outputs.looks }}
            벌마다 image-reviewer 에이전트를 run_in_background: false 로 불러 out/scene_review/<번호> 폴더와
            out/scene_review/<번호>/review/input.md 를 넘기고 ("영상 첫 장면" 기준), 돌려준 YAML 을 그대로
            out/scene_review/<번호>/review/scores.yaml 에 써. 점수를 고치지 마.
            git 커밋·푸시, 게시, 외부 전송은 하지 마.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Write,Glob,Task,Agent"

      - name: 첫 장면 검수 적용
        if: steps.scene_review.outputs.looks != ''
        run: |
          v="/tmp/results/$RUN/video"
          for n in ${{ steps.scene_review.outputs.looks }}; do
            d="out/scene_review/$n"
            if [ -f "$d/review/scores.yaml" ]; then
              r=$(uv run python -m tools.review apply "$d" --scores "$d/review/scores.yaml" || true)
              echo "LOOK $n 검수: $r" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "LOOK $n 검수 점수가 없어요" >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -rf "$v/scene/$n/review" && cp -r "$d/review" "$v/scene/$n/review"
            [ -f "$d/report.md" ] && cp "$d/report.md" "$v/scene/$n/report.md"
          done

      - name: daily-results 브랜치에 커밋
        if: always()
        run: |
          [ -d "/tmp/results/$RUN/video" ] || exit 0
          cp -r "/tmp/results/$RUN/video" /tmp/video_out
          # 첫 장면 검수 원본(쇼핑몰 사진·참고 코디 사진)은 올리지 않는다
          find /tmp/video_out -type d -name originals -prune -exec rm -rf {} +
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898279+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git -C /tmp/results fetch -q origin daily-results
            git -C /tmp/results reset -q --hard origin/daily-results
            rm -rf "/tmp/results/$RUN/video" && cp -r /tmp/video_out "/tmp/results/$RUN/video"
            git -C /tmp/results add "$RUN/video"
            git -C /tmp/results diff --cached --quiet && exit 0
            git -C /tmp/results commit -q -m "코디 영상 $RUN ($STEP)"
            git -C /tmp/results push -q origin daily-results && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: 실패 알림
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ (github.event_name != 'workflow_dispatch' || inputs.telegram) && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: "[${{ inputs.account }}] ${{ inputs.date }} 코디 영상(${{ inputs.step }}) 실패: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            /retry 를 보내면 다시 시도해요"
        run: .github/scripts/alert.sh
