    notes: 3번 바지가 원본(발목이 오므려진 벌룬 와이드)과 다르게 앞 주름이 잡힌 일자 와이드 슬랙스로 그려지고 밑단 개더도 없음. 컵 슬리브에 흐릿한 글자 같은 무늬가 있음. 바닥 낙엽이 고르게 흩어져 있어 약간 연출 같고 왼쪽 신발이 화면 아래 끝에 가까움. 얼굴은 옆모습으로 돌려 일부만 보여 괜찮음. 가디건, 벨트, 목걸이, 블랙 숄더백, 메리제인은 원본과 같고 소품 개수도 맞음.
summary: c2 는 얼굴과 입은 모양, 기장은 문제 없음. 하지만 바지가 벌룬 핏이 아니라 주름 슬랙스로 바뀌어 shape 0 이라 통과 기준(0점 항목 없음)에 미달함.
