covers:
  - id: c1
    color: 2
    shape: 1
    complete: 2
    clean: 0
    layout: 2
    notes: >-
      반지는 목록에 없는데, 카메라를 든 오른손 손가락에 은색 반지가 보이고 오른쪽 귀 쪽에도 은색 귀걸이처럼 보이는 것이 있다. 없는 물건이라 clean 0.
      3번 스커트는 핀스트라이프, 랩 겹침, 옆 슬릿이 원본과 같지만 앞쪽 밑단이 종아리 중간쯤에서 끝나 원본의 종아리~발목 기장보다 약간 짧다. 롱부츠 윗부분과 겹쳐 보인다. shape 1.
      1번 니트는 길이가 허리선 근처까지로 보여 원본의 힙 기장보다 조금 짧다.
      얼굴은 카메라와 손으로 대부분 가려져 있어 괜찮다. 눈·코·입이 모두 또렷한 정면 얼굴은 아니다. 헤어는 가르마를 탄 슬릭번이라 요청대로다.
      배경은 장면 사진과 같은 계단 공간(화병, 마른 가지, 베이지 벽)이라 무드는 맞다. 다만 장면 속 인물의 포즈와는 다르게 정면 카메라 가림 포즈로 그려 복사 느낌은 없다.
      전신이 다 보이고 테두리가 없다. 블랙 홀터 이너 끈이 목선에 보이고, 롱 실버 목걸이, 블랙 크링클 숄더백, 스퀘어토 롱부츠는 모두 원본과 같다.
    faults: []
  - id: c2
    color: 2
    shape: 1
    complete: 2
    clean: 0
    layout: 2
    notes: >-
      3번 스커트는 핀스트라이프와 랩 겹침은 원본과 같다. 하지만 밑단이 종아리 중간쯤에서 끝나 원본의 종아리~발목 기장보다 짧고, 옆 슬릿과 비대칭 자락은 단순한 랩으로 바뀌었다. shape 1.
      목록에 없는 은색 귀걸이가 귓불에 보이고, 치마 쪽으로 내린 왼손 손가락에 반지처럼 보이는 것도 있다. 애매하면 낮게 주므로 clean 0.
      1번 니트는 버건디 색과 V넥, 드롭숄더가 원본과 같다. 2번 블랙 홀터 끈은 목선에 보이고, 4번 가방, 5번 스퀘어토 롱부츠, 6번 롱 목걸이도 모두 있다.
      얼굴은 카메라와 손으로 거의 가려져 있어 괜찮다. 슬릭번 헤어도 요청대로다.
      포즈는 장면 속 사람과 달라 복사 느낌이 없다. 전신이 보이고 테두리가 없다.
    faults: [hem_short]
summary: 상품 구성과 장면 무드는 잘 맞지만, 목록에 없는 반지(귀걸이 가능성)가 그려져 clean 0이라 통과 기준(0점 항목 없음)에 걸린다. 반지를 빼고 스커트 기장을 발목 쪽으로 조금 늘려 다시 그리는 것이 좋다.
