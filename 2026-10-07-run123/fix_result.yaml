changes:
  - "2장 1번 벌: 하늘색 쁘띠 스카프를 빼고 다시 그림. 자켓은 엉덩이 덮는 오버핏 유지 (검수 7/10, 사람 확인 필요: 자켓 절개선·단추 수가 원본과 조금 다름)"
  - "6장 5번 벌: 스카프를 빼고 치마를 발목까지 오는 롱 기장(85cm)으로, 이름은 '새틴 롱 스커트'로 되돌림 (검수 8/10 통과)"
  - "6장 5번 벌: 가디건 줄무늬·가방은 원본과 가깝게 그려짐. 가디건 앞여밈이 조금 벌어진 점은 남음"
  - "2번 벌(3장): 말씀 없어 그대로 둠 (지난 검수 6/10, 사람 확인 상태)"
