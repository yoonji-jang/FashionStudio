changes:
  - "1장 표지: 콜라주를 끄고 1번 벌 코디컷에 제목을 얹음. 5번 벌을 표지로 쓰는 기능은 없어 5번 벌 표지는 못 함"
  - "2장 1번 벌: 슬랙스를 107cm 실제 기장으로 길게 다시 그리게 했으나 3번 다시 그려도 바지가 코트보다 짧게 나옴 (검수 6/10, 사람 확인 필요)"
  - "4장 3번 벌: 하프자켓을 길고 박시한 오버핏·부드러운 레더 질감으로, 부츠컷을 풀 기장으로 다시 그림 (검수 9/10)"
  - "5장 4번 벌: 셔츠 소매 안 접고 카라를 부드럽게, 슬랙스를 더 길고 와이드하게 다시 그림 (검수 8/10). 베스트가 상품 창고에서 빠져 캡슬리브 하프넥 베스트(제너럴아이디어)로 교체"
  - "7장 6번 벌: 바지 안 접고 부츠컷을 길고 분명하게 다시 그림 (검수 8/10)"
  - "3·4·6번 벌 바지 기장: 실측표가 없어 레더 자켓 75cm, 부츠컷 팬츠 105cm 로 추정해 적음"
  - "3·5장 2·5번 벌: 피드백이 없어 그대로 둠"
