covers:
  - id: c2
    color: 2
    shape: 1
    complete: 2
    clean: 2
    layout: 1
    notes: "2번 슬랙스가 짧다. 밑단이 발목 위에서 끝나 신발과 떨어져 크롭처럼 보이고, 106cm 바지가 50cm 가디건의 1.3배에도 못 미친다. 바지 길이가 어깨~허리의 2배쯤은 돼야 한다. 가디건 밑단이 슬랙스 허리밴드를 조금 덮어 허리 디자인이 일부 가려진다. 1번 가디건은 깃과 단추를 풀어 연 모양이 착용 기준 사진과 비슷하지만, 안쪽에 버건디 이너처럼 보이는 층이 있어 원본에 없는 옷일 수 있다. 가방이 바지 오른쪽 옆에 살짝 닿는다. 신발 두 짝은 나란하고 앞코가 아래를 향해 정상이다. 목걸이는 한 줄이고 하트도 원본과 같다. 글자는 보이지 않는다."
    faults: [hem_short]
summary: "c2 는 색, 소재, 신발, 목걸이는 원본과 같다. 하지만 슬랙스가 짧은 크롭처럼 그려졌고 상의와의 비율도 맞지 않아 hem_short 결함이다. 합계는 8점이지만 결함 때문에 불합격이라 다시 그려야 한다. 다시 그릴 때는 바지를 어깨~허리의 2배쯤으로 길게 내려 신발 바로 위까지 닿게 하고, 가디건 밑단이 허리밴드를 덮지 않게 한다."
