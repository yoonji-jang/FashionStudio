    notes: "7번 목걸이가 가디건 위에 걸쳐 있고 보라색 로고와 겹침. 하트 펜던트가 작아서 하트인지 알아보기 어려움. 3번 바지에 앞 턱 주름이 두 줄 보이는데 원본 사진에서는 확인되지 않음. 바지가 가디건 기장에 비해 길어 보임(실제 98cm 대 68cm 는 약 1.4배인데 그림은 2배쯤). 나머지 상품은 원본과 같음: 올리브 케이블 가디건의 단추, 흰 셔츠 칼라, 벨트, 가방, 메리제인 한 켤레(2짝)."
summary: "c2 는 색과 주요 상품이 원본에 가깝고 제목 자리(왼쪽 아래)도 비어 있음. 목걸이가 옷 위에 놓인 점과 바지·가디건 비율이 아쉬움. 점수 합계는 6점(2+1+1+1+1)이고 0점 항목은 없음. 합계 기준 8점에는 못 미침."
