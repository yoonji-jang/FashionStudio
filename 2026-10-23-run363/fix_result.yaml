changes:
  - "1장 표지(1벌): 점퍼 지퍼를 후드 목선까지 완전히 올려 고쳐 그림 (2회 그림, 검수 9/10)"
  - "2장(2벌): 카멜 점퍼를 몸판·소매 모두 훨씬 풍성하고 도톰하게 고쳐 그림 (2회 그림, 검수 9/10). 밑단에 고무줄 밴드가 생김"
  - "3장(3벌): 코트 카라를 세우고 얼굴 톤을 밝히고 몸을 살짝 옆으로 돌려 고쳐 그림 (검수 8/10)"
  - "6장(6벌): 숏팬츠를 상품 사진대로 처음부터 다시 그림 - 롤업 없는 일자 밑단, 매우 짧은 기장, 허리 단추·주머니 징, 진한 검정 (검수 9/10)"
  - "6장 밑위: 상품 사진이 낮은~중간 밑위라 그렇게 적었으나 그림은 여전히 중간 정도로 보임 (검수 메모)"
  - "1장 점퍼 둥근 풍선 실루엣·후드 빳빳함은 원본보다 약하다는 검수 메모가 있음 (요청 밖이라 그대로 둠)"
interpretation:
  - "표지(1장)는 1번 벌 코디컷이라 1벌을 고침"
  - "6장 바지는 상품과 다르다는 피드백이라 고쳐 그리지 않고 photo-checker 로 상세 사진을 다시 보고 desc·styling 을 고친 뒤 처음부터 그림"
