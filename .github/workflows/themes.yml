      # 2026-10-26 사용자: 주제 직전에 그 주제로 이미지를 검색해서 참고 코디를 고른다 (다음·네이버 공식 API).
      # Claude 는 검색어만 정하고, 검색·확인표는 코드가 키를 써서 만든다 (Claude 에게 키를 주지 않음)
      - name: Claude 참고 코디 검색어 (plan-themes "참고 코디 검색")
        if: env.REF_SEARCH == '1' && inputs.refs_only && inputs.user_photos == ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions"
          prompt: |
            .claude/skills/plan-themes/SKILL.md 의 "참고 코디 검색" 1번만 해: 검색어만 정해.
            주제는 out/week_themes.txt (한 줄). ACCOUNT=${{ env.ACCOUNT }}.
            검색어 6~8개를 한 줄에 하나씩 out/ref_queries.txt 에 Write 해. 다른 일은 하지 마.
          claude_args: >-
            --max-turns 15
            --allowedTools "Read,Write,Glob,Grep"

      - name: 이미지 검색 확인표 만들기 (tools.ref_search)
        if: env.REF_SEARCH == '1' && inputs.refs_only && inputs.user_photos == ''
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
        run: |
          [ -s out/ref_queries.txt ] || head -n 1 out/week_themes.txt | sed 's/ — .*//; s/$/ 코디/' > out/ref_queries.txt
          args=()
          while IFS= read -r q; do [ -n "$q" ] && args+=(--query "$q"); done < out/ref_queries.txt
          timeout 25m python -m tools.ref_search sheets --account "$ACCOUNT" --out out/refs/search "${args[@]}" \
            || echo "검색 확인표 실패"
          cat out/refs/search/summary.json 2>/dev/null || true

