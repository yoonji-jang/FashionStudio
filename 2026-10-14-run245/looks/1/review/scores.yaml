summary: c2 는 스카프가 여전히 셔츠 칼라 위에 묶여 있고 신발 정돈과 가방 글자 문제가 남아 불합격. 합계는 c2 6점으로 c1 과 같고, 어느 쪽도 통과 기준(결함 없음, 0점 항목 없음)을 못 채움. 스카프를 목 옆에 따로 놓고, 가방을 자켓 밖으로 옮기고, 신발을 나란히 정리해 다시 그려야 함.
