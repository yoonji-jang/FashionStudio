# 여성 코디 계정 설정. 스킬·도구는 모두 이 파일을 읽어 판단한다.
id: women
display_name: 여성 데일리 코디
language: ko

audience:
  gender: women
  age_range: [20, 34]
  description: 출근과 주말을 오가는 20~30대 여성. 과하지 않고 따라 입기 쉬운 코디를 찾음

style:
  keywords: [미니멀, 클래식, 데일리, 오피스룩]
  palette: [블랙, 아이보리, 그레이, 베이지, 네이비, 버건디]
  avoid: [과한 로고, 형광색, 코스튬 느낌]

outfit:
  items_min: 5
  items_max: 7
  slots:
    - {category: 아우터, required: false}  # 계절에 따라 생략
    - {category: 상의}
    - {category: 하의}
    - {category: 가방}
    - {category: 신발}
    - {category: 소품, required: false}
  reuse_cooldown_days: 14
  max_per_shop: 2

themes:  # 주간 주제 정하는 기준 (매주 일요일 다음 주 7개 생성)
  per_week: 7
  type_mix:        # 주당 유형별 개수, 합계가 per_week와 같아야 함
    아이템: 2      # 예) 가을 코디가 고민이라면 레더자켓
    상황: 2        # 예) 월요일 출근룩, 주말 브런치
    컬러무드: 1    # 예) 무채색으로 분위기 내기
    타깃: 1        # 예) 첫 데이트, 키 작은 분들
    팁: 1          # 예) 컬러 매치 TIP
  consider: [계절, 서울 날씨 예보, 요일, 시즌 이벤트, 지난 게시물 반응]
  events: [개강, 추석, 할로윈, 연말 모임, 크리스마스, 설날, 졸업·입학, 벚꽃, 휴가철]
  no_repeat_days: 30
  avoid: [노출이 과한 코디, 특정 체형 비하, 정치·사회 이슈]
  review_before_use: true  # 텔레그램으로 주제 7개를 먼저 보고 확정
  weather: {name: 서울, lat: 37.57, lon: 126.98}  # 날씨 예보를 볼 곳 (null 이면 안 봄)

product_source:
  name: zigzag
  min_rating: 4.5
  min_reviews: 20
  prefer_flat_shot: true
  # 상품 창고를 채울 검색어 (카테고리별). 주제에 맞는 검색어는 5단계에서 Claude가 따로 더한다
  queries:
    아우터: [레더자켓, 트렌치코트, 울 코트, 트위드 자켓, 니트 가디건]
    상의: [셔츠, 블라우스, 니트, 터틀넥]
    하의: [와이드 슬랙스, 데님 팬츠, 롱스커트]
    가방: [숄더백, 토트백]
    신발: [로퍼, 앵클부츠, 메리제인]
    소품: [목걸이, 귀걸이, 벨트]
  per_query: 10          # 검색어마다 상세까지 확인할 상품 수
  max_per_category: 60   # 카테고리별 창고 최대 보관 수
  recheck_days: 3        # 창고 상품의 판매 상태를 다시 확인하는 주기

visual:
  backdrop: warm light-grey textured plaster surface, soft even studio light, subtle natural drop shadows
  backdrop_ref: null  # 2단계에서 배경 참고 이미지를 만들면 backdrop_ref.jpg 로 지정
  feed_ratio: "4:5"
  # 제목 합성 (tools.overlay). 글자 크기는 폭 1080px 기준, 위치는 이미지 대비 비율
  font: Pretendard-Bold.otf   # assets/fonts/ 에 있는 파일
  title_font_size: 70         # 긴 줄은 자동으로 줄어듦
  title_line_spacing: 1.34
  title_max_lines: 2
  title_align: left           # left 또는 center (center 면 세로선 생략)
  title_margin_x: 0.104       # 좌우 여백 (폭 대비)
  title_bottom: 0.155         # 이미지 아래에서 제목 마지막 줄까지 (높이 대비)
  title_color: "#FFFFFF"
  text_shadow: 0.45           # 글자 뒤 그림자 (0이면 없음)
  accent_color: "#7A2E34"     # 제목 왼쪽 세로선 색 (버건디). null 이면 선 없음
  accent_width: 6
  accent_gap: 26
  gradient_height: 0.38       # 아래쪽 어둡게 까는 높이 (이미지 아래 38%)
  gradient_opacity: 0.5       # 맨 아래 어두운 정도 (0~1)
  logo_text: "@janggu.zip"    # 인스타 아이디. 빈 문자열이면 생략
  logo_font: Pretendard-Medium.otf
  logo_font_size: 22
  logo_align: left            # left(제목에 맞춤) 또는 center
  logo_bottom: 0.065          # 이미지 아래에서 계정 이름까지
  logo_color: "#EBEBEB"

# 캐러셀 구성 (tools.feed). 크기는 폭 1080px 기준, 굵은 글자는 visual.font, 포인트 색은 visual.accent_color
feed:
  slides: [cover, products, summary, comment]  # 순서. products 는 상품마다 한 장, comment 는 댓글 안내 장. 전체 10장까지
  product_image: photo       # 상품 장 사진: photo(쇼핑몰 원본 사진) 또는 cutout(누끼)
  hide_faces: true           # 모델 얼굴이 없는 사진을 먼저 고르고, 없으면 얼굴 아래로 잘라 씀
  photo_candidates: 6        # 상품마다 살펴볼 사진 수 (앞에서부터)
  background: "#E7E9EB"      # 상품·요약 장 배경색 (코디컷 쿨그레이 바닥에 맞춤, 2026-09-30)
  background_image: null     # accounts/women/ 기준 배경 사진 (있으면 배경색 대신)
  text_color: "#222222"
  sub_color: "#868B90"       # 쇼핑몰·카테고리 같은 보조 글자
  comment_color: "#51565B"
  body_font: Pretendard-Medium.otf
  margin_x: 0.104            # 좌우 여백 (표지 제목과 같게)
  text_top: 0.70             # 상품 장 글자 시작 높이. 넘길 때 같은 자리에 오도록 고정
  show_index: true           # 상품 장 위 "01 아우터"
  show_shop: true
  show_price: true
  show_total: false          # 요약 장에 가격 합계
  index_size: 26
  shop_size: 28
  name_size: 52
  name_max_lines: 2
  price_size: 40
  comment_size: 31
  comment_max_lines: 3
  heading: 오늘의 코디         # 요약 장 제목
  heading_size: 60
  row_name_size: 32
  row_meta_size: 25
  cta_lines:                 # 요약 장 맨 아래. {logo} 는 visual.logo_text
    - 저장해 두고 코디 고민될 때 꺼내 보세요
    - 매일 아침 코디는 {logo}
  cta_size: 30
  # 댓글 안내 장 (slides 의 comment, 2026-09-30). 댓글을 남기면 ManyChat 이 DM 으로 링크를 보냄
  comment_title: [상품 정보가 궁금하다면, 댓글을 남겨 주세요]
  comment_sub: [댓글을 남기면 DM으로, 상품 링크를 보내 드려요]
  comment_box: ""   # 댓글 입력창 모양 안의 글자. 빈 문자열이면 창 없음 (2026-09-30 사용자: 없어도 됨)
  comment_title_size: 64
  comment_sub_size: 32
  # 사진 출처 표기 (사진 오른쪽 아래). {source} 는 source_names 의 이름, {shop} 은 스토어 이름
  photo_credit: "사진 출처 {source} · {shop}"
  summary_credit: "사진 출처 지그재그 · 각 상품 스토어"  # 요약 장 목록 아래. 빈 문자열이면 생략
  credit_size: 20
  source_names: {zigzag: 지그재그}

# 제목·문구·캡션 규칙 (write-copy 스킬이 따르고 tools.plan check 가 검사). 말투·예시는 voice.md
copy:
  title_chars: [8, 16]       # 제목 한 줄 글자 수 (공백 포함, 벗어나면 경고)
  name_max_chars: 18         # 상품 장 짧은 이름
  comment_max_chars: 60      # 상품 장 코멘트
  intro: true                # 캡션 맨 앞 도입 한 줄 (피드에서 먼저 보이는 줄)
  points: [3, 3]             # 캡션 코디 포인트 줄 수
  hashtags: [8, 12]          # 기본 해시태그 포함 코디 해시태그 개수 (comment_tags 소통용은 따로)
  base_hashtags: ["#데일리룩", "#오늘의코디", "#코디추천", "#여자코디", "#패션"]
  max_emoji: 3               # 도입 + 코디 포인트 (제목·상품 장에는 금지)
  max_emoji_per_line: 1      # 한 줄에 하나까지
  max_exclaim: 1             # 캡션 전체 느낌표
  banned: [뚱뚱해 보이는, 하체 비만, 무조건, 인생템, 역대급, 최저가]
  ad_notice: "(광고)"  # monetize: manual_link 일 때 첫 줄 (공정위 지침: 맨 앞에 잘 보이게, 빼지 않는다)
  ad_hashtag: "#광고"        # monetize: manual_link 일 때 첫 해시태그
  product_line: "{shop} · {name}"
  link_line: 상품 정보는 프로필 링크에서 확인하세요
  ai_notice: 이미지는 AI로 합성했으며 실제 색감·디테일과 다를 수 있어요

# 이미지 파일 안에 AI 합성 표시(IPTC DigitalSourceType)를 넣는다 (13단계, tools.ai_label).
# 인스타 게시 API 에는 AI 레이블 값이 없어서, Meta 가 이 표시를 읽어 "AI 정보" 레이블을 붙이게 한다.
# mode: metadata(넣음) | none, source_type: composite(실제 사진 + AI 편집) | generated(AI 가 통째로 만듦)
ai_label:
  mode: metadata
  # generated: 이름 아래 "AI 콘텐츠" 레이블이 보이게 (composite 는 ⋯ 메뉴 안에만 보일 수 있음)
  source_type: generated
  slides: [cover]  # 누끼·AI 그림자로 만든 코디컷 표지만. 상품 장·요약 장은 쇼핑몰 사진이라 넣지 않음

# 게시 직후 내 댓글(🤍)을 달고 그 대댓글로 해시태그를 단다 (tools.publish). 켜면 캡션에는 해시태그가 없다.
# 대댓글 = 코디 해시태그(copy.hashtags) + 소통용 follow_hashtags, 최대 max 개
comment_tags:
  enabled: true
  comment: "🤍"
  follow_hashtags: ["#맞팔", "#선팔", "#소통"]
  max: 15

# 이미지 검수 (tools.review, 7단계). 코디컷 후보를 여러 장 만들고 검수 에이전트가 원본 상품과 비교해 점수를 매긴다.
# 항목 5개(색, 모양, 빠진 상품, 삐져나온 조각, 겹침·잘림) × 0~2점 = 10점 만점
review:
  candidates: 3      # 한 번에 만드는 코디컷 후보 수 (생성 1장 약 $0.15, 후보 수만큼 늘어남)
  max_rounds: 2      # 모두 기준 미달이면 다시 만드는 횟수 (첫 회 포함). 넘으면 사람 확인으로 표시
  min_score: 8       # 이 점수 이상이고 0점 항목이 없어야 통과
  check_slides: true # 상품 장 사진 색·모델 얼굴·글자 잘림도 본다

# 표지 코디컷 만드는 방식 (11단계, 2026-09-30 Photoroom 에서 바꿈). generate: 쇼핑몰 사진을 참고로
# 생성형 AI 가 코디 전체를 한 장으로 그린다 (OpenRouter, Secret OPENROUTER_API_KEY). photoroom: 예전 누끼 배치
outfit_image:
  engine: generate
  model: nano_banana_pro     # config/models.yaml generate.models 키
  prompt: outfit_generate    # prompts/outfit_generate.md
  # 모던한 명품샵 느낌의 쿨그레이 콘크리트 (2026-09-30 사용자가 4안 선택. 아이보리·베이지는 흔함)
  scene: >-
    smooth pale cool-grey polished concrete floor with subtle mottling, like a minimal modern
    flagship store; soft even daylight from the upper left, cool neutral tone with no warm cast
  # 아우터가 있는 날 기본 입히기 (기획의 styling 이 있으면 그것을 씀). 활짝 열지 않는다 (2026-09-30 사용자)
  outer_styling: >-
    The outer is unbuttoned but almost closed: its two front edges lie close together with only a
    narrow gap of about a hand's width down the middle, where the top shows at the neckline and a
    little at the waist; any belt hangs loose at the sides. The top's sleeves are inside the outer
    sleeves, with the top's cuffs peeking out slightly at the outer cuffs. The top's hem sits over
    the waistband of the bottoms.

# 매일 자동 실행 시간표 (9단계). 바꾼 뒤 `uv run python -m tools.schedule sync` 로 워크플로 시간을 맞춘다.
# 정각은 GitHub Actions 지연이 커서 피한다. Actions 는 몇 분~30분 늦게 돌 수 있다.
schedule:
  enabled: true             # false 면 자동 실행 안 함 (Actions 버튼으로만)
  timezone: Asia/Seoul
  candidates_at: "09:00"    # 코디 후보를 텔레그램으로 보냄. 게시는 다음 날 아침 (Photoroom 안 씀)
  pick_check_every: 60      # 고른 번호를 확인하는 간격 (분). 외부 스케줄러가 매시 정각에 깨움
  pick_deadline: "18:00"    # 이때까지 안 고르면 pick.on_timeout 대로
  publish_at: "07:00"       # 게시 (후보 시각보다 이르면 다음 날. 승인 /ok 가 있으면)
  publish_retry_every: 60   # 게시가 실패하면 다시 해 보는 간격 (분)
  publish_retries: 1        # 다시 해 보는 횟수 (08:00)
  ok_check_every: 60        # 후보를 보낸 뒤~승인 마감 사이 /ok 확인 간격(분). /ok 를 기록하고 상품 링크를 보냄
  ok_deadline: "05:00"      # 승인 마감. 이 뒤에 온 /ok 는 게시에 쓰지 않음 (/fix 는 feedback.render_minutes 전까지)
  ok_remind_at: "22:00"     # 이때까지 /ok 가 없으면 승인 마감을 한 번 알림
  themes_at: "토 18:00"     # 다음 주(월~일 게시) 주제 7개. 월요일 게시 후보가 일요일 09:00 이라 토요일에
  collect_at: "월,목 04:00"  # 지그재그 새 상품 수집
  token_refresh_at: "일 19:00"  # 인스타 토큰 연장 (60일 만료 전에 매주)
  github_cron: backup       # 외부 스케줄러가 매시 깨우므로 GitHub 예약은 주요 칸만 (Actions 시간 절약)
  reels_at: null            # 릴스 (12단계)

# 코디 고르기 (9단계). 후보를 쇼핑몰 원본 사진으로 보내고, 고른 코디만 Photoroom 으로 만든다
pick:
  enabled: true      # false 면 고르지 않고 Claude 가 정한 한 벌을 바로 만든다
  count: 5           # 보내는 후보 수
  on_timeout: first  # 마감까지 안 고르면 first(1번으로 진행) 또는 skip(그날 건너뜀)
  max_again: 2       # "다시"로 새 후보를 받을 수 있는 횟수

# 미리보기 고칠 점 (15단계). 텔레그램 /fix 1 신발 더 크게 → 같은 코디로 고쳐 새 미리보기
feedback:
  enabled: true
  max_fixes: 2        # 하루에 다시 만드는 횟수
  check_every: 60     # 후보를 보낸 뒤~승인 마감 사이 /fix 확인 간격(분, 매시 정각). 바꾸면 tools.schedule sync
  render_minutes: 40  # 승인 마감(05:00)까지 이만큼 남아야 다시 만듦 (04:20 까지 받음)
  recent_days: 14     # 최근 피드백을 다음 기획·검수에 보여 줄 기간(일)

# 댓글 → DM 코디 링크 (10단계). 켜면 캡션의 "프로필 링크" 문구 대신 cta 가 들어간다.
# DM 은 mode 에 따라 external: ManyChat 이 댓글 즉시 보냄 (DM 에는 아래 link_page 주소)
#                     builtin: tools.comments 가 자동 실행 때 확인해 보냄 (30분~몇 시간 늦음, 토큰 권한 필요)
# builtin 으로 켜거나 check_at 을 바꾸면 `uv run python -m tools.schedule sync`
comments:
  enabled: true      # ManyChat 규칙이 켜져 있어야 함 (끄면 캡션이 예전 "프로필 링크" 문구로)
  mode: external
  cta: "코디 정보가 궁금하면 댓글을 남겨 주세요. DM으로 상품 링크를 보내 드려요 💌"
  keywords: []   # 비어 있으면 모든 댓글에 DM. 특정 말만 받으려면 [정보] 처럼 적고 cta 에 {keyword}, ManyChat 규칙도 같게
  # 아래는 mode: builtin 일 때만 씀
  check_at: ["08:17", "17:17", "23:17"]  # 댓글만 확인하러 따로 깨어나는 시각 (한 번에 Actions 약 1분)
  with_other_ticks: true   # 후보·고르기·게시 때도 같이 확인
  days: 7                  # 게시 후 며칠 동안 댓글을 볼지 (인스타 규칙상 최대 7)
  dm_intro: "댓글 남겨 주셔서 고마워요. '{title}' 코디 상품 정보예요"
  dm_item: "{index}. {category} · {shop} {name}\n{url}"
  dm_outro: "사이즈·재고는 링크에서 확인해 주세요"
  public_reply: ""         # 댓글에 공개 답글 (빈칸이면 안 함)
  link_mode: zigzag        # zigzag / share_reward(텔레그램으로 공유리워드 링크를 받아 씀, monetize: manual_link 필요)
  share_wait_hours: 6

# 최근 게시물 상품 링크 페이지 (10단계, tools.link_page). 게시할 때마다 새로 올린다.
# 주소: https://<GitHub 아이디>.github.io/<사진 저장소>/women/ (사진 저장소 GitHub Pages 를 켜야 함, README)
link_page:
  enabled: false           # 2026-09-30 끔: DM 링크는 직접 ManyChat 에서 설정. 올려 둔 페이지는 link-page 워크플로 remove 로 내림
  title: janggu.zip 코디 상품
  intro: 게시물에 나온 상품 링크예요. 최신 게시물이 맨 위에 있어요
  keep: 14                 # 보여 줄 최근 게시물 수
  item_line: "{category} · {shop}"
  share_days: 7            # monetize: manual_link 일 때 게시 알림 답장의 공유리워드 링크를 반영하는 기간 (일)
  send_links: true         # /ok 뒤 상품별 지그재그 링크를 텔레그램으로 (링크를 직접 만들 때 씀)

# none: 상품 링크만, 광고 표기 없음 / manual_link: 공유리워드 링크, 광고 표기 자동 적용
# (manual_link 면 게시 알림에 답장으로 붙인 공유리워드 링크가 상품 페이지에 들어감, tools.share)
monetize: none
# required: 텔레그램 /ok 승인 후 게시 / optional: /skip 이 없으면 자동 게시
approval: required

instagram:
  token_secret: IG_WOMEN_TOKEN      # GitHub Secret 이름 (값은 저장소에 두지 않음)
  user_id_secret: IG_WOMEN_USER_ID
