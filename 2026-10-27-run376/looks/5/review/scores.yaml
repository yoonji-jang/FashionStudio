    notes: >-
      기준 코디(worn_ref)에서는 퍼 자켓이 단추로 여며진 둥글고 짧은 오버핏이다. c1 은 자켓을 활짝 열고 몸에 떨어지는 네모진 박시 모양이라,
      여밈과 실루엣이 기준 사진과 다르다. 다만 상품 원본 사진도 열린 모양이고 상품에 단추가 없어 크게 깎지는 않았다.
      치마는 기준 사진보다 조금 길지만 미니 기장이라 괜찮다. 상품 6개 모두 보이고 개수도 맞다. 숫자·글자·없는 물건은 없다.
      얼굴은 작고 갸름하며 face 와 맞다.
    faults: []
slides: []
summary: c1 은 상품 색·소재·기장이 원본과 같고 결함이 없다. 얼굴은 face 특징과 맞는다. 자켓을 연 정도만 기준 코디와 달라 layout 1 이다.
