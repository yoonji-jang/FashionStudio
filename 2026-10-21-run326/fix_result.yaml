changes:
  - "전체: 코끝이 들리지 않고 오똑하게, 청순한 긴 웨이브 헤어·얼굴, 키·다리 길이를 모든 벌에 반영해 다시 그림 (1·7번 벌은 새로 그림, 2~6번 벌은 지난 그림을 고쳐 그림, 첨부 사진은 코 모양·헤어 참고로만 씀)"
  - "1장 표지(1번 벌): 신발을 앞코가 뾰족한 블랙 슬링백(zigzag:170477261 푸니앙 버클 스틸레토)으로 교체해 새로 그림 (검수 9/10). 먼저 본 뾰족코 구두 3종은 블랙 단독 사진이 없어 쓰지 않음"
  - "2장(2번 벌): 가디건 단추를 풀고 앞을 열어 레이스 나시가 보이게 고쳐 그림 (검수 7/10, 반지가 그려져 사람 확인 필요)"
  - "3장(3번 벌): 맨투맨을 참고 모델 핏처럼 단정하게, 벨트 제거(상품에서 뺌), 치마는 높은 허리에 올려 무릎 위 기장으로 고쳐 그림 (검수 9/10)"
  - "5장(5번 벌): 니트 기장을 허리선으로 줄이고 앞을 치마에 살짝 넣게, 새틴 치마는 무릎 위 기장으로 고쳐 그림 (검수 9/10, 니트 넣어 입기·치마 기장은 검수에서 '덜 반영'으로 나옴, 사람 확인 필요)"
  - "코디 후보 3번 추가: 후보 파일의 3번(참고 738) 벌을 7번 벌로 더함 (검수 8/10). 후보의 베이지 블루종(zigzag:139890460)은 사진이 3색 한 장뿐이라 베이지 스웨이드 블루종(zigzag:165360424)으로 바꿈. 실측(size-reader)은 하지 않아 기본값"
  - "4·6번 벌: 전체 요청(얼굴·키)만 반영, 옷·포즈는 그대로 (검수 9/10, 4번은 신발 V자·6번은 반지·부츠 방향·키 변화 미미로 사람 확인 필요)"
notes:
  - "3·5번 벌 '미디스커트를 무릎 위로': 상품 자체가 미디 길이라 짧게 줄일 수 없어 '허리를 높게 올려 입어 무릎 위로 오게'로 해석함. 5번은 그림에서 허벅지 중간까지 짧아졌다는 검수 의견이 있음"
  - "3·5번 '참고 코디컷 모델 핏': 벌 ref_photo(참고 코디 사진)를 핏 참고로 사용. 벨트는 3번 벌 참고 사진에 있으나 사용자 요청대로 뺌"
  - "검수 결과(최대 회차 2에서 통과 못 함, 사람 확인): 2번 벌 반지 clean 0 / 4번·5번·6번·7번 벌 신발·부츠 두 짝 방향 shoes_not_neat / 6번 벌 키·다리 변화 미미 / 7번 벌 비율·신발 모양"
  - "plan check 경고: 상의 '레이스' 가 4벌에 들어감 (후드 랩 티에 레이스 트리밍이 있어서, 7번 벌 추가로 생김)"
