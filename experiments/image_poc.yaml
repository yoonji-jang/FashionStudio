# 2단계 이미지 품질 실험 설정. python -m tools.poc 가 읽는다.
# 같은 코디를 방식(variant)마다 repeats 번씩 만들어 원본과 비교한다.
repeats: 5
image_size: 2K        # 코디컷 해상도 (1K, 2K, 4K)
extract_size: 1K      # 정리컷 해상도

variants:
  - id: A
    name: 정리컷 + 자유 배치
    model: default    # config/models.yaml 키
    inputs: extracted # extracted: 정리컷을 넣음 / raw: 원본 상품 사진을 그대로 넣음
    layout: false
  - id: B
    name: 정리컷 + 배치 지시
    model: default
    inputs: extracted
    layout: true
  - id: C
    name: 원본 사진 + 배치 지시 (정리컷 생략)
    model: default
    inputs: raw
    layout: true
  - id: D
    name: 정리컷 + 배치 지시, Pro 모델
    model: retry
    inputs: extracted
    layout: true
