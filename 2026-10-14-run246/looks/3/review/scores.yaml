    notes: 3번 신발 두 짝이 V자로 비스듬히 벌어졌고 앞코가 위를 향하지 않으며 높이도 엇갈려 가지런하지 않음. 1번 가디건은 몸판이 가슴 폭(약 350px)보다 짧게(약 310px) 눌렸고 밑단이 일자라 원본의 살짝 둥근 크롭 밑단과 다름. 단추는 4~5개쯤 보임. 깃에서 허리띠까지 ÷ 깃에서 바지 밑단까지가 약 0.29로, 와이드 바지가 가디건 대비 크게 그려져 허리가 올라간 비율임. 4번 가방이 가디건 소매 끝과 바지 허리 옆에 닿음. 2번 바지의 와이드 핏, 원턱, 기장은 원본과 같음. 5번 목걸이는 1개로 원본과 같음.
