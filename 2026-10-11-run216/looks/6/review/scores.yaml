    notes: 3번 바지가 원본의 길게 퍼지는 부츠컷보다 밑단이 덜 벌어진 슬림 일자에 가까움. 4번 신발 안쪽에 adidas 글자가 크게 보임(상품 자체 로고라 clean 1로 둠). 5번 가방이 1번 니트 소매 끝에 살짝 닿음. 2번 이너 밑단이 바지 허리 위를 살짝 덮지만 허리 디자인은 대부분 보임.
summary: c2 는 색과 상품 구성이 원본과 맞고, 이전 라운드(c1)에 있던 체크 칼라와 다른 가방 문제도 없어졌음. 다만 바지 밑단 퍼짐이 약하고 가방이 소매에 살짝 닿음.
