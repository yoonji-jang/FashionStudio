    notes: "4번 가방이 원본(두 손잡이의 부드러운 토트)과 다름. 얇은 끈의 각진 지퍼 숄더백으로 바뀜. 1번 코트 단추가 원본 3개인데 2개만 보임 (10-02 피드백 단추 개수 문제가 남아 있음). 2번 니트 목선 안쪽에 원본에 없는 작은 흰 라벨이 그려짐. 4번 가방이 코트 소매 위에 걸쳐 겹치고, 5번 신발이 실제 크기(35cm)에 비해 작게 보임. 피드백 확인: 3번 바지는 기장이 코트 밑단보다 길어졌고 핏도 얇고 곧게 정리되어 반영됨. 앞주름 없이 센터 크리즈만 있어 괜찮고, 와이드보다는 스트레이트에 가까움."
summary: "c2 는 바지 기장과 핏 피드백이 반영됐지만(합계 6점), 가방이 원본과 다른 제품으로 그려지고 코트 단추가 2개뿐이라 shape 0. 가방과 단추 개수를 고쳐서 다시 생성해야 함."
