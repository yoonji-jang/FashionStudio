    notes: 5번 신발은 밑창이 원본보다 덜 두껍고 슬립온 뮬처럼 보임. 6번 니삭스가 신발 안에 끼워진 모양이라 신발 위를 덮음. 4번 가방이 가디건 소매 쪽에 살짝 닿음. 3번 치마 밑단 왼쪽이 왼쪽 아래 제목 자리에 일부 걸침. 가방(위빙 가죽 버킷), 치마(새틴 광택, 발목 기장), 가디건 어깨 묶기와 단추, 티셔츠 배색은 원본과 같음.
summary: c2 는 가방을 원본의 위빙 가죽 버킷으로 정확히 그림. 신발 밑창이 얇아지고 겹침이 조금 있어 8점이며 0점 항목이 없음.
