summary: 색·개수(양말 2짝, 신발 2짝, 가방 1개)·V넥·홀터 나시 레이어드는 원본과 맞고 0점 항목 없음. 다만 맨투맨 기장이 짧아졌고 이름 자리에 양말과 반바지가 조금 걸침. 합계 8점으로 통과 기준 안.
