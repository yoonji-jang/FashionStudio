    note: 고른 색은 차콜인데 사진 속 바지가 검정·남색에 가까워 보이고 파란 셔츠도 크게 같이 나옴.
  - slide: 02_아우터.jpg
    kind: 사진
    note: 쇼핑몰 원본의 ADDMORE 글자가 사진 아래쪽에 크게 남아 있고 상품이 옆모습으로 일부 잘려 보임.
summary: c4 가 원본과 가장 가깝고(9점, 0점 항목 없음) 주얼리 등 없는 물건도 없어 통과 기준을 충족함. c5 는 8점으로 통과하지만 바지 밑단이 구겨져 c4 보다 낮음. c6 은 자켓이 단추 앞여밈으로 바뀌고 주얼리가 생겨 탈락. c1~c3 은 주얼리 때문에 clean 0 이라 탈락.
