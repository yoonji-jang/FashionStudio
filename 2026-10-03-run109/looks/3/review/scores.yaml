    notes: "2번 블라우스가 원본(V넥, 레이스 트림, 리본 끈, 퍼프 소매 새틴)과 다르게 하이넥 레이스 앞단추 블라우스로 바뀜. 3번 바지가 와이드가 아니라 폭이 좁은 곧은 핏으로 바뀌고 밑단이 발목 위로 짧아 보임, 허리가 벨트 달린 테일러드 바지로 바뀌고 두 다리가 뻣뻣하게 평행함. 1번 자켓은 원본의 크리스털 장식 여밈 4개와 패치 주머니 대신 둥근 검정 단추와 브레이드 트림이 생기고 색은 원본보다 밝은 네이비. 4번 가방은 원본의 밝은 라임 그린 직사각 지퍼 백인데 어두운 올리브 호보형 넓은 끈 가방으로 바뀜. 블라우스 목 안쪽에 작은 라벨 같은 글자 흔적이 보임. 바지 길이는 자켓의 약 1.3배라 빠듯하고 가방이 바지 옆에 닿을 듯 붙어 있음. 표지 제목 자리(왼쪽 아래)는 비어 있음."
summary: "c2 는 6개 상품이 모두 보이고 신발(2짝)·목걸이·제목 자리는 문제없지만, 블라우스 디자인과 바지 핏이 원본과 달라 shape 0 이라 통과 기준(0점 항목 없음)에 못 미침, 합계 5점"
