    notes: 4번 스카프가 이번에도 셔츠 칼라 위에 목에 두르듯 매듭으로 묶여 있음. 스카프는 목 높이 옆 빈자리에 따로 놓아야 해서 layout 0. 6번 가방이 1번 자켓 왼쪽 소매와 몸판을 많이 덮음. 2번 셔츠 자락이 3번 바지 허리를 덮어 허리 디자인이 안 보임. 5번 발레리나 플랫은 두 짝이 나란하지만 높이가 어긋나고 왼쪽 짝이 살짝 돌아가 있어 정돈이 덜 됨(애매하면 결함). 6번 가방 앞면에 원본에 없는 작은 각인 글자 같은 표식이 있음(text_drawn, 애매해서 결함으로 봄). 1번 자켓과 3번 카프리 팬츠의 핏, 소재, 레더 윤기는 원본과 대체로 같음.
