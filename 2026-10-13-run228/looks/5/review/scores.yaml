    notes: "3번 하의는 원본 모델컷보다 플레어 폭과 스커트 풍성함이 작다. 바지가 더 슬림하고 스커트 박스 플리츠도 폭이 좁다. 접힌 넓은 허리밴드와 미니 기장 스커트 위에 풀기장 부츠컷을 겹친 구성은 맞다. 5번 메리제인은 두 짝의 각도와 높이가 비슷하다. 다만 왼쪽 바지 밑단 바로 옆에 붙어 있다. 4번 호보백의 끈이 1번 가디건 소매 끝에 살짝 걸쳐 닿는다. 1번 가디건 기장이 50.5cm 치고 조금 짧아 보인다."
    feedback_ok: true
summary: "c1 은 색, 상품 구성, 개수가 모두 맞고 이상한 물체나 글자가 없다. 피드백 반영 여부는 다음과 같다. 허리: 베이지 니트가 스커트 허리밴드 안으로 매끈하게 들어가 주름 덩어리나 부풀림이 없다. 허리밴드 디자인도 가려지지 않았다. 바지: 테이퍼드로 좁아지지 않고 밑단이 퍼지는 부츠컷이며, 밑단이 그림 아래 끝 가까이 내려오는 풀 기장이다. 감점은 플레어 폭이 원본보다 좁은 점, 신발이 바지 밑단에 붙은 점, 가방이 소매에 닿은 점이다."
