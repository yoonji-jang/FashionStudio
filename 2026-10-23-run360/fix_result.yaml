changes:
  - "1~6장 코디컷: 못 고침. 이 환경에 텔레그램 토큰이 없어 참고 코디 사진을 받지 못했고, 도구가 참고 사진 없이는 그리지 않아 지난 코디컷을 그대로 둠 (이미지 AI 호출 없음, 새 검수 없음)"
  - "1장 표지(1벌): 요청(상세페이지대로 둥근 오버핏 후드 점퍼·밑단 스트링·지퍼 잠금, 더 짧은 치마, 양말 대신 시스루 검정 스타킹)을 plan 의 점퍼 desc·styling 에 적고 양말 상품을 뺌. 그림은 지난 것 그대로"
  - "2장(2벌): 둥근 오버핏 점퍼, 더 짧은 치마, 흰 티 살짝, 힙한 포즈를 styling·pose 에 적음. 그림은 지난 것 그대로"
  - "3장(3벌): 브라운 코트, 더 짧은 치마, 양말 대신 시스루 스타킹(양말 상품 뺌), 정면에 가까운 편한 포즈를 적음. 그림은 지난 것 그대로. 코트 상품 사진 하나가 404 로 받아지지 않음"
  - "4장(4벌): 치마 재질을 벨벳이 아닌 상품 사진대로(무광, 광택·벨벳 없음)로 고치고 이름을 '캉캉 미니'로 바꿈. 더 짧은 기장도 적음. 그림은 지난 것 그대로"
  - "5장(5벌): 치마를 더 짧게, 허리선을 높여 코트 밑으로 살짝만 보이게 styling 에 적음. 그림은 지난 것 그대로"
  - "6장(6벌): 숏팬츠를 상품처럼 더 짧게, 허리선 높이기를 styling·desc 에 적음. 그림은 지난 것 그대로"
  - "다음에 참고 사진을 받을 수 있는 환경(daily.yml 의 tools.plan refs 를 거친 mode=fix)에서 다시 돌리면 고친 plan 대로 새로 그림"
