    notes: >-
      1번 재킷 깃이 원본(목에 스냅이 달린 하이넥 스탠드 칼라)과 다르게 넓게 젖혀진 라펠 칼라로 그려졌고,
      원본에 있는 어깨 견장도 보이지 않음. 2번 헨리넥 티는 어두운 회보라 색은 맞지만 단추가 4개처럼 그려져
      있어 원본(3개 + 플래킷)과 조금 다름. 5번 그레이 스카프가 상의 목에 직접 묶여 옷 위에 얹혀 있음. 스카프는 목 높이
      옆 빈자리에 주얼리처럼 따로 놓아야 하므로 layout 0 (c1 에서 지적된 문제가 그대로 남음).
      4번 워커 부츠는 두 짝이 같은 방향으로 겹쳐 있지만 눕힌 옆모습이 아니라 세워 둔 듯 대각선으로 기울어 있고
      앞 짝 앞코가 아래 오른쪽을 향함. 6번 가방이 재킷 왼쪽 소매·밑단과 바지 허리 쪽에 걸쳐 닿음.
      3번 와이드 팬츠 핏과 발목 기장, 재킷 대비 길이는 맞고 넣어 입은 상의는 없음.
    faults: [shoes_not_neat]
summary: c2 는 색, 상품 구성, 바지 핏과 기장은 원본과 맞지만, 재킷 깃이 하이넥에서 라펠 칼라로 바뀌었다. 스카프는 여전히 옷 위에 묶여 있고, 부츠는 눕힌 옆모습이 아니라 세워 둔 모양이다. 합계 6점에 0점 항목과 결함이 있어 불합격이므로 다시 그려야 한다.
