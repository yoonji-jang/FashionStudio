styling: The shirt sleeves are not rolled or folded, they hang down at full length
  with the cuffs closed at the wrists. The shirt collar is soft and relaxed, slightly
  collapsed with natural creases, never crisp or stiff. The shirt hem shows 4 cm below
  the vest and the waistband stays visible. The black belt is threaded through the
  slacks' belt loops, not around the vest. The cap-sleeve mock-neck vest has short
  cap sleeves over the shoulder tips and a low funnel neck, with the shirt collar
  soft inside it. The wide-leg slacks are drawn at their full 104.5 cm length, about
  1.4 times as long as the shirt, widening from the hips to a wide hem that covers
  the ankle bones and reaches near the bottom of the frame, never cropped, not short
  and not a narrow straight tube.
