    notes: 2번 니트 목 안쪽에 원본에 없는 흰 라벨(글자처럼 보임)이 그려짐. 2번 니트는 원본이 라운드넥인데 V넥에 가깝게 그려졌고 가슴 장식은 빠짐. 4번 가방은 c1 보다 원본 슬라우치 토트에 가까워졌지만 손잡이가 원본보다 짧고 둥글게 보임. 가방이 코트 소매 끝에 살짝 겹침. 1번 코트(단추 3개, 노치드 라펠, 플랩 주머니, 소매 단추), 3번 와이드 플랫프론트 바지, 5번 페니로퍼 2짝은 원본과 같음. 신발은 오른쪽 아래라 제목 자리를 가리지 않음. 코트(110cm)와 바지(100cm) 기장 비율은 맞음.
slides: []
summary: c2 는 코트, 바지, 로퍼가 원본과 같고 가방도 c1 보다 낫다. 하지만 니트 목선에 글자처럼 보이는 라벨이 그려져 clean 0 이고 니트 목선이 원본과 달라 합계 6점이다. 통과 기준(합계 8점 이상, 0점 항목 없음)을 넘지 못한다. 니트를 라운드넥에 라벨 없이, 가방 손잡이를 원본처럼 길게 다시 생성해야 한다.
