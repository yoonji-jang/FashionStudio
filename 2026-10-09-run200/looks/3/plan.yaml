styling: The oversized V-neck sweatshirt is worn with its sleeves slightly pushed
  up, and the mini skirt-shorts are placed lower, clearly below the sweatshirt hem,
  so the whole waistband design of the skort stays visible and is never covered by
  the sweatshirt. The boots are placed below the skort, centered under it in the empty
  floor, not beside it. The necklace is drawn slightly larger so it is clearly visible.
  The thin white lace-trimmed camisole is layered underneath and shows only inside
  the V-neckline; its hem stays hidden under the sweatshirt. The inner camisole is
  a separate plain white piece with white lace at the neckline. The skort is placed
  even lower, with a clear gap between the sweatshirt hem and the skort waistband
  so the whole waist design of the skort is visible and the sweatshirt hem never covers
  it. The boots are moved lower too, one neat pair laid side by side, parallel, pointing
  the same direction and close together, centered under the skort near the bottom
  of the figure.
