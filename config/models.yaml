# 이미지 API 설정 (계정과 무관). 서비스나 모델이 바뀌면 여기만 고친다.
image:
  provider: photoroom
  endpoint: https://image-api.photoroom.com/v2/edit
  shadow_model_version: "2026-04-15"   # AI 그림자 모델 (pr-ai-shadows-model-version 헤더)
  flat_lay_size: PORTRAIT_HD_3_2       # 옷 정리컷 비율
  backdrop_size: PORTRAIT_4_3          # 배경 사진 생성 비율 (합성 때 4:5로 자름)

# 하루 코디컷 (tools.plan build --outfit photoroom). 2단계에서 고른 C 방식이 기본
outfit:
  finish: ai_shadow   # code(코드 그림자) | ai_shadow(AI 그림자) | ai_background | ai_scene
  clean: true         # 누끼를 AI로 다듬고 입은 듯이 합치기 (자켓 속 셔츠, 바지+벨트)

# 생성형 이미지 AI (11단계 비교 실험, tools.generate). 여러 상품 사진을 넣어 장면 한 장을 새로 그린다.
# OpenRouter 키 하나로 여러 회사 모델을 부른다. 키는 환경 변수 OPENROUTER_API_KEY (Secrets).
generate:
  endpoint: https://openrouter.ai/api/v1/chat/completions
  aspect_ratio: "4:5"
  image_size: 2K
  input_max_px: 1024      # 보낼 상품 사진 긴 변 (크면 느리고 비쌈)
  timeout_sec: 300
  models:
    nano_banana_pro:
      id: google/gemini-3-pro-image-preview
      name: Nano Banana Pro (Google)
      modalities: [image, text]
    gpt_image_2:
      id: openai/gpt-5.4-image-2
      name: GPT Image 2 (OpenAI)
      modalities: [image, text]
    seedream_5_pro:
      id: bytedance-seed/seedream-5-0-pro
      name: Seedream 5.0 Pro (ByteDance)
      modalities: [image]
