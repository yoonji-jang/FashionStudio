summary: c1 은 상품 색·기장·질감이 원본과 거의 같고 얼굴 특징도 맞으며 이상한 곳이 없다. 감점은 스웻팬츠 밑단이 상품 사진과 달리 오므려진 점(기준 코디 사진과는 같음) 하나뿐이다. 합계 9점이고 결함은 없다.
