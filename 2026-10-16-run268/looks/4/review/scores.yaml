    notes: 흰 셔츠 위에 차콜 V넥 조끼를 레이어드로 입은 모습이 분명히 보인다. 셔츠 깃이 조끼 목선 밖으로 나오고, 소매가 조끼 진동 밑에서 나오고, 셔츠 밑단이 조끼 아래로 나와 있다. 번호 3 트라우저는 허리선과 기장이 맞고 발등을 덮는다. 번호 4 메리제인은 두 짝이 나란하다. 번호 5 가방(둥근 로고, 손잡이 2개)과 번호 6 목걸이도 있다. 조끼 단추는 가방과 손에 가려 개수를 확인할 수 없다. clean 1은 장면 속 인물과 닮았기 때문이다. 올림머리, 가르마, 옆얼굴 인상이 비슷하다. 얼굴은 고개를 숙여 반쯤 가려져 있어 정면 얼굴 기준에는 걸리지 않는다. layout 1은 배경이 장면 사진과 같은 장소·같은 구도에 가깝기 때문이다. 포즈는 앉은 모습으로 달라서 복사 수준은 아니다. 배경의 물병 라벨은 읽을 수 없는 정도라 글자로 보지 않았다. 결함은 없다.
