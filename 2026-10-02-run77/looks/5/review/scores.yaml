    notes: "1번 코트가 원본(스탠드 칼라, 단추 가려진 오버사이즈 라글란, 벨트 없음, 연한 크림 베이지)과 달리 노치드 칼라 벨트 트렌치에 갈색 단추, 더 진한 베이지로 그려짐. 4번 가방이 원본(두 손잡이 나일론 숄더 토트, 금속 로고 메달)과 달리 가죽 느낌 호보백에 외줄 끈과 버클로 바뀜. 5번 신발이 원본(가죽 스퀘어토, 낮은 블록힐 앵클부츠)과 달리 니트 삭스 부츠에 뾰족한 앞코로 바뀜. 2번 니트는 줄무늬가 원본보다 굵고 선명하며 간격이 넓음(디테일 차이). 3번 부츠컷 청바지는 원본과 같음. 최근 피드백(고른 제품과 디자인이 다름)과 같은 문제가 반복됨. input.md 설명이 원본 사진과 달라 원본 사진을 기준으로 채점함."
summary: "c2 는 배치와 깨끗함은 좋지만 코트, 가방, 신발 3개 상품의 모양이 원본과 달라 shape 0. 이미 매긴 c1 이 5점이라 c2 도 통과 기준(0점 항목 없음)을 못 넘김. 코트, 가방, 신발을 원본 형태에 맞게 다시 생성하거나 설명을 원본에 맞게 고쳐야 함"
