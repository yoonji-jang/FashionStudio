# 코디컷 배치 기본값 (계정과 무관). 좌표는 캔버스 비율 0~1.
# 상품 크기는 실제 치수(cm)로 정해 사람 몸 비율을 맞춘다: 화면 크기 = cm × px_per_cm.
#   measure: height 는 세로 길이(옷 기장), long 은 긴 쪽 길이(가방·신발·소품)
#   center: 상품 중심, z: 클수록 위에 놓임, rotate: 도(시계 반대), max_width: 캔버스 대비 최대 폭
# 입은 듯한 코디: 자켓+셔츠, 바지+벨트처럼 합친 상품은 기준 상품(아우터, 하의) 자리에 놓는다.
# 아우터가 없으면 no_outer 값으로 덮어쓴다.
canvas: [1080, 1350]
px_per_cm: 8.0
slots:
  아우터: {cm: 68, measure: height, center: [0.50, 0.225], z: 3}
  상의:   {cm: 64, measure: height, center: [0.60, 0.215], z: 2}
  원피스: {cm: 105, measure: height, center: [0.50, 0.36], z: 2}
  하의:   {cm: 100, measure: height, center: [0.55, 0.645], z: 1}
  가방:   {cm: 42, measure: long, center: [0.20, 0.54], z: 5}
  신발:   {cm: 26, measure: long, center: [0.22, 0.87], z: 5}
  소품:   {cm: 22, measure: long, center: [0.87, 0.50], z: 5, rotate: -8}
no_outer:
  상의:   {cm: 64, measure: height, center: [0.50, 0.215], z: 2}
  하의:   {cm: 100, measure: height, center: [0.55, 0.625], z: 1}
shadow:  # 코드 그림자 (AI 그림자를 쓰지 않을 때)
  offset: [10, 16]
  blur: 18
  opacity: 0.32
