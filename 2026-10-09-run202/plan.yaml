    slim top is the outermost top, worn like on the model in a slim fit that hugs
    the body, a black long-sleeve ribbed top with a row of buttons down the front
    and the lower few buttons undone so the hem opens slightly, the inner tank layered
    under a square neckline with the halter strap hanging at the neck. The wide pants
    are placed a little lower so the top hem does not cover the pants waistband, and
    they are drawn much longer, full length from the waist to the floor, covering
    the ankle bones and breaking over the shoes in a few soft folds, wide and straight
    all the way down to the hem with a wide ankle opening, never short, cropped or
    tapered. The ankle boots are one neat pair side by side, parallel, pointing the
    same direction and close together. The wide pants are the washed black of the
    product photos, a dark charcoal-black, never a lighter grey, with the cargo flap
    pockets on the sides drawn as on the product, and the wide leg does not narrow
    toward the ankle. The halter slim top and the ankle boots stay as they are. The
    product designs are kept unchanged.
