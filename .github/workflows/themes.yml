name: themes

# 9단계 주간 주제. Claude(plan-themes 스킬)가 date 부터 profile themes.per_week 일치 주제를 정해
# data/<계정>/themes.json 에 저장·커밋하고 텔레그램으로 보낸다.
# profile themes.review_before_use 면 "/themes again" 버튼이 붙고, 누르면 schedule 이 이 워크플로를 다시 부른다.
# schedule 워크플로가 profile schedule.themes_at 에 부른다. Actions 탭에서 직접 돌려도 된다.
on:
  workflow_dispatch:
    inputs:
      account:
        description: 계정
        default: women
      date:
        description: 첫 주제 날짜 YYYY-MM-DD (빈칸이면 내일)
        default: ""
      then_candidates:
        description: 주제를 정한 뒤 이 게시 날짜의 코디 후보를 보냄 (schedule 이 씀)
        default: ""
      refs_only:
        description: 주제는 그대로 두고 참고 코디(ref_looks.md)만 더함 (웹 검색, 29CM 사진)
        type: boolean
        default: false
      ref_test:
        description: refs_only 때 접속 시험할 쇼핑몰 주소·이름 (빈칸이면 평소대로)
        default: ""

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  themes:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: themes-${{ inputs.account }}
      cancel-in-progress: false
    env:
      ACCOUNT: ${{ inputs.account }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # 참고 코디: 사진만 있는 쇼핑몰 코디 페이지를 tools.scout refs 로 본다 (profile ref_search.scout_sites)
      - run: uv sync --group scout
      - run: uv run playwright install --with-deps chromium

      - name: 준비 (날짜, 다시 정하는 주제)
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          FIRST="$INPUT_DATE"
          [ -n "$FIRST" ] || FIRST=$(uv run python -c "from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; from core.profile import load_profile; p = load_profile('$ACCOUNT'); print((datetime.now(ZoneInfo(p.schedule.timezone)) + timedelta(days=1)).date())")
          mkdir -p out
          # 이미 정한 같은 주 주제가 있으면 "다시" 요청이다: Claude 가 겹치지 않게 참고한다
          uv run python - "$FIRST" <<'PY'
          import os, sys, yaml
          from datetime import date, timedelta
          from core.profile import load_profile
          from core.store import Store
          acc = os.environ["ACCOUNT"]
          first = date.fromisoformat(sys.argv[1])
          last = first + timedelta(days=load_profile(acc).themes.per_week - 1)
          old = [t.model_dump(mode="json") for t in Store(acc).themes() if first <= t.date <= last]
          if old:
              with open("out/themes_previous.yaml", "w", encoding="utf-8") as f:
                  yaml.safe_dump(old, f, allow_unicode=True)
          PY
          echo "FIRST=$FIRST" >> "$GITHUB_ENV"

      - name: Claude 주간 주제 (plan-themes 스킬)
        if: ${{ !inputs.refs_only }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # schedule 이 GITHUB_TOKEN 으로 실행을 요청하면 실행자가 github-actions 봇이 된다
          allowed_bots: "github-actions"
          prompt: |
            .claude/skills/plan-themes/SKILL.md 의 "주간" 방법으로 ${{ env.FIRST }} 부터 주제를 정해 저장해.
            ACCOUNT=${{ env.ACCOUNT }}
            python 은 이미 가상환경이 잡혀 있으니 `python -m tools.plan ...` 처럼 부르면 돼.
            git 커밋·푸시, 게시, 외부 전송은 하지 마.
          claude_args: >-
            --max-turns 90
            --allowedTools "Bash(python -m tools.plan context:*),Bash(python -m tools.plan candidates:*),Bash(python -m tools.plan themes:*),Bash(python -m tools.scout refs:*),Bash(uv run python -m tools.scout refs:*),Bash(python -m tools.scout links:*),Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      # 쇼핑몰마다 메뉴 → 상품 페이지를 코드가 돌며 확인표를 만든다 (Claude 는 확인표만 본다, 2026-10-13)
      - name: 쇼핑몰 착용컷 확인표 만들기 (tools.scout crawl)
        run: |
          sites=$(uv run python -c "from core.profile import load_profile; rs = load_profile('$ACCOUNT').themes.ref_search; print(' '.join(rs.scout_sites if rs else []))")
          for site in $sites; do
            timeout 20m uv run python -m tools.scout crawl --account "$ACCOUNT" --site "$site" \
              --out "out/refs/${site%%.*}" --menus 5 --products 15 || echo "$site 실패"
          done

      # 참고 코디 100벌쯤을 칸별로 data/<계정>/refs.json 에 모은다 (2026-10-13 사용자). 주간 주제 다음에도 돈다
      - name: Claude 참고 코디 모으기 (plan-themes "참고 코디 모으기")
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions"
          prompt: |
            .claude/skills/plan-themes/SKILL.md 의 "참고 코디 모으기"만 해. 주제는 정하지도 저장하지도 마.
            ${{ env.FIRST }} 부터 한 주 주제는 data/${{ env.ACCOUNT }}/themes.json 에 있으니 참고만 해.
            참고 코디는 data/${{ env.ACCOUNT }}/refs.json 에 쓰고 `python -m tools.refs check --account ${{ env.ACCOUNT }}` 로 검사해.
            쇼핑몰마다 상품 페이지 확인표가 이미 out/refs/<쇼핑몰>/sheet_N.jpg 에 있어 (같은 폴더 refs.json 에 칸 번호 순 사진 주소 images 와 상품 페이지 url).
            먼저 이 확인표를 하나도 빼지 말고 모두 Read 로 보고 전신 코디를 옮겨 (겹쳐 보일 것 같아도 열어 봐). 모자라면 그때 links/refs 로 더 찾아.
            ACCOUNT=${{ env.ACCOUNT }}. 더한 참고 코디 수는 out/refs_report.md 에 한 줄로 적어.
            python 은 이미 가상환경이 잡혀 있으니 `python -m tools.scout refs --account ${{ env.ACCOUNT }} --url … --out out/refs` 처럼
            그대로 불러 (uv run, cd, 변수, 파이프 없이). profile scout_sites 의 쇼핑몰마다 코디·룩북 페이지를 찾아 확인표를 꼭 만들어 보고, 쇼핑몰별로 열렸는지·막혔는지(이유)를 out/refs_report.md 에 적어.
            ${{ inputs.ref_test && format('이번엔 쇼핑몰 접속 시험도 해: {0}. 쇼핑몰마다 공식 주소를 찾고(WebSearch), 룩북·코디·베스트 페이지로 확인표를 만들어 봐. out/refs_report.md 에 쇼핑몰 | 시험한 주소 | 결과(열림/막힘/사진 없음/주소 못 찾음) | 사진 수 | 이유 표를 써. 막힌 곳은 우회하지 마.', inputs.ref_test) || '' }}
            git 커밋·푸시, 게시, 외부 전송은 하지 마.
          claude_args: >-
            --max-turns 400
            --allowedTools "Bash(python -m tools.scout refs:*),Bash(uv run python -m tools.scout refs:*),Bash(python -m tools.scout links:*),Bash(python -m tools.refs check:*),Bash(python -m tools.refs list:*),Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: 참고 코디 사진 확인 결과 (scout_sites 쇼핑몰)
        if: always()
        run: |
          cat out/refs/refs.json 2>/dev/null || echo "확인표를 만들지 않음"
          cat out/refs_report.md 2>/dev/null || true

      # 참고 코디 확인표(사진 묶음)와 보고만 3일 동안 남긴다. 페이지·사진 원본은 저장하지 않는다
      - name: 참고 코디 확인표 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refs-${{ inputs.account }}
          path: |
            out/refs/**/*.jpg
            out/refs/refs.json
            out/refs_report.md
          retention-days: 3
          if-no-files-found: ignore

      - name: 텔레그램으로 보내기
        if: ${{ !inputs.refs_only }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "텔레그램 설정 없음"; exit 0; }
          python -m tools.pick themes --account "$ACCOUNT" --first "$FIRST"

      # 수집(collect)이 같은 브랜치의 refs.json 을 동시에 고칠 수 있어, 원격 최신본 위에 다시 얹어 커밋한다
      # (2026-10-13: rebase 충돌로 참고 코디 한 번을 잃음). refs.json 은 번호로 합친다
      - name: 주제 커밋
        run: |
          files=("data/$ACCOUNT/themes.json" "data/$ACCOUNT/themes_review.json" "accounts/$ACCOUNT/ref_looks.md")
          mkdir -p /tmp/keep
          for f in "${files[@]}"; do [ -f "$f" ] && mkdir -p "/tmp/keep/$(dirname "$f")" && cp "$f" "/tmp/keep/$f"; done
          [ -f "data/$ACCOUNT/refs.json" ] && cp "data/$ACCOUNT/refs.json" /tmp/refs_new.json
          for i in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"
            git reset -q --hard "origin/${{ github.ref_name }}"
            for f in "${files[@]}"; do [ -f "/tmp/keep/$f" ] && cp "/tmp/keep/$f" "$f"; done
            if [ -f /tmp/refs_new.json ]; then
              if [ -f "data/$ACCOUNT/refs.json" ]; then
                python -m tools.refs merge --account "$ACCOUNT" --new /tmp/refs_new.json
              else
                cp /tmp/refs_new.json "data/$ACCOUNT/refs.json"
              fi
            fi
            git add "${files[@]}" "data/$ACCOUNT/refs.json" 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git -c user.name="github-actions[bot]" \
              -c user.email="41898279+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "${{ inputs.refs_only && '참고 코디' || '주간 주제' }} $ACCOUNT $FIRST"
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      # 참고 코디의 옷을 창고에 한꺼번에 모으고(collect.yml from_refs) 참고 사진 묶음을 텔레그램으로 보낸다.
      # 코디 후보는 수집이 끝난 뒤 collect.yml 이 요청한다
      - name: 참고 코디 옷 수집 요청
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s "data/$ACCOUNT/refs.json" ] || exit 0
          gh workflow run collect.yml --ref "${{ github.ref_name }}" -f account="$ACCOUNT" \
            -f from_refs=true -f commit=true -f since="$(date -u -d '-1 day' +%F)" \
            -f then_candidates="${{ !inputs.refs_only && inputs.then_candidates || '' }}"

      - name: 코디 후보 보내기 요청 (참고 코디가 없을 때)
        if: inputs.then_candidates != '' && !inputs.refs_only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s "data/$ACCOUNT/refs.json" ] && exit 0
          gh workflow run daily.yml --ref "${{ github.ref_name }}" -f account="$ACCOUNT" \
            -f date="${{ inputs.then_candidates }}" -f mode=candidates -f sandbox=false

      - name: 사용량 한도 기록 (한도가 풀리면 schedule 이 같은 입력으로 다시 돌림)
        if: failure()
        env:
          WORKFLOW: themes.yml
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          INPUTS=$(jq -c --arg date "$FIRST" '. + {date: $date}' <<< "$INPUTS") \
            KEY="themes:$ACCOUNT" .github/scripts/limit.sh

      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: "[${{ inputs.account }}] 주간 주제 실패: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          [ -n "$LIMITED" ] && TEXT="$TEXT
          Claude 사용량 한도로 멈췄어요. 한도가 풀리면 자동으로 다시 시작해요"
          .github/scripts/alert.sh
