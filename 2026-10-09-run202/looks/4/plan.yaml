reason: 블랙 크롭 레더자켓이 주인공, 블랙 새틴 미디 스커트에 버건디 백으로 퇴근 후 저녁 분위기. 블랙에 버건디 한 방울을 더한 단정한 분위기
shot: flatlay
styling: The jacket is a true cropped jacket that ends at the waist, clearly short
  and boxy, its hem sitting well above the skirt waistband and never lengthened. It
  is worn open at the front with the zip pulled down so the black henley knit shows.
  The henley placket is not fully buttoned, the top buttons are left undone. The knit
  is only lightly tucked into the skirt, and its hem never covers the skirt waistband,
  so the whole waistband design of the skirt stays visible. The skirt is placed a
  little lower than before. The satin skirt is a straight narrow H-line column that
  ends at the knee, never mid-calf and never A-line or fanned out; only the very hem
  loosens slightly. It has real volume like a skirt just taken off a body, with soft
  rounded folds and air inside, never flat or stuck to the floor, exactly as the model
  wears it. The short skirt leaves floor space under it, so the slingback shoes are
  placed as a pair below the skirt hem, centered under the skirt, not beside it. The
  slingbacks are one neat pair side by side, parallel, pointing the same direction
  and close together, never splayed in a V. The skirt looks as if worn on a body and
  just set down, a slim bias-cut satin knee-length H-line with round volume and air
  at the hips and thighs, soft vertical folds, bright satin highlights along the folds,
  and only the hem loosening slightly, never flat, pressed or paper-like. The skirt
  is only 48 cm long, ending at the knee at almost the same length as the 50 cm jacket,
  never drawn longer, never to the calf, and never an A-line; it keeps its satin sheen,
  hip volume and the neat parallel slingbacks. The henley has exactly three buttons.
  The product designs are kept unchanged.
