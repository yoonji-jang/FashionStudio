summary: "c1 은 상품과 배경이 잘 맞고 결함은 없음. 타이를 사진처럼 길게 늘어뜨리지 않고 리본으로 묶었고, 전신이 지시한 크기(75%)보다 작아 감점함 (합계 8점)."
