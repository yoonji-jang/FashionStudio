    notes: "3번 네이비 슬랙스는 허리 쪽이 좁고 밑단이 넓어져 살짝 부츠컷처럼 보임. 원본은 일자로 떨어지는 와이드 핏이라 핏 피드백이 완전히 고쳐지지는 않음. 센터 주름은 잘 나옴. 1번 코트 단추는 원본 5개인데 보이는 건 4개 안팎이라 확인이 어려움. 신발(5번) 왼쪽 위가 바지 오른쪽 밑단에 닿음."
summary: "c1 은 색, 상품 구성, 신발·가방 형태가 원본과 같고 글자나 없는 물건이 없음. 바지 핏은 이전보다 나아졌으나 밑단이 조금 퍼지고 신발이 바지에 닿아서 8점으로 통과 기준은 넘김."
