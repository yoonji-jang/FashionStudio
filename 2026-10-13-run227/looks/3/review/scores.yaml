    notes: 1번 맨투맨은 기장 66cm 힙 길이에 아주 넓고 볼륨 있는 소매인데, 그림에서는 허리 위로 올라오는 크롭 기장이고 소매 볼륨도 줄었음. 2번 스커트는 원본의 앞 패치 포켓 2개가 슬릿형 주머니로 바뀌었고, 표면이 매끈하고 납작한 편이라 부피감이 약함. 3번 가방이 맨투맨 소매 끝과 스커트 왼쪽 가장자리에 닿거나 살짝 겹침. 맨투맨 밑단이 스커트 허리 윗부분을 조금 덮음. 4번 부츠 두 짝은 높이가 조금 어긋남. 부츠 종류, 개수, 색은 원본과 맞고 폴딩 디자인도 유지됨. 5번 목걸이는 맨투맨 위에 올려져 있어 보이긴 하지만 원본의 두 줄 체인과 토글 대신 하트 펜던트로 보이는 부분이 있음.
summary: c2 는 색, 상품 구성, 신발 종류는 맞다. 다만 맨투맨이 원본보다 짧고, 스커트 주머니 모양이 다르며, 가방이 다른 옷에 닿았다. 합계는 7점으로 통과 기준(8점)에 못 미치고, 0점 항목은 없다.
