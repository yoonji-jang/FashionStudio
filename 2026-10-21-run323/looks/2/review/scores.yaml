    notes: 왼손 손가락에 은색 반지가 그려져 있다. 반지는 상품 목록에 없는 물건이라 clean 0. 나머지는 원본과 같다. 1번 그레이 하이넥 가디건은 단추 앞여밈에 골지 밑단, 슬림한 허리 기장이고, 밑단 아래로 2번 레이스 나시 자락이 살짝만 보인다. 3번 버건디 코듀로이 미니스커트는 살짝 A라인이고 허리 윗부분이 가려지지 않았다. 4번 블랙 숄더백은 왼쪽 어깨에 멨고, 5번 카멜 스웨이드 롱부츠는 두 짝이 가지런하며 전신이 보인다. 얼굴은 사용자 요청(src/scene.txt)으로 보이게 그리는 게시물이라 감점하지 않았다. 고개를 옆으로 돌린 포즈이고, 장면 사진 속 사람의 슬릭번과 달리 참고 사진(scene_2.jpg, scene_3.jpg)대로 긴 웨이브 헤어라 장면 속 사람을 베낀 것은 아니다. 배경, 빛, 색감은 장면의 스튜디오 무드와 같고 테두리는 없다. 다리 비율도 자연스럽다.
