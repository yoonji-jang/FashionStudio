# 코디컷 배치 기본값 (계정과 무관). 좌표는 캔버스 비율 0~1.
# 상품 크기는 실제 치수(cm)로 정해 사람 몸 비율을 맞춘다: 화면 크기 = cm × px_per_cm.
#   measure: height 는 세로 길이(옷 기장), long 은 긴 쪽 길이(가방·신발·소품)
#   center: 상품 중심, z: 클수록 위에 놓임, avoid_overlap: 옷과 겹치면 바깥으로 밀거나 줄임, rotate: 도(시계 반대), max_width: 캔버스 대비 최대 폭
# 입은 듯한 코디: 자켓+셔츠, 바지+벨트처럼 합친 상품은 기준 상품(아우터, 하의) 자리에 놓는다.
# 아우터가 없으면 no_outer 값으로 덮어쓴다.
canvas: [1080, 1350]
px_per_cm: 7.0
margin: 0.02  # 상품이 캔버스 가장자리에서 떨어질 최소 여백 (캔버스 폭 비율)
slots:
  # 상의와 하의는 가운데(x)를 맞춰 세로로 정렬한다
  아우터: {cm: 68, measure: height, center: [0.47, 0.205], z: 3}
  상의:   {cm: 64, measure: height, center: [0.55, 0.195], z: 2}
  원피스: {cm: 105, measure: height, center: [0.47, 0.36], z: 2}
  하의:   {cm: 100, measure: height, center: [0.47, 0.655], z: 1}  # 상의 밑단과 살짝 띄움
  가방:   {cm: 52, measure: long, center: [0.16, 0.57], z: 5, avoid_overlap: true}
  신발:   {cm: 35, measure: long, center: [0.82, 0.84], z: 5, avoid_overlap: true}  # 바지와 겹치지 않게 밑단 오른쪽
  소품:   {cm: 22, measure: long, center: [0.86, 0.60], z: 5, avoid_overlap: true, rotate: -8}
  # 주얼리는 옷 위에 올리지 않고 상의 오른쪽 빈 공간에 세로로 놓는다 (샘플의 slot 으로 지정)
  목걸이: {cm: 34, measure: long, center: [0.89, 0.21], z: 5, avoid_overlap: true}  # 가는 줄도 보이게 조금 크게
  귀걸이: {cm: 9, measure: long, center: [0.89, 0.40], z: 5, avoid_overlap: true}
  팔찌:   {cm: 12, measure: long, center: [0.88, 0.50], z: 5, avoid_overlap: true}
no_outer:
  상의:   {cm: 64, measure: height, center: [0.47, 0.195], z: 2}
  하의:   {cm: 100, measure: height, center: [0.47, 0.64], z: 1}
# 아우터와 상의를 따로 놓을 때 (상의를 아우터에 입히지 못했을 때). 겹치지 않게 나란히 둔다
outer_and_top:  # 아우터는 왼쪽, 상의·하의는 오른쪽에 입은 순서로, 가방·신발은 아우터 아래
  아우터: {cm: 68, measure: height, center: [0.29, 0.205], z: 3}
  상의:   {cm: 64, measure: height, center: [0.72, 0.195], z: 2}
  하의:   {cm: 100, measure: height, center: [0.72, 0.655], z: 1}
  가방:   {cm: 52, measure: long, center: [0.36, 0.80], z: 5, avoid_overlap: true}
  신발:   {cm: 35, measure: long, center: [0.12, 0.89], z: 5, avoid_overlap: true}
  귀걸이: {cm: 9, measure: long, center: [0.52, 0.10], z: 5, avoid_overlap: true}
  목걸이: {cm: 34, measure: long, center: [0.52, 0.12], z: 5, avoid_overlap: true}
  팔찌:   {cm: 12, measure: long, center: [0.52, 0.20], z: 5, avoid_overlap: true}
# 기획에 cm 가 없을 때 상품 이름·설명에 든 말로 정하는 실제 기장 (세로 기준 자리만, 위에서부터 먼저 맞는 것).
# 없으면 slots 의 기본값. 쇼핑몰 실측과 다르면 기획에서 cm 로 직접 적는다.
lengths:
  아우터:
    하프: 88
    미디: 95
    맥시: 120
    롱: 110
    long: 110
    크롭: 48
    숏: 55
  상의:
    크롭: 45
  하의:
    롱스커트: 85
    미디스커트: 75
    미니스커트: 42
    스커트: 65
    반바지: 38
    쇼츠: 38
    버뮤다: 55
shadow:  # 코드 그림자 (AI 그림자를 쓰지 않을 때)
  offset: [10, 16]
  blur: 18
  opacity: 0.32
# 캐러셀 상품 장 (tools.feed): 누끼가 사진 자리를 채우는 최대 비율. 작은 상품이 옷만큼 커 보이지 않게
feed_fill:
  아우터: 1.0
  상의: 1.0
  하의: 1.0
  원피스: 1.0
  가방: 0.8
  신발: 0.74
  소품: 0.56
