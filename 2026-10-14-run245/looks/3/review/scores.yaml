covers:
  - id: c2
    color: 2
    shape: 1
    complete: 2
    clean: 2
    layout: 1
    notes: 셔츠 몸판이 폭에 비해 짧게 눌려 허리 위가 뭉툭하고, 깃에서 허리띠까지 비율이 약 0.29로 착용컷보다 작음(waist_off). 신발 두 짝이 대각선으로 기울고 앞코 높이가 어긋나 가지런하지 않음(shoes_not_neat). 5번 목걸이 펜던트가 원본의 고리형 구슬이 아니라 둥근 진주 한 알처럼 그려짐. 가방 끈과 셔츠 소매·바지가 살짝 겹쳐 닿음. 신발 안창에 작은 글자 자국이 있는 듯하지만 흐려서 결함으로 적지 않음. 색, 소재(셔츠 포플린, 슬랙스 울, 위빙 가죽 광택)와 와이드 핏, 밑단 길이는 원본과 같음.
    faults: [waist_off, shoes_not_neat]
summary: c2 는 색과 소재는 원본과 같지만 셔츠가 짧게 눌린 허리 비율과 비스듬한 신발 때문에 불합격이라 다시 그려야 함. 점수는 8점이어도 결함이 있어 통과하지 못함.
