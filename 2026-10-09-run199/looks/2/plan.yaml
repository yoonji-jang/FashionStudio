reason: 버건디 홀터 슬림 니트가 주인공, 블랙 새틴 맥시 스커트와 메리제인으로 어깨를 드러낸 저녁 약속. 버건디·블랙 톤의 단정한 분위기
shot: flatlay
styling: The slim knit is worn off the shoulder with its thin halter straps and tie
  neckline exactly like the product photos and the model, shoulders bare, no outer.
  It is only lightly tucked into the satin skirt, and its hem never covers the skirt
  waistband, so the waistband stays visible. The skirt is placed a little lower than
  before. The satin skirt falls straight down in a 1-line column, the hem only a hand
  wider than the hips and never flared, fanned or A-line, exactly as the model wears
  it. The knit has a front halter tie at the neck as well as the thin straps. The
  shoes sit below the skirt hem without touching it, the bag does not overlap the
  sleeve. The skirt has real volume, with soft deep rounded folds and air inside the
  fabric, never flat or stuck to the floor. The knit keeps the exact deep wine-burgundy
  of the product page.
