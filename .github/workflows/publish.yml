name: publish

# 8단계 인스타 게시. Claude 없이 코드만 돈다 (tools.publish).
# daily 가 만든 결과(daily-results 브랜치)를 골라 게시 전 검사 → 텔레그램 승인(/ok, /skip) 확인 →
# 사진을 공개 사진 저장소에 잠시 올리고 인스타 캐러셀 게시 → 게시 기록(data/<계정>/posts.json) 커밋 → 텔레그램 알림.
# 9단계: schedule 워크플로가 profile schedule.publish_at 에 부른다 (scheduled). 승인이 늦으면
# publish_retry_every 마다 다시 불리고, 대기 알림은 처음과 마지막에만 보낸다. Actions 탭에서 직접 돌려도 된다.
# 19단계: reels 를 켜면 그날 캐러셀을 게시한 결과의 릴스 영상만 올리거나(reels.delivery instagram)
# 텔레그램으로 보낸다(telegram, 사람이 앱에서 음악을 붙여 올림). schedule 이 schedule.reels_at 에 부름.
# 필요한 Secrets: 프로필 instagram 의 두 이름(예: IG_WOMEN_TOKEN, IG_WOMEN_USER_ID), MEDIA_REPO_TOKEN,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
on:
  workflow_dispatch:
    inputs:
      account:
        description: 계정
        default: women
      date:
        description: 게시 날짜 YYYY-MM-DD (빈칸이면 오늘)
        default: ""
      run:
        description: 게시할 결과 폴더 (빈칸이면 미리보기를 보낸 가장 최근 것, 예 2026-09-27-run12)
        default: ""
      dry_run:
        description: 시험 (검사와 승인 확인까지만, 게시하지 않음)
        type: boolean
        default: true
      force:
        description: 텔레그램 승인 없이 바로 게시
        type: boolean
        default: false
      scheduled:
        description: 자동 실행 (게시할 결과가 없으면 조용히 끝냄)
        type: boolean
        default: false
      notify_wait:
        description: 승인이 없을 때 텔레그램으로 알림
        type: boolean
        default: true
      again:
        description: 다시 올리기 (그날 게시 기록이 있어도 이 결과로 올리고 기록을 바꿈, 릴스는 안 올림, 앞 게시물은 앱에서 지우기)
        type: boolean
        default: false
      reels:
        description: 릴스만 올리기 (그날 캐러셀을 게시한 결과의 영상, 19단계)
        type: boolean
        default: false
      reel_again:
        description: reels 와 같이 켜면 지금 설정(음악 등)으로 영상을 다시 만들어 이미 올린 날도 다시 올림 (앞 릴스는 앱에서 지우기)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-${{ inputs.account || 'women' }}
      cancel-in-progress: false
    env:
      ACCOUNT: ${{ inputs.account || 'women' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync

      - name: 계정 설정 읽기
        id: cfg
        run: |
          uv run python - >> "$GITHUB_OUTPUT" <<'EOF'
          import os
          from core.profile import load_profile
          ig = load_profile(os.environ["ACCOUNT"]).instagram
          print(f"token={ig.token_secret}")
          print(f"user_id={ig.user_id_secret}")
          EOF

      - name: 결과 가져오기 (daily-results 브랜치)
        run: |
          git fetch origin daily-results
          git worktree add /tmp/results origin/daily-results
          git -C /tmp/results checkout -B daily-results

      - name: ffmpeg 준비 (릴스 다시 만들기, 표지 벌을 바꾼 날 포함)
        if: ${{ inputs.reels }}
        run: command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }

      - name: 게시
        env:
          IG_TOKEN: ${{ secrets[steps.cfg.outputs.token] }}
          IG_USER_ID: ${{ secrets[steps.cfg.outputs.user_id] }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # schedule 이 남긴 받은 글 기록도 읽는다 (여기서는 기록하지 않음)
          TELEGRAM_UPDATES_LOG: /tmp/results/telegram_updates.json
          DATE: ${{ inputs.date }}
          RUN_DIR: ${{ inputs.run }}
        run: |
          args=(--account "$ACCOUNT" --results /tmp/results)
          [ -n "$DATE" ] && args+=(--date "$DATE")
          [ -n "$RUN_DIR" ] && args+=(--run "$RUN_DIR")
          ${{ inputs.dry_run && 'args+=(--dry-run)' || '' }}
          ${{ inputs.force && 'args+=(--force)' || '' }}
          ${{ inputs.scheduled && 'args+=(--scheduled)' || '' }}
          ${{ !inputs.notify_wait && 'args+=(--quiet-wait)' || '' }}
          ${{ inputs.again && 'args+=(--again)' || '' }}
          ${{ inputs.reels && 'args+=(--reels)' || '' }}
          ${{ inputs.reel_again && 'args+=(--reel-again)' || '' }}
          set +e
          uv run python -m tools.publish "${args[@]}"
          code=$?
          # 3 = 아직 승인 없음 (실패가 아님)
          [ $code -eq 3 ] && { echo "::notice::승인(/ok)이 없어 게시하지 않았습니다"; exit 0; }
          exit $code

      - name: 게시 기록 커밋
        if: ${{ !inputs.dry_run }}
        run: |
          # pull --rebase 가 커밋을 다시 쓸 때도 이름이 있어야 한다 (게시 두 개가 겹치면 실패했음, 2026-10-15)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898279+github-actions[bot]@users.noreply.github.com"
          commit() {  # 폴더, 브랜치, 파일(pathspec …)
            git -C "$1" add -- "${@:3}" 2>/dev/null || return 0  # 새 기록 없음
            git -C "$1" diff --cached --quiet && return 0
            git -C "$1" -c user.name="github-actions[bot]" \
              -c user.email="41898279+github-actions[bot]@users.noreply.github.com" \
              commit -m "게시 기록 $ACCOUNT"
            for i in 1 2 3; do
              git -C "$1" pull --rebase --autostash origin "$2" && git -C "$1" push origin "HEAD:$2" && return 0
              sleep $((i * 5))
            done
            return 1
          }
          commit . "${{ github.ref_name }}" "data/$ACCOUNT/posts.json"
          commit /tmp/results daily-results ':(glob)*/published.json'
          # 게시 직전에 반영한 표지 벌·벌 순서 바꾸기 (tools.cover_look). 릴스 게시가 같은 표지로 다시 만든다
          commit /tmp/results daily-results ':(glob)*/cover.json' ':(glob)*/order.json' ':(glob)*/title.json' ':(glob)*/plan.yaml' \
            ':(glob)*/feed.yaml' ':(glob)*/preview.jpg' ':(glob)*/slides/**' ':(glob)*/looks/**' \
            ':(glob)*/manifest.json' ':(glob)*/caption.txt' ':(glob)*/report.md'
