changes:
  - "2장 1번 벌: 자켓을 엉덩이 덮는 오버핏(75cm)으로, 스카프는 옷 위가 아니라 목 높이 옆 빈자리에 따로 놓게 다시 그림 (검수 8/10 통과)"
  - "6장 5번 벌: 치마를 종아리 중간 미디 기장(75cm)으로, 스카프는 목 높이 옆에 따로 놓게 다시 그림. 치마 이름도 '새틴 미디 스커트'로 고침"
  - "6장 5번 벌: 다시 그린 그림에서 가디건·가방이 원본과 달라져 검수 5/10 (사람 확인 필요). 원본과 같은 후보는 치마가 아직 길어 요청이 안 보임"
  - "나머지 벌·표지·캡션·댓글 안내 장: 말하지 않아 그대로 둠 (2번 벌은 지난 검수 6/10 그대로 사람 확인)"
