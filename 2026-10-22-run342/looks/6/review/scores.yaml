    notes: "1번 상의 칼라가 원본의 연한 하늘색보다 흰색에 가깝고, 목선이 원본 라운드넥이 아니라 V넥으로 보임. 원본은 허리에서 끝나는 크롭 기장인데 벨트 라인까지 길게 내려와 몸에 붙는 핏. 손가락에 은색 반지가 있음(목록에 없는 소품, 10-22 점검 기준 clean 0). 얼굴은 옆모습에 안경과 올림머리라 일부만 보여 괜찮고, 입술은 진한 버건디로 화장이 진해짐. 신발 두 짝 모두 앞코가 오른쪽이고 개수는 맞음. 가방은 1개, 안경은 1개, 벨트는 하의에 입혀짐. 요청한 허리라인은 옆모습이라 가슴에서 벨트까지 거의 일자로 떨어져 아직 통짜로 보이고, 어깨도 눈에 띄게 넓어지지 않음."
