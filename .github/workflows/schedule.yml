name: schedule

# 9단계 매일 자동 실행. 계정마다 profile.yaml schedule 의 시각에 깨어나 할 일을 찾는다 (tools.schedule).
# Claude 는 부르지 않고, 무거운 작업은 워크플로 실행 요청으로 넘긴다:
#   candidates → daily (mode=candidates: 코디 후보를 텔레그램으로, 이미지 AI 없음)
#   pick       → 고른 번호 확인. 고르면 daily (mode=render: 고른 코디만 코디컷 생성), "다시"면 새 후보
#   publish    → publish (/ok 가 있으면 게시, 없으면 publish_retry_every 뒤 다시)
#   themes / collect / token → themes / collect / token 워크플로
#   comments   → 댓글 확인 → DM 코디 링크 (10단계, tools.comments, 이 job 안에서 바로).
#                profile comments.check_at 에 따로 깨어나고, 다른 작업 때도 같이 본다
#   share      → 게시 알림에 답장한 공유리워드 링크를 게시 기록에 넣고 상품 페이지를 다시 올림
#                (monetize: manual_link, tools.share, 다른 작업 때 같이)
#   fix        → 미리보기에 온 /fix 피드백을 data/<계정>/feedback.jsonl 에 쌓고, 다시 만들 것이면
#                daily (mode=fix: 같은 기획을 피드백대로 고쳐 새 미리보기, 15단계 tools.feedback)
# 아래 cron 줄은 `uv run python -m tools.schedule sync` 가 프로필에서 만든다 (UTC). 직접 고치지 않는다.
# 12단계: GitHub 예약은 자주 빠지거나 몇 시간 늦어서, 외부 스케줄러(cron-job.org)가 정시에
# workflow_dispatch(cron=auto)로 깨우고 GitHub 예약은 예비로 남긴다 (README "외부 스케줄러").
# 어느 쪽으로 깨어나든 auto 모드로 "지금까지 해야 했는데 안 한 칸"을 찾아 하고,
# 한 칸은 daily-results 의 ticks.json 에 기록해 한 번만 한다. 놓친 주요 작업·30분 넘는 지연은 텔레그램 알림.
# 수동으로 시험하려면 Actions 탭 "Run workflow" 에 auto 나 cron 줄을 넣는다
# (cron 줄은 그 칸을 기록과 상관없이 다시 함. dry_run 이면 실행 요청은 보내지 않음).
on:
  schedule:
    # >>> tools.schedule sync (직접 고치지 말고 profile.yaml schedule 을 바꾼 뒤 sync)
    - cron: "0 0 * * *"  # women candidates 09:00
    - cron: "0 1 * * *"  # women pick 10:00
    - cron: "0 9 * * *"  # women pick 18:00
    - cron: "0 9 * * 6"  # women themes 토 18:00
    - cron: "0 10 * * 0"  # women token 일 19:00
    - cron: "0 13 * * *"  # women remind 22:00
    - cron: "0 19 * * 0,3"  # women collect 월,목 04:00
    - cron: "0 20 * * *"  # women remind 05:00
    - cron: "0 22 * * *"  # women publish 07:00
    - cron: "0 23 * * *"  # women publish 08:00, women rules 08:00
    # <<< tools.schedule sync
  workflow_dispatch:
    inputs:
      cron:
        description: auto (지금까지 안 한 칸을 찾아서) 또는 흉내 낼 cron 줄 (tools.schedule list 참고)
        required: false
        default: auto
      dry_run:
        description: 시험 (워크플로 실행 요청·텔레그램 알림·결정 기록 없이 무엇을 할지만 보여 줌)
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: schedule
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # GitHub 예약으로 깨어나도 auto (늦게 깨어났으면 밀린 칸을 따라잡고, 이미 한 칸은 건너뜀)
      CRON: ${{ github.event_name == 'schedule' && 'auto' || inputs.cron || 'auto' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev

      - name: 결과 가져오기 (daily-results 브랜치)
        run: |
          if git fetch origin daily-results 2>/dev/null; then
            git worktree add /tmp/results origin/daily-results
            git -C /tmp/results checkout -B daily-results
          else
            mkdir -p /tmp/results
          fi

      - name: 할 일 실행
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 댓글 DM: 계정마다 Secret 이름이 profile instagram 에 있어서 JSON 으로 넘기고,
          # tools.comments 가 그 계정의 두 이름만 꺼내 쓴다 (값은 로그에 가려짐)
          IG_SECRETS: ${{ toJSON(secrets) }}
          # 공유리워드 링크를 반영한 상품 페이지를 사진 저장소에 올림 (tools.share)
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          uv run python -m tools.schedule due --cron "$CRON" --results /tmp/results
          uv run python -m tools.schedule run --cron "$CRON" --results /tmp/results \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 결정 기록 커밋 (실행한 칸, 고른 번호, 주제 다시 정하기, 댓글 DM, 공유리워드 링크, 피드백)
        # 실행 요청을 보낸 뒤 실패해도 한 칸 기록은 남겨야 두 번 보내지 않는다
        if: ${{ always() && !inputs.dry_run }}
        run: |
          commit() {  # 폴더, 브랜치, 메시지, 파일(pathspec)
            [ -d "$1/.git" ] || [ -f "$1/.git" ] || return 0
            git -C "$1" add -- "${@:4}" 2>/dev/null || return 0
            git -C "$1" diff --cached --quiet && return 0
            git -C "$1" -c user.name="github-actions[bot]" \
              -c user.email="41898279+github-actions[bot]@users.noreply.github.com" commit -m "$3"
            for i in 1 2 3; do
              git -C "$1" pull --rebase --autostash origin "$2" && git -C "$1" push origin "HEAD:$2" && return 0
              sleep $((i * 5))
            done
            return 1
          }
          commit /tmp/results daily-results "자동 실행 기록" ticks.json
          commit /tmp/results daily-results "코디 고르기 기록" ':(glob)*/picks/**'
          commit /tmp/results daily-results "상품 링크 보낸 기록" ':(glob)*/links.json'
          commit /tmp/results daily-results "승인 기록" ':(glob)*/approval.json'
          commit . "${{ github.ref_name }}" "주제 다시 정하기 요청" ':(glob)data/*/themes_review.json'
          commit . "${{ github.ref_name }}" "댓글 DM 기록" ':(glob)data/*/dm.json'
          commit . "${{ github.ref_name }}" "공유리워드 링크" ':(glob)data/*/posts.json'
          commit . "${{ github.ref_name }}" "이미지 피드백 기록" ':(glob)data/*/feedback.jsonl'

      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: "자동 실행(schedule) 실패: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: .github/scripts/alert.sh
