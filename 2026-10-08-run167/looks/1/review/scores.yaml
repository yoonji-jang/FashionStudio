    notes: 2번 티 목선 안쪽에 작은 글자 라벨이 그려져 있음(원본에 없음). 1번 맨투맨이 원본보다 짧고 몸판이 작아졌고 벌룬 소매 볼륨이 약해짐. 가방이 맨투맨 소매에 겹치고 부츠 윗부분이 치마 모서리에 닿음. 치마가 맨투맨에 비해 작아 보임. 안경은 목선 위에 얹혀 있음.
summary: c2 는 색과 상품 구성은 원본과 맞지만, 티 목선에 글자가 그려져 있고 맨투맨이 짧아졌으며 가방과 부츠가 옷에 겹쳐서 0점 항목이 있어 통과 기준에 못 미침.
