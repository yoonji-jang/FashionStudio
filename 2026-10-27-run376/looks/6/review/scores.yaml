    notes: >-
      3번 스웻팬츠는 상품 사진이 밑단이 열린 와이드 스트레이트인데, 그림은 발목이 고무줄로 오므려진 조거 밑단이다.
      다만 기준 코디 사진(worn_ref)도 밑단이 오므려져 있어 기준 코디와는 맞는다. 상품과 다른 작은 차이로 보고 1점만 깎았다.
      2번 후드는 원본이 얇은 저지인데 그림은 조금 도톰한 기모처럼 보인다. 나머지는 원본과 같다.
      얼굴은 모자 아래 옆모습이라 작고 갸름하며 face 특징과 맞고, 눈은 거의 보이지 않아 쌍꺼풀은 확인할 수 없다.
      글자는 모자 로고와 가방 로고뿐인데 둘 다 상품에 있는 것이다.
