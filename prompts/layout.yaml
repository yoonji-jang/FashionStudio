# 카테고리별 기본 배치 지시. compose 지시문의 $layout 자리에 들어간다.
# 계정과 무관한 기본값이고, 5단계에서 art-direct 스킬이 코디마다 바꿔 쓸 수 있다.
아우터: the outer layer in the upper center, sleeves slightly spread, worn open over the top
상의: the top layered inside the outer so its collar and front show, or in the upper center if there is no outer
원피스: the dress in the center, full length visible
하의: the bottoms in the lower center directly below the top, legs straight and slightly apart
가방: the bag on the left side at waist height
신발: the pair of shoes at the bottom, next to the hem of the bottoms
소품: the accessory on the right side near the waist
