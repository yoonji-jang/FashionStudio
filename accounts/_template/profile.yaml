# 새 계정용 틀. /new-account 스킬(5단계)이 이 파일을 복사해 채운다.
# 복사 후 id 를 폴더 이름과 같게 바꾸고 accounts/index.yaml 에 추가할 것.
id: _template
display_name: 새 계정
language: ko

audience:
  gender: women  # women | men | unisex
  age_range: [20, 34]
  description: 대상 독자 설명

style:
  keywords: [미니멀]
  palette: []
  avoid: []

outfit:
  items_min: 5
  items_max: 7
  slots:
    - {category: 상의}
    - {category: 하의}
    - {category: 가방}
    - {category: 신발}
  reuse_cooldown_days: 14
  max_per_shop: 2

themes:
  per_week: 7
  type_mix: {아이템: 2, 상황: 2, 컬러무드: 1, 타깃: 1, 팁: 1}
  consider: [계절, 날씨, 요일, 시즌 이벤트]
  events: []
  no_repeat_days: 30
  avoid: []
  review_before_use: true
  weather: null  # 예) {name: 서울, lat: 37.57, lon: 126.98}

product_source:
  name: zigzag  # sources/<name>.py
  min_rating: 4.5
  min_reviews: 20
  prefer_flat_shot: true
  queries:  # 카테고리별 검색어
    상의: [셔츠, 니트]
    하의: [슬랙스]
  per_query: 10
  max_per_category: 60
  recheck_days: 3

visual:
  backdrop: light-grey textured plaster surface, soft studio light
  backdrop_ref: null
  feed_ratio: "4:5"
  font: Pretendard-Bold.otf  # 제목 모양 항목은 README의 visual 표 참고 (생략하면 기본값)
  logo_text: "@계정이름"

feed:  # 캐러셀 구성 (생략하면 기본값). 항목은 README의 feed 표 참고
  slides: [cover, products, summary]  # 댓글 DM 을 켜면 끝에 comment (상품 정보는 댓글로 안내 장)
  cta_lines: [저장해 두고 코디 고민될 때 꺼내 보세요, "매일 아침 코디는 {logo}"]

copy:  # 제목·문구·캡션 규칙. 생략한 값은 기본값 (README 참고)
  base_hashtags: []
  banned: []

ai_label:  # 이미지 안에 AI 합성 표시(IPTC)를 넣어 인스타 "AI 정보" 레이블을 받는다 (README 참고)
  mode: metadata
  slides: [cover]

review:  # 7단계 이미지 검수. 생략하면 기본값 (README 참고)
  candidates: 2
  min_score: 8

outfit_image:  # 표지 코디컷 만드는 방식. 생략하면 기본값 (README 참고)
  engine: generate           # generate(생성형 AI) 또는 photoroom(누끼 배치)
  scene: smooth warm light-grey linen-textured floor, soft natural window light from the upper left
  outer_styling: ""          # 아우터를 어떻게 입힐지 (영어)

schedule:  # 매일 자동 실행 시간표. 바꾸면 python -m tools.schedule sync (README 참고)
  timezone: Asia/Seoul
  candidates_at: "10:17"
  pick_deadline: "15:17"
  publish_at: "20:03"
  themes_at: "일 18:17"
  collect_at: "월,목 04:17"
  token_refresh_at: "일 18:47"
  reels_at: null

pick:  # 코디 후보를 텔레그램으로 보내고 고른 것만 만든다. 생략하면 기본값
  count: 5
  on_timeout: first

comments:  # 댓글 → DM 코디 링크 (README 10단계)
  enabled: false
  mode: external   # external(ManyChat) / builtin(자동 실행 때 확인, 켜면 tools.schedule sync)
  keywords: [정보]

link_page:  # 최근 게시물 상품 링크 페이지 (ManyChat DM 에 넣는 주소)
  enabled: true
  title: 코디 상품 모음

monetize: none  # manual_link: 게시 알림에 답장한 공유리워드 링크를 상품 페이지에 씀, 광고 표기 자동
approval: required

instagram:
  token_secret: IG_NEWACCOUNT_TOKEN
  user_id_secret: IG_NEWACCOUNT_USER_ID
