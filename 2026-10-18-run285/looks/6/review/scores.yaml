    notes: "1번 자켓은 노칼라, 허리 기장, 단추 4개로 원본과 같지만 단추가 금속 체인보다 진주나 크리스털 장식처럼 보이고 패치 포켓은 왼쪽 한 개만 보임. 오른쪽 포켓은 가방과 팔에 가려 확인 안 됨. 자켓 오른쪽 자락이 팔에 끼지 않고 어깨에서 망토처럼 뒤로 넘어가 입은 모양이 어색함. 2번 블라우스는 원본이 둥근 V넥인데 후보는 셔츠 칼라가 서 있어 목선이 다름. 두께는 비침이 있고 허리 쪽이 스커트 안에 단정히 들어가 있어 괜찮음. 3번 스커트는 일자 기장, 앞트임, 무광 소재가 원본과 같음. 5번 앵클부츠는 앞코와 낮은 굽이 원본과 맞고 한 켤레 2짝임. 4번 위빙 버킷백, 6번 실버 후프 귀걸이(한쪽만 보임)도 맞음. 얼굴은 폰으로 가려 일부만 보임. 글자나 없는 물건 없음. 전신이 보이고 부츠도 잘리지 않음."
