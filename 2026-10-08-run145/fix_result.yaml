changes:
  - "1장 표지 제목: '브라운 스웨이드로 채운 / 가을 데일리룩 모음' 으로 바꿈 (코디 모음 제목, 코디컷은 그대로)"
  - "2장 LOOK 1: 요청대로 다시 그리지 않음 (지난 검수 점수 그대로)"
  - "3장 LOOK 2: 밤 길가 연석 플래시 장면 + 낮은 포니테일로 다시 그림 (검수 8/10, 요청 반영 확인)"
  - "4장 LOOK 3: 흐린 날 공원 벤치 책 읽기 + 반묶음 머리로 다시 그림 (검수 9/10, 요청 반영 확인)"
  - "5장 LOOK 4: 한낮 횡단보도 장면으로 다시 그리고 팬츠를 신발을 덮는 풀 기장으로 고침 (검수 7/10, 기장은 아직 신발이 보임 - 사람 확인 필요)"
  - "6장 LOOK 5: 저녁 동네 가게 앞 + 가운데 가르마 머리로 다시 그림 (검수 9/10, 요청 반영 확인)"
  - "7장 댓글 안내 장: 피드백 없음, 그대로"
  - "캡션 도입 한 줄은 '어제 올린 코디...' 그대로 둠 (요청은 표지 제목만)"
