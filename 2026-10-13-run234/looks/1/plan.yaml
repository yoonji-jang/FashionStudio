styling: The jacket is worn open with the sleeves slightly pushed up; the black henley
  buttons are partly undone. The two ankle boots are laid as one neat pair, side by
  side at exactly the same angle with the toe tips level, never splayed in a V. The
  denim keeps the wide straight fit it has on the model in its product photos, the
  legs staying wide down to the hem and never tapering toward the ankle, and they
  run full length so the hem reaches down onto the boots, never ending above the ankle.
