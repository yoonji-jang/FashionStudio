    notes: 1번 가디건은 원본 사진에서 단추가 있고 몸에 맞는 슬림 핏인데, 후보는 단추 없는 오버핏 오픈 가디건이고 기장도 치마 밑단 근처까지 길다. 6번 목걸이는 가슴 위에 올려져 있어 작게 보인다. 5번 신발은 두 짝의 앞코 높이가 조금 어긋나 있다. 3번 치마 플리츠와 플레어 바지, 2번 니트와 4번 가방은 원본과 같고, 허리선은 위쪽 30% 정도로 적당하며 좌우 균형도 맞다.
summary: c1 은 색, 구성, 치마 바지 핏과 허리 디자인, 배치가 대체로 원본과 맞다. 감점은 가디건이 원본의 슬림 단추 핏이 아닌 오버핏 오픈형으로 그려진 것과 신발 두 짝이 살짝 어긋난 것이다. 합계는 8점이고 0점 항목은 없다.
