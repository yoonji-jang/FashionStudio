    notes: "1번 가디건은 원본처럼 V넥에 단추가 6개쯤 보이고 가슴 로고도 있어 작년 피드백의 단추 수 문제는 없음. 6번 귀걸이는 한 쌍(2개)으로 맞지만 작고 두툼한 물방울 후프 형태를 알아보기 어려움. 4번 가방은 손잡이가 두 개인 토트처럼 그려졌고 원본은 한 줄 숄더 호보형이라 실루엣이 다름. 3번 슬랙스는 허리 턱이 약하고 옆 단추탭이 가디건에 가려 안 보이며 오른쪽 밑단이 어색하게 겹침. 5번 로퍼 안쪽에 아주 작은 글자 같은 자국이 보임. 가방 손잡이가 가디건 소매 끝에 살짝 닿음."
