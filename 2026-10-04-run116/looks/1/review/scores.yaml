    notes: "5번 가방이 원본(브라운 스웨이드 호보백)과 달리 매끈한 가죽 크로스백으로 바뀌고 긴 스트랩이 생김. 4번 슬랙스가 원본 차콜보다 푸르스름한 회색. 셔츠 목 뒤쪽에 작은 라벨 글자가 그려져 있음. 1번 트렌치(88cm)가 4번 바지(100cm)보다 길게 보임 (코트 약 740px, 바지 약 650px). 단추 없는 니트 조끼, 이중 단추 트렌치, 노치드 라펠, 신발 2짝, 스카프 매듭은 원본대로이고 제목 자리(왼쪽 아래)도 비어 있음."
summary: "c2 는 c1 에서 지적받은 니트 조끼 단추는 없앴고 겹침 순서도 맞음. 하지만 가방 종류가 원본과 다르고 셔츠에 글자 라벨이 있으며, 코트가 바지보다 길어 비율이 어긋남. 합계 6점에 clean 0점이라 통과 기준(8점 이상, 0점 항목 없음)에 못 미침."
