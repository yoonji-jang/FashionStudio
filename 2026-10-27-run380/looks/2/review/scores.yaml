    notes: "색: 3번 시계는 기획 색이 브라운이라 갈색 가죽 스트랩으로 그렸는데 원본 사진 스트랩은 검정이라 1점. 나머지 니트(아이보리), 레이스 이너(블랙), 스커트(브라운), 롱부츠(탄 베이지), 가방(브라운)은 원본 색과 같다. 피드백 반영: 니트는 루즈한 앙고라 질감이고 밑단이 엉덩이 중간에서 끝나 허벅지까지 내려오지 않는다. 스커트는 니트 밑으로 약 10~12cm 보인다 (키 약 165cm 로 환산). 한쪽 밑단은 손으로 스커트 허리에 걸쳐 올렸고 다른 쪽은 늘어져 있다. 기준 코디 견줌: 여밈은 해당 없음(풀오버 니트)이라 같음. 품은 참고도 오버핏이고 그림도 루즈한 오버핏이라 같음. 기장 비율은 참고도 엉덩이쯤까지 덮고 아래로 미니가 조금 보여 같음. 개수는 신발 2짝, 시계 1개, 가방 1개로 맞다. 글자와 없는 물건은 없다. 얼굴은 작고 갸름해 얼굴 참고 기준에 맞고 뭉개지지 않았다. 테두리는 없고 전신이 다 보인다. 스튜디오 배경은 장면 사진과 같은 무드다."
