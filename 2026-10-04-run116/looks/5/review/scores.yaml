    notes: 1번 재킷은 하이넥을 지퍼로 올린 모양인데 여기서는 앞이 열려 셔츠 칼라와 가슴이 드러남. 허리 벨트 끈이 길게 늘어져 있어 원본 대비 확인 필요. 5번 메리제인 안쪽에 작은 상표 글자가 보임 (원본 사진에도 상표가 있어 1점). 안에 입은 셔츠는 재킷 어깨 위로 올라오지 않고 목선과 소매 끝에서만 보여 겹침 순서는 정상.
summary: c2 는 7개 상품이 모두 보임. 니삭스는 한 쌍, 신발은 두 짝, 목걸이는 한 줄이고 색도 원본과 같음. 미디 스커트가 재킷보다 확실히 길고 왼쪽 아래 제목 자리도 비어 있음. 재킷 앞 여밈 모양과 신발 속 글자가 감점 요인이며, 합계 8점이고 0점 항목은 없음.
