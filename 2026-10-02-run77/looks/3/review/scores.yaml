summary: "c2 는 색과 구성은 원본과 맞고 신발 위치와 제목 자리도 괜찮지만, 가방 실루엣, 귀걸이 형태, 슬랙스 디테일이 원본과 조금씩 다르고 로퍼에 글자 같은 자국이 있어 7점이다. 0점 항목은 없다. 합계 8점 기준에는 못 미친다."
