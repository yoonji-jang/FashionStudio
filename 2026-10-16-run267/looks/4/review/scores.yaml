    notes: >-
      장면 모델컷. 얼굴은 고개를 숙이고 머리카락에 가려 일부만 보여 괜찮고, 헤어는 요청대로 가르마 슬릭번이다.
      장면 사진과 같은 장소(연녹색 벽, 물병 테이블)에서 앉은 다른 포즈이고, 전신이 보이며 실제 스냅처럼 자연스럽다.
      clean 0: 목록에 없는 반지가 오른손 손가락에 보인다. 장면 사진 속 사람의 옷과 가방은 섞이지 않았다.
      4번 가방: 원본은 지퍼 없이 윗면이 열린 매트한 토트형 숄더백인데, 지퍼 달린 네모난 토트로 모양이 달라졌다. 로고 메달리온과 손잡이 두 개는 맞다.
      3번 신발: 원본은 고무밴드 스트랩에 둥근 스퀘어토이고 앞코에 주름 절개가 있다. 여기는 버클 달린 스트랩에 앞코가 날렵해서 디테일이 다르다.
      1번 셔츠: 원본은 안 넣어 입는 힙 기장이다. 여기는 허리 안으로 반쯤 넣어 입은 것처럼 보인다.
      5번 목걸이: 실버 볼 체인이 아니라 진주 알 줄처럼 보이고 작아서 형태를 알아보기 어렵다.
      2번 블랙 플레어 트라우저는 플레어 핏과 길이가 맞고, 신발 앞까지 덮여 크롭으로 보이지 않는다.
