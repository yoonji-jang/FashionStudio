changes:
  - "2장 1번 벌: 신발을 같은 각도로 나란히, 데님은 밑단까지 같은 폭의 와이드 핏·신발 위까지 닿는 풀 기장으로 다시 그림 (검수 9/10, 후보 2장째)"
  - "3장 2번 벌: 니트를 허리에 매끈하게 넣어 입은 모양으로 다시 그림 (검수 8/10)"
  - "4장 3번 벌: 부츠 두 짝 나란히, 허리 부분 매끈하게 다시 그림 (검수 8/10)"
  - "5장 4번 벌: 부츠컷 데님 핏 유지·풀 기장으로 다시 그림 (검수 6/10, 신발에 CLARKS 글자가 그려져 사람 확인 필요)"
  - "6장 5번 벌: 허리 부분 매끈하게, 부츠컷 핏 유지·풀 기장으로 다시 그림 (검수 8/10)"
  - "1장 표지·7장 6번 벌·8장 댓글 안내: 피드백이 없어 그대로 둠 (표지는 1번 벌 코디컷이라 새로 그린 1번 벌로 바뀜)"
