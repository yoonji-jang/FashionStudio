changes:
  - "1장 표지(1번 벌): 퍼자켓을 목~배꼽까지 여미고 흰 티는 허리께만 보이게, 상세페이지처럼 퐁실한 핏, 울 쇼츠 기장 절반·허벅지에 붙게 처음부터 다시 그림 (검수 9/10)"
  - "2장 2번 코디: 니트를 엉덩이 중간 기장으로 늘리고 한쪽만 허리에 걸침, 치마는 약 10cm 만 보이게, 손 올린 포즈를 팔 내린 포즈로 바꿔 다시 그림. 첫 시도는 니트가 허벅지까지 와서 한 번 더 그림 (검수 9/10)"
  - "5장 5번 코디: 퍼자켓 풍성하게(상세페이지 느낌), 거의 여미기, 치마는 짧게 살짝만 보이게, 레그워머 더 길게 다시 그림 (검수 9/10)"
  - "참고: 3번 벌은 이번 피드백 대상이 아니라 그대로 두었고, 지난 검수가 8점(failed)으로 남아 사람 확인이 필요함"
  - "참고: 2장은 이번에 다시 그리면서 머리색·얼굴 인상이 이전 컷과 달라 보임 (검수는 통과)"
interpretation:
  - "1장: 바지는 반바지(울 쇼츠)라 '기장 절반'을 약 15cm 로, '허벅지에 거의 딱'을 슬림 핏으로 해석. 검수는 밑단 통이 아직 조금 남는다고 봄 (shape 1)"
  - "2장: '참고 코디컷과 동일한 핏'은 그 벌 참고 사진(src/refs/look_2.jpg)으로 해석"
  - "5장: '양말'은 그 벌의 아이보리 레그워머로 해석. 검수는 종아리 2/3 높이까지 길어졌다고 봄 (요청은 무릎 바로 위)"
