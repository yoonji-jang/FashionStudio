changes:
  - "2장 1번 코디: 이미지 속 숫자를 지우고 치마를 아래로 내려 허리 디자인이 니트 밑단 아래로 보이게 고쳐 그림 (검수 9/10, 부츠 방향 때문에 사람 확인)"
  - "4장 3번 코디: 바지 허리를 코트·니트 밑단 바로 아래로 내리고 밑단을 발목까지 길게 고쳐 그림 (검수 8/10 통과)"
  - "5장 4번 코디: 치마를 허리라인으로 올리고 니트 밑단을 치마 안에 자연스럽게 넣고 숫자를 지워 고쳐 그림 (검수 9/10 통과)"
  - "7장 6번 코디: 티셔츠 밑단을 치마바지 허리 안에 살짝 넣은 모양으로 고쳐 그림 (검수 7/10, 부츠 방향 때문에 사람 확인)"
