    notes: 3번 신발은 두 짝이 나란히 세워졌고 앞코가 위를 향하며 높이도 맞아 가지런함(c1 에서 고쳐짐). 남은 문제는 두 가지. 첫째, 허리 비율. 깃에서 허리띠까지 ÷ 깃에서 바지 밑단까지가 약 0.29로 0.33 미만이고, 가디건 몸판(약 310px)이 가슴 폭보다 짧게 눌려 보임. 바지가 가디건 대비 크게 그려졌음. 둘째, 1번 가디건 밑단이 일자이고 단추가 4~5개로 원본의 둥근 크롭 밑단과 조금 다름. 4번 가방 끈 안쪽에 가디건 소매 끝이 닿고 가방이 바지 왼쪽 허리 옆에 붙어 있음. 2번 바지의 핏, 원턱, 기장과 5번 목걸이 1개는 원본과 같음. 소재(가디건 매끈한 니트, 가방 광택 위빙, 슬랙스 결)는 원본에 가깝고 글자는 없음.
    faults: [waist_off]
slides: []
summary: c2 는 신발이 가지런해져 c1 보다 낫지만, 둘 다 가디건 몸판이 눌려 허리 비율이 0.29로 낮아 waist_off 결함이 있어 불합격이다. 다시 그릴 때는 가디건 몸판을 바지 대비 더 길게 그리고(바지 통과 기장은 줄이고), 가방을 소매에서 띄우면 좋다.
