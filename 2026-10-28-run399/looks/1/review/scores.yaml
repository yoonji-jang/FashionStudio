    notes: "3번 가방은 검정 체인 숄더백이 맞지만 몸에 가려지고 작아서 퀼팅 쉐브론 결과 금색 V 장식이 또렷하지 않음 (작은 디테일 차이). 1번 앙고라 원숄더 니트 원피스는 소재·색·기장이 상세 사진과 같음 (보송한 질감, 밑단은 허벅지 윗부분, 슬림핏). 2번 블랙 스웨이드 니하이 부츠는 두 짝, 무릎 위 기장, 낮은 블록힐로 상품과 같음. 신발은 서 있는 모습이라 shoes_not_neat 대상 아님. 4번 시스루 블랙 스타킹은 요청대로 신겨져 있고 다리 위에 비침이 보임. 5번 골드 귀걸이는 양쪽 귀에 한 쌍으로 작게 보임. 여밈: 기준 코디는 원피스를 루즈하게 입고 니하이 부츠에 시스루 스타킹, 그림도 같은 입는 모양 → 같음. 요청 반영: 시스루 스타킹 반영됨. 굵은 웨이브 머리는 가슴 아래까지 오는 풍성한 웨이브라 반영됨 (더 부풀어도 좋음). 얼굴: 정면에 가까운 얼굴이 보이나 이 게시물은 허용. 얼굴 사진과 비교하면 앞머리 없이 가운데 가르마이고 머리색이 더 검어서 얼굴 다름 (감점하지 않음). 얼굴은 흐리거나 뭉개지지 않았음. 장면 무드는 밝은 회색 심리스 벽의 스튜디오 룩북 컷으로 맞음. 전신이 보이고 테두리와 글자 없음. 다리 비율 좋음. 포즈는 한 손에 체인을 쥔 편안한 포즈이지만 다소 곧게 서 있음 (감점하지 않음)."
