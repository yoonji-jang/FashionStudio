summary: "c1 은 요청 3개를 모두 반영함. 가디건이 아이보리 트위드 자켓으로 바뀌었고, 필름 카메라 대신 스마트폰 셀카이며, 화병과 마른 가지가 없음. 다만 블라우스 칼라가 원본 둥근 V넥과 다르고 자켓 단추 모양과 어깨에 걸친 오른쪽 자락이 어색해 합계 8점임. 0점 항목과 결함은 없음."
