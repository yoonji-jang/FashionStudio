    notes: "1번 니트는 원본이 밝은 회베이지 섞인 성근 슬러브 니트이고 목선이 넓은 스쿱/브이에 가까운데, 그림은 균일한 중회색 모헤어 라운드넥이라 색이 조금 어둡고 목선이 다름. 5번 벨트는 원본이 폭 3cm쯤의 얇은 벨트에 각진 은색 버클인데 그림은 폭 5cm쯤으로 굵음. 여밈·입는 모양: 참고는 니트를 밖으로 꺼내고 그 위에 벨트, 회색 양말과 부츠, 보스턴백을 손에 든 모양이고, 그림도 같아서 0점 요소 없음. 2번 골지 스커트 질감과 기장은 원본과 같게 보임. 3번 부츠는 굵은 버클 스트랩 2개, 둥근 앞코, 낮은 굽, 주름진 가죽 광택이 맞음. 4번 가방은 삼각 플레이트와 손잡이 2개가 맞음. 얼굴 다름: 얼굴 사진은 갈색 웨이브에 둥근 얼굴, 그림은 검은 슬릭번에 갸름한 얼굴이라 다른 사람 같지만 감점하지 않음. 얼굴은 뭉개지지 않았고 정면이 보여도 되는 게시물임. 스튜디오 무드, 전신, 테두리·글자 없음, 다리 비율 모두 문제 없음."
    faults: []
slides: []
summary: c1 은 기준 코디와 같은 입는 모양이고 상품 구성이 모두 맞으며 결함이 없다. 다만 니트의 색과 목선이 원본보다 단순하고, 벨트가 원본보다 굵다. 합계 8점으로 통과 기준에 걸친다.
