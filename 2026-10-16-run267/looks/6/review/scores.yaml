covers:
  - id: c2
    color: 2
    shape: 1
    complete: 1
    clean: 0
    layout: 2
    notes: >-
      5번 귀걸이는 한쪽만 보이고 둥근 은색 한 알 모양이라 실버 두줄 디자인으로 알아보기 어려움.
      목에 가는 금색 목걸이가 보이는데 목록에 없는 소품이고 장면 사진 속 사람에게도 없어서 clean 0.
      2번 슬랙스는 주름 없이 벨트고리가 보이고 스트레이트 핏이 원본과 같지만, 밑단이 발목 위에서 끝나 로퍼가 다 드러나 약간 짧아 보임.
      손목의 시계는 없어져 c1 문제가 고쳐짐. 손에 반지도 없음.
      1번 베이지 랩 블라우스는 깃과 교차 여밈이 원본과 같고 앞만 살짝 넣어 입음.
      3번 로퍼는 검정 스웨이드에 둥근 앞코이고 두 짝이 나란함. 페니 장식은 작아서 확인이 어려움.
      4번 호보백은 블랙 위빙으로 원본과 같음.
      얼굴은 고개를 숙이고 머리카락이 가려 정면이 아니고 도구 얼굴 확인 사진에서도 옆얼굴 일부만 보임.
      장면은 같은 전시장 배경(세이지 벽, 테라조 바닥, 흰 테이블, 물병, 철제 난간)이고 무드가 비슷함.
      장면 사진 속 검은 점프수트와 흰 칼라는 섞이지 않았고 포즈는 복사 수준이 아님.
      전신이 보이고 테두리 없음. 사람은 장면 속 사람과 닮지 않음. 테이블과 물병 라벨은 배경이라 감점하지 않음.
      헤어는 낮은 쪽머리에 가운데 가르마라 슬릭번 요청이 반영됨. 잔머리가 조금 내려와 있지만 허용 범위.
    faults: []
    feedback_ok: true
slides: []
summary: >-
  c2 는 c1 의 시계 문제를 고쳤고 옷의 색과 핏이 원본과 대체로 같으며 전신과 장면 무드가 좋고 슬릭번도 반영됨.
  다만 목에 목록에 없는 금색 목걸이가 있어 clean 0 이고, 귀걸이가 실버 두줄로 보이지 않음. 합계 6점에 0점 항목이 있어 불합격.
  다시 그릴 때는 목걸이를 없애고 실버 두줄 귀걸이를 양쪽 다 보이게 한다.
