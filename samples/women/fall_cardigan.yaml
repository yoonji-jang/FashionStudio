# 새 주제 예시: 가을 데일리 니트 가디건 코디. 상품은 지그재그 공개 상품 페이지 (검색 결과 기준, 2026-09-26).
# fall_leather 와 같은 규칙(누끼 → AI 다듬기 → 입히기 → 실제 비율 배치 → AI 그림자)으로 만든다.
account: women
name: 가을 니트 가디건 코디
items:
  - category: 아우터
    # 색은 상품 사진을 따르도록 설명에 적지 않는다 (대체 상품으로 넘어가도 색을 AI가 바꾸지 않게)
    desc: 브이넥 니트 가디건 (V-neck knit cardigan)
    cm: 62  # 가디건 기장 + 아래로 살짝 보이는 셔츠 밑단
    url: https://zigzag.kr/catalog/products/159882348
    alternates:  # 128158135, 130051440 은 판매 종료 (run-20)
      - https://zigzag.kr/catalog/products/154472872
      - https://zigzag.kr/catalog/products/144640737
      - https://zigzag.kr/catalog/products/133120535
  - category: 상의
    desc: 화이트 기본 슬림핏 셔츠 (white basic slim fit shirt)
    url: https://zigzag.kr/catalog/products/108849056
    alternates:
      - https://zigzag.kr/catalog/products/120008696
    wear_with: 아우터
    # over(셔츠를 본 이미지로)는 가디건을 셔츠 위에 작게 붙였다 (run-21). 가디건을 본 이미지로 먼저 시도
    wear_modes: [direct, over]
    wear_how: >-
      the V-neck cardigan is worn buttoned closed over the shirt, exactly as a person wears it,
      both at the same real body size (the cardigan is as wide as the shirt, never smaller):
      the white shirt collar is spread over the cardigan V neckline, the shirt sleeves are hidden
      inside the cardigan sleeves with only the shirt cuffs peeking out, and a little of the shirt
      hem shows below the cardigan
  - category: 하의
    desc: 연청 와이드 데님 팬츠 (light blue wide leg jeans)
    url: https://zigzag.kr/catalog/products/137809552
    alternates:
      - https://zigzag.kr/catalog/products/121270655
  - category: 가방
    desc: 블랙 가죽 숄더백 (black leather shoulder bag)
    segment: bag
    url: https://zigzag.kr/catalog/products/130666541
    alternates:
      - https://zigzag.kr/catalog/products/131513241
  - category: 신발
    desc: 블랙 가죽 로퍼 (black leather loafers)
    segment: shoe
    url: https://zigzag.kr/catalog/products/129664032
    alternates:
      - https://zigzag.kr/catalog/products/137758810
  - category: 소품
    desc: 금장 버클 가죽 벨트 (leather belt with gold square buckle)
    segment: belt
    url: https://zigzag.kr/catalog/products/153552340
    alternates:
      - https://zigzag.kr/catalog/products/136789215
    wear_with: 하의
    wear_how: >-
      the belt is threaded through the belt loops of the jeans waistband with the buckle fastened
      at the front center
  # 주얼리는 과하지 않게 두 개, 상의 오른쪽 빈 공간
  - category: 소품
    slot: 목걸이
    desc: 실버 물방울 펜던트 목걸이 (silver teardrop pendant necklace)
    segment: necklace
    url: https://zigzag.kr/catalog/products/146334491
    alternates:
      - https://zigzag.kr/catalog/products/111136004
  - category: 소품
