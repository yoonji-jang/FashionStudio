changes:
  - "1장 표지(1번 벌): 퍼자켓을 지퍼 가슴 위까지 거의 다 여미고 흰 티는 목에만 보이게 처음부터 다시 그림 (검수 9/10). 자켓 주머니에 손 넣는 포즈는 여민 모양을 벌려 손잡이 잡는 포즈로 바꿈"
  - "2장 2번 벌: 니트를 엉덩이 절반 덮는 루즈한 기장·한쪽만 허리에 걸치게, 치마는 절반만 보이게 요청을 styling 에 적어 다시 그림 (검수 8/10, 통과). 그림에는 니트가 아직 허리 근처에서 끝나고 한쪽 걸침도 안 보임 → 요청이 덜 반영됨, 사람 확인"
  - "3장 3번 벌: 시스루 삭스를 빼고 시스루 검은 스타킹으로 다시 그림 (스타킹 반영됨). 벌 상품이 4개로 줄어 최소 5개를 맞추려고 실버 볼체인 목걸이(zigzag:113341770)를 더함. 검수 8/10 이지만 자켓을 손으로 벌린 포즈가 참고 여밈과 달라 통과 못 함 → 사람 확인"
  - "4장 4번 벌: 긴 웨이브 머리, 모자는 상세 사진대로 귀덮개·끈 없는 둥근 퍼 모자(샤프카 설명 고침), 울 쇼츠(zigzag:166183665)로 교체하고 최대한 짧게, 자켓은 두껍고 오버핏인 레더 자켓(zigzag:148146251)으로 교체, 검은 스타킹 위에 두꺼운 어두운 레그워머(zigzag:168607993) 추가 (검수 9/10)"
  - "4장 자켓 색: 두껍고 오버핏인 검은 자켓이 창고에 없어 사진이 있는 다크 브라운으로 바꿈 (참고 코디는 블랙). 색이 맞는지 사람 확인"
  - "4장 문구: 퍼 샤프카가 아니라 퍼 모자·검은 라이더가 아니라 오버핏 레더로 point·reason·캡션 LOOK 4 줄을 고침"
  - "5·6장 코디, 7장 댓글 안내: 말하지 않아 그대로 둠 (지난 검수 점수 유지)"
