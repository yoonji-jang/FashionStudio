changes:
  - "3장 2번 벌: 부츠 한 켤레 평행·밑단 곧게·허리 턱 주름 금지·가디건이 목선 안 가리게 지시를 더해 다시 그림 (검수 8/10, 부츠는 아직 V자라 요청 일부 미반영)"
  - "4장 3번 벌: 쇼츠·부츠를 더 아래로, 나시 밑단 숨김 지시로 다시 그림 (검수 8/10, 허리 디자인은 보임, 부츠 가장자리가 글자 자리에 조금 걸침)"
  - "5장 4번 벌: 치마 무릎 기장(48cm, 밑단 60→50cm)·H라인, 헨리넥 단추 3개로 다시 그림 (검수 8/10, 단추가 4개쯤으로 보여 확인 필요)"
  - "6장 5번 벌: 그림 속 숫자·글자 금지, 1자 새틴 스커트 볼륨·주름 지시로 다시 그림 (검수 6/10 통과 못 함, 사람 확인 필요)"
  - "7장 6번 벌: 바지를 워시드 블랙·카고 플랩 주머니·좁아지지 않는 와이드 핏으로 다시 그림 (검수 8/10)"
  - "1장 표지: 콜라주 표지를 만들지 못해(옷 오려 내기 실패) 1번 벌 코디컷 표지로 대신함"
  - "1번 벌·8장 댓글 안내 장: 말한 적 없어 그대로 둠"
