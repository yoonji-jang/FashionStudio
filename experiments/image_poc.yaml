# 2단계 이미지 품질 실험 설정 (Photoroom). python -m tools.poc 가 읽는다.
# clean: true 면 누끼를 AI로 다듬고(가려진 부분 채우기) 입은 듯이 합친 뒤(자켓 속 셔츠 등) 배치한다.
# 모든 방식은 config/layout.yaml 의 실제 치수(cm)로 크기를 맞춘다.
# 샌드박스는 하루 100회라 기본 1회차만 돌린다 (1회차 약 20회 호출).
repeats: 1

variants:
  - id: A
    name: 누끼 그대로 + 실제 비율 배치 + 코드 그림자 (비교 기준)
    finish: code
  - id: B
    name: AI 다듬기·입은 듯한 코디 + 코드 그림자
    finish: code
    clean: true
  - id: C
    name: AI 다듬기·입은 듯한 코디 + Photoroom AI 그림자 (배경 사진 위)
    finish: ai_shadow
    clean: true
  - id: D
    name: AI 다듬기·입은 듯한 코디 + 장면 전체 AI 보정 (실제 촬영처럼)
    finish: ai_scene
    clean: true
