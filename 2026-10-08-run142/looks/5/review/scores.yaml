    notes: "6번 실버 빈 펜던트 롱 목걸이가 옆·뒷모습이라 전혀 보이지 않음 (상품 빠짐). 2번 화이트 홀터탑도 니트 안에서 보이지 않음. 1번 니트의 헨리넥 단추 2-3개 placket 이 확인되지 않고 칼라 형태만 보임. 5번 신발은 앞코가 둥근 블랙 로퍼이나 페니 장식은 확인되지 않음. 3번 연청 플레어와 4번 브라운 위빙 호보백은 원본과 같고 바지 밑단이 발등까지 내려옴. 얼굴은 고개를 숙인 옆모습이라 괜찮음. 배경은 실제 헌책방 앞 필름 사진처럼 자연스러움. 왼쪽 아래 제목 자리에 왼발 로퍼와 바지 밑단 일부가 걸침."
summary: c2 는 색, 기장, 가방, 얼굴, 배경이 자연스럽고 c1 보다 낫다. 하지만 c1 과 같이 옆·뒷모습이라 목걸이와 홀터탑이 보이지 않아 complete 0점이다. 통과 기준 미달이므로 앞이나 옆모습으로 목걸이와 홀터 네크라인이 보이게 다시 그려야 한다.
