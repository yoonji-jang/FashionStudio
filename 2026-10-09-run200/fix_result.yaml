changes:
  - "3장 2번 벌: 치마를 벨트(고리·버클)가 있는 허벅지 중간 기장 H라인으로 다시 그림, 부츠는 한 켤레 나란히 (검수 8/10 통과)"
  - "4장 3번 벌: 스커트 쇼츠를 더 아래로, 허리 디자인이 보이게, 부츠도 더 아래로 한 켤레 나란히 (검수 8/10 통과, 쇼츠 허리가 나시 밑단에 일부 가려짐)"
  - "5장 4번 벌: 새틴 스커트에 엉덩이·허벅지 볼륨과 광택, 슬링백은 한 켤레 나란히 (검수 7/10, 스커트가 원본보다 길어 사람 확인 필요)"
  - "6장 5번 벌: 오프숄더 홀터 니트와 1자 새틴 맥시 스커트, 볼륨, 신발 나란히 (검수 7/10, 스커트 밑단이 약간 퍼져 사람 확인 필요)"
  - "7장 6번 벌: 모헤어 가디건을 빼고 홀터 슬림 티를 겉 상의로, 바지 더 길게, 앵클부츠 나란히 (검수 8/10 통과, 바지 색이 원본보다 밝음)"
  - "맥시 스커트(5번 벌)와 브르노 미니스커트(2번 벌)의 실측 밑단(58cm)을 50~51cm 로 줄여 적음: A라인으로 그려지는 것을 막으려는 해석"
  - "1장 표지·2장 1번 벌·8장 댓글 안내 장: 피드백이 없어 그대로 둠"
