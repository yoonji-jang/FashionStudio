shot: flatlay
styling: The ivory knit keeps the product's point neckline, an asymmetric angular
  wide boat neckline with a folded edge that slips off the shoulders, never a round
  plain neckline, with the slim ribbed fit and the side-slit hem. The front hem of
  the knit is tucked a little into the skirt waistband, so the whole waistband of
  the skirt stays visible above the knit hem and is never covered by the knit or the
  cardigan. The burgundy cardigan lies behind the knit, hidden, and only a narrow
  band of it shows above the knit's shoulders; its two sleeves come forward over the
  shoulders and tie in one small loose knot on the upper chest, the sleeve ends hanging
  a little; the cardigan body, buttons and front edges never lie over the front of
  the knit like a cape or vest. The skirt is placed a little lower than before and
  is drawn with the exact design of its product photos. The boots are placed below
  the mini skirt hem, centered in the empty floor under it, not beside it. The necklace
  is drawn a little larger and hangs in the center of the chest, on the vertical center
  line, not on the right. The thin burgundy cardigan is draped over the shoulders
  with its body hanging behind the knit and its sleeves tied loosely in front of the
  chest. The skirt is drawn exactly like its product photos, a short, nearly straight
  H-line mini skirt ending at mid-thigh, never an A-line, flared or pleated fan, with
  its belt, belt loops and buckle clearly visible and the whole waist design shown,
  the belt and hem shape copied from the product photos. The two boots are one neat
  pair laid side by side, parallel, pointing the same direction and close together,
  not splayed apart.
