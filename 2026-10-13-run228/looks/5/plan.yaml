shot: flatlay
styling: The cardigan is worn loosely open over the beige mock-neck knit. The tucked
  part of the knit at the waist is smooth and natural like a real tuck, only a slight
  soft blouse of fabric above the waistband, with no bunched wrinkles, clumps or puffiness.
  The skirt-trousers keep exactly the fit they have on the model in their product
  photos, never narrowed into a tapered leg, and the trousers run full length so the
  hem reaches down to the shoes, never ending above the ankle.
