changes:
  - "1장 표지(1번 벌): 다리 비율 늘림, 블레이저 자연스럽게 열림, 바지 통 줄임, 상의 구김 줄임 - 요청은 반영, 귀걸이·바지 기장 때문에 검수 7/10 (사람 확인)"
  - "2장 2번 벌: 상체 줄이고 하체·허리선 높임, 흰 티 노출 줄임, 얼굴 입체감 - 검수 10/10 통과"
  - "3장 3번 벌: 허리선 높이고 상체:하체 약 1:2.3, 흰 티 노출 줄임, 스커트 종아리 중간쯤으로 줄임, 어깨 넓힘 - 검수 9/10 통과 (가디건이 실제보다 짧은 크롭이라 -1)"
  - "4장 4번 벌: 가디건 단추 쪽·치마 구김 줄이고 어깨 넓힘 - 검수 8/10 통과"
  - "5장 5번 벌: 흰 티 노출·앞머리·둥근 목선은 반영. 벨트가 아직 니트 위에 있고 바지가 발등을 덜 덮음 - 검수 8/10 (사람 확인)"
  - "6장 6번 벌: 얼굴 작게·화장 진하게는 반영. 허리라인·어깨 변화는 약하고 손가락 반지가 그려짐 - 검수 7/10 (사람 확인)"
  - "7장 댓글 안내 장·캡션·표지 제목: 피드백 없어 그대로 둠"
interpretation:
  - "1장 표지는 1번 벌 코디컷이라 1번 벌로 고침 (상품 구성·표지 제목 그대로)."
  - "코디컷은 모두 지난 그림을 edit_from 으로 고쳐 그림. 상품 변경 없음, 후보 추가 없음, 첨부 사진·참고 코디·장면 사진 언급 없음."
  - "3장 스커트: '종아리 살짝 위'와 실제 기장 88cm 를 함께 맞춰 desc·styling 을 '종아리 가장 굵은 곳 살짝 위'로 고침."
  - "5장 벨트: 바지 허리 벨트고리에 매고 니트·티는 벨트 밑으로 들어간 모양으로 해석."
unresolved:
  - "1번 벌: 목록에 없는 귀걸이, 바지 밑단 기장(발목 근처), 슬링백 앞코 벌어짐 (검수 최대 회차)"
  - "5번 벌: 벨트가 니트 위, 바지가 발등을 덮지 못함"
  - "6번 벌: 허리라인·어깨 반영 약함, 손가락 반지, 안경·목선 모양 차이"
