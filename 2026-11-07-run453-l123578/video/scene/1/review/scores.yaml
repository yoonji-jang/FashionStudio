    notes: "1번 블라우스: 기준 코디 사진(worn_ref)은 타이를 매듭 없이 목에서 길게 늘어뜨렸는데 그림은 목 앞에 큰 리본 매듭이 묶여 있음 (shape 1). 2번 스커트는 블랙 머메이드, 기장(종아리 중간)과 핏 모두 상품과 같음. 3번 신발은 블랙 포인티드 슬링백이고 양말도 상품 사진대로임. 4번 가방은 손에 든 블랙 스퀘어 숄더백으로 같음. 5번 귀걸이는 실버 링을 한 쌍으로 그림. 배경은 빈 배경 사진과 같은 장소·빛·카메라 높이이고 인물 그림자와 빛도 어울림. 전신 크기는 화면 세로의 약 66%로 지시한 75%보다 확실히 작음 (layout 1). 가운데 정면 서기, 양발 간격, 팔 내림은 지시대로이고 머리와 신발은 잘리지 않음. 한 사람만 있고 글자나 없는 물건 없음. 얼굴은 선명하고 뭉개지지 않음. 얼굴 사진과 비교한 결과는 이 검수에서 확인하지 않았고 불일치는 감점하지 않음. 다리 비율은 정상. 여밈 비교: 참고는 블라우스를 앞으로 늘어뜨린 타이이고 그림은 리본 매듭이라 다름 (shape 1로 반영)."
