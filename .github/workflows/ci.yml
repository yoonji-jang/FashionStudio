name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 봇이 GITHUB_TOKEN 으로 만든 PR(feedback-rules)은 pull_request 로 돌지 않아 직접 부른다
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run python -m core.profile
      - run: uv run pytest
