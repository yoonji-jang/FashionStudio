    notes: "c1 은 jacket, skirt, leg warmers, shoes, bag 가 모두 보이고 글자나 없는 물건은 없다. 얼굴은 갸름한 V라인에 흐리거나 뭉개진 곳이 없다. 테두리와 전신 비율도 문제없다. 스튜디오 무드는 장면 사진과 같다. 기준 코디 대조: 여밈은 참고가 단추로 거의 여민 모양이고 그림은 숄카라가 앞에서 겹쳐 거의 여민 모양이라 같다. 안의 흰 티는 목 쪽에 가늘게만 보인다. 품은 참고와 상품 모두 둥근 오버핏이고 그림도 둥글고 풍성하다. 기장 비율은 자켓이 엉덩이 위에서 끝나고 그 밑으로 아이보리 미니스커트가 살짝 삐져나온다. 참고보다 스커트가 조금 더 짧게 보이지만 이번 요청대로다. 감점 1건(shape 1): 퍼가 상세페이지의 긴 shaggy 결보다 조금 짧고 정돈돼 보여 풍성함이 덜하다. 참고의 단추 포인트도 그림에는 없다. 결함으로 볼 정도는 아니다. 레그워머는 종아리의 약 2/3 높이까지 올라오고 주름이 잡혀 있다. 요청한 무릎 바로 위까지는 아니지만 길어진 것은 분명하다. 두 짝이 다리에 겹쳐 있어 한쪽이 가려진 듯 보이지만 개수는 맞다. 신발은 끈 있는 스웨이드 로퍼이고 검보 크레이프 밑창이 보이며 두 짝이 서 있는 자세로 자연스럽다. 가방은 오른손에 든 브라운 호보백이다."
